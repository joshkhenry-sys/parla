<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Parla — Making Plans</title>

  <style>
    :root {
      --bg: #f7f7f4;
      --surface: #ffffff;
      --text: #171717;
      --muted: #777773;
      --border: #e5e5df;

      --blue: #536dff;
      --blue-soft: #edf0ff;
      --coral: #ed927c;
      --green: #78a58d;
      --green-soft: #edf5ef;

      --radius-xl: 32px;
      --radius-lg: 24px;
      --radius-md: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "SF Pro Text", Inter, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: min(920px, calc(100% - 40px));
      margin: 0 auto;
    }

    /* TOP BAR */

    .topbar {
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .back {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -1.5px;
    }

    .logo span {
      color: var(--blue);
    }

    .lesson-info {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .lesson-language {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 12px;
      color: var(--text);
      font-weight: 600;
    }

    /* PROGRESS */

    .progress-wrap {
      height: 4px;
      background: #e9e9e4;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress {
      width: 16.6%;
      height: 100%;
      background: var(--blue);
      border-radius: 999px;
      transition: width .35s ease;
    }

    /* LESSON */

    .lesson {
      padding: 75px 0 100px;
    }

    .step-label {
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .step h1 {
      font-size: clamp(40px, 6vw, 64px);
      line-height: 1;
      letter-spacing: -3.5px;
      max-width: 750px;
    }

    .step-intro {
      margin-top: 18px;
      max-width: 650px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.6;
    }

    .scene-board {
      margin-top: 32px;
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 14px;
    }

    .scene-main,
    .scene-side {
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--surface);
      padding: 24px;
    }

    .scene-main {
      min-height: 210px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 82% 20%, rgba(83,109,255,.14), transparent 32%),
        linear-gradient(145deg, #fff 0%, #f2f2ed 100%);
    }

    .scene-kicker {
      color: var(--blue);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .scene-setting {
      margin-top: 10px;
      font-size: 30px;
      line-height: 1.05;
      letter-spacing: -1.3px;
      max-width: 360px;
    }

    .scene-moment {
      margin-top: 12px;
      max-width: 390px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
    }

    .scene-orb {
      position: absolute;
      width: 118px;
      height: 118px;
      right: 28px;
      bottom: -28px;
      border-radius: 50%;
      background: var(--blue-soft);
      border: 12px solid rgba(83,109,255,.10);
    }

    .scene-orb::after {
      content: "";
      position: absolute;
      width: 46px;
      height: 46px;
      left: 24px;
      top: 22px;
      border-radius: 14px;
      background: var(--blue);
      opacity: .78;
    }

    .scene-side {
      display: grid;
      align-content: center;
      gap: 14px;
    }

    .scene-detail {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .scene-detail-mark {
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      border-radius: 10px;
      background: #f2f2ed;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 800;
    }

    .scene-detail-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .9px;
    }

    .scene-detail-value {
      margin-top: 3px;
      font-size: 14px;
      line-height: 1.35;
    }

    /* TOPIC CARD */

    .context-card {
      margin-top: 45px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 32px;
    }

    .context-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.1px;
      text-transform: uppercase;
    }

    .context-card h2 {
      margin-top: 18px;
      font-size: 28px;
      letter-spacing: -1px;
    }

    .context-card p {
      margin-top: 9px;
      color: var(--muted);
      line-height: 1.55;
    }

    .scenario {
      margin-top: 25px;
      background: #f5f5f1;
      border-radius: 18px;
      padding: 20px;
      line-height: 1.6;
      font-size: 15px;
    }

    .scenario strong {
      color: var(--text);
    }

    /* LANGUAGE CARDS */

    .language-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-top: 35px;
    }

    .language-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 25px;
    }

    .language-card .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--blue);
      background: var(--blue-soft);
      padding: 6px 9px;
      border-radius: 999px;
    }

    .phrase {
      margin-top: 20px;
      font-size: 24px;
      font-weight: 650;
      letter-spacing: -.7px;
    }

    .translation {
      margin-top: 7px;
      color: var(--muted);
      font-size: 14px;
    }

    .example {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 14px;
      line-height: 1.55;
    }

    .example span {
      color: var(--muted);
    }

    /* PRACTICE */

    .question-card {
      margin-top: 42px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 35px;
    }

    .question-number {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .question-card h2 {
      margin-top: 18px;
      font-size: 29px;
      letter-spacing: -1px;
      line-height: 1.2;
    }

    .answers {
      display: grid;
      gap: 11px;
      margin-top: 28px;
    }

    .answer {
      width: 100%;
      text-align: left;
      background: white;
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 17px;
      font-size: 15px;
      transition: all .18s ease;
    }

    .answer:hover {
      border-color: #c5c5be;
      transform: translateY(-1px);
    }

    .answer.selected {
      border-color: var(--blue);
      background: var(--blue-soft);
    }

    .answer.correct {
      border-color: var(--green);
      background: var(--green-soft);
    }

    .answer.wrong {
      border-color: var(--coral);
      background: #faeee9;
    }

    .feedback {
      display: none;
      margin-top: 22px;
      padding: 17px;
      border-radius: 15px;
      background: #f5f5f1;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .feedback.visible {
      display: block;
    }

    .feedback strong {
      color: var(--text);
    }

    /* INPUT */

    .fill-input {
      width: 100%;
      margin-top: 25px;
      border: none;
      border-bottom: 2px solid var(--text);
      background: transparent;
      padding: 14px 2px;
      outline: none;
      font-size: 20px;
    }

    .fill-input:focus {
      border-color: var(--blue);
    }

    /* SPEAKING */

    .speaking-card {
      margin-top: 42px;
      background: var(--text);
      color: white;
      border-radius: var(--radius-xl);
      padding: 38px;
    }

    .speaking-card .question-number {
      color: #999;
    }

    .speaking-card h2 {
      margin-top: 20px;
      font-size: 32px;
      line-height: 1.15;
      letter-spacing: -1px;
      max-width: 650px;
    }

    .speaking-card p {
      margin-top: 14px;
      color: #aaa;
      line-height: 1.55;
      max-width: 600px;
    }

    .mic-button {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: none;
      background: white;
      color: var(--text);
      margin-top: 32px;
      font-size: 25px;
      transition: transform .2s ease;
    }

    .mic-button:hover {
      transform: scale(1.05);
    }

    .mic-button.recording {
      background: var(--coral);
      color: white;
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(237,146,124,.4);
      }
      70% {
        box-shadow: 0 0 0 18px rgba(237,146,124,0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(237,146,124,0);
      }
    }

    .recording-text {
      margin-top: 13px;
      font-size: 13px;
      color: #999;
    }

    /* BUTTON */

    .continue-wrap {
      display: flex;
      justify-content: flex-end;
      margin-top: 35px;
    }

    .continue {
      border: none;
      background: var(--text);
      color: white;
      border-radius: 999px;
      padding: 15px 23px;
      font-size: 14px;
      font-weight: 650;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: transform .2s ease;
    }

    .continue:hover {
      transform: translateY(-2px);
    }

    .continue:disabled {
      opacity: .35;
      cursor: default;
      transform: none;
    }

    /* RESULT */

    .result {
      text-align: center;
      display: none;
    }

    .result.visible {
      display: block;
    }

    .result-mark {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: var(--green-soft);
      color: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      font-size: 30px;
      font-weight: 700;
    }

    .result h1 {
      font-size: clamp(42px, 6vw, 64px);
      letter-spacing: -3px;
      line-height: 1;
    }

    .result > p {
      max-width: 560px;
      margin: 18px auto 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .score-card {
      max-width: 600px;
      margin: 42px auto 0;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 30px;
      text-align: left;
    }

    .score-row {
      display: flex;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }

    .score-row:last-child {
      border-bottom: none;
    }

    .score-row span {
      color: var(--muted);
    }

    .things {
      margin-top: 30px;
      text-align: left;
    }

    .things h3 {
      font-size: 16px;
      margin-bottom: 14px;
    }

    .thing {
      background: #f5f5f1;
      border-radius: 14px;
      padding: 15px;
      margin-top: 8px;
      font-size: 14px;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      .container {
        width: min(100% - 32px, 600px);
      }

      .topbar {
        height: 70px;
      }

      .lesson-info {
        display: none;
      }

      .lesson {
        padding: 52px 0 70px;
      }

      .step h1 {
        font-size: 45px;
        letter-spacing: -2px;
      }

      .step-intro {
        font-size: 16px;
      }

      .context-card,
      .question-card,
      .speaking-card {
        padding: 25px;
        border-radius: 24px;
      }

      .language-grid {
        grid-template-columns: 1fr;
      }

      .phrase {
        font-size: 22px;
      }

      .speaking-card h2 {
        font-size: 27px;
      }

      .continue-wrap {
        justify-content: stretch;
      }

      .continue {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- TOP BAR -->

    <header class="topbar">

      <button class="back" onclick="goBack()">
        ← Back
      </button>

      <a href="dashboard.html" class="logo">
        parla<span>•</span>
      </a>

      <div class="lesson-info">
        <span>Lesson</span>
        <span class="lesson-language" id="lessonLanguage">Loading…</span>
      </div>

    </header>

  </div>


  <!-- PROGRESS -->

  <div class="container">
    <div class="progress-wrap">
      <div class="progress" id="progress"></div>
    </div>
  </div>


  <!-- LESSON -->

  <main class="container lesson">
    <section class="step" id="lessonShell">
      <div class="step-label" id="cardLabel">Learn</div>
      <h1 id="cardTitle">Loading your lesson…</h1>
      <p class="step-intro" id="cardIntro">Parla is preparing something useful for you.</p>
      <div id="sceneBoard"></div>
      <div id="lessonCard"></div>
      <div class="continue-wrap">
        <button class="continue" id="nextButton" type="button" disabled>Next <span>→</span></button>
      </div>
    </section>

    <section class="result" id="result">
      <div class="result-mark">✓</div>
      <h1>Nice work.</h1>
      <p id="resultText">You learned useful language and practiced using it.</p>
      <div class="score-card">
        <div class="score-row"><span>Lesson</span><strong id="resultLesson">Complete</strong></div>
        <div class="score-row"><span>Cards</span><strong id="resultCards">Complete</strong></div>
        <div class="things">
          <h3>What to remember</h3>
          <div id="thingsList"></div>
        </div>
      </div>
      <div class="continue-wrap" style="justify-content:center;">
        <button class="continue" id="dashboardButton" type="button">Back to my learning <span>→</span></button>
      </div>
    </section>
  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <script>
    let profile = null;
    let learnerLanguageId = null;
    let lesson = null;
    let lessonId = null;
    let cards = [];
    let currentCard = 0;
    let selectedCorrect = false;
    const quizResponses = [];

    const speechLocales = {
      Polish: "pl-PL", Spanish: "es-ES", English: "en-US", Portuguese: "pt-BR",
      French: "fr-FR", Italian: "it-IT", German: "de-DE", Japanese: "ja-JP",
      Korean: "ko-KR", Mandarin: "zh-CN", Arabic: "ar-SA", Dutch: "nl-NL",
      Swedish: "sv-SE", Greek: "el-GR", Turkish: "tr-TR", Hindi: "hi-IN"
    };

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = value == null ? "" : String(value);
      return div.innerHTML;
    }

    function updateProgress() {
      const progress = document.getElementById("progress");
      const total = Math.max(cards.length, 1);
      progress.style.width = Math.min(100, ((currentCard + 1) / total) * 100) + "%";
    }

    async function rememberTaughtPhrases(client) {
      const taught = cards
        .filter(card => card.type === "teach" && card.phrase)
        .map(card => ({
          phrase: String(card.phrase).trim(),
          meaning: String(card.meaning || "").trim(),
          usage: String(card.usage || "").trim()
        }))
        .filter(item => item.phrase);

      if (!taught.length || !learnerLanguageId) return;

      const phrases = taught.map(item => item.phrase);
      const { data: existing, error: existingError } = await client
        .from("review_items")
        .select("id, target_text, mastery")
        .eq("learner_language_id", learnerLanguageId)
        .in("target_text", phrases);

      if (existingError) {
        console.debug("Review lookup skipped:", existingError);
        return;
      }

      const existingMap = new Map((existing || []).map(item => [item.target_text, item]));

      for (const item of taught) {
        const old = existingMap.get(item.phrase);
        if (old) {
          await client
            .from("review_items")
            .update({
              mastery: Math.min(100, Number(old.mastery || 0) + 10),
              next_review_at: new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString(),
              explanation: item.usage || item.meaning
            })
            .eq("id", old.id);
        } else {
          await client.from("review_items").insert({
            learner_language_id: learnerLanguageId,
            item_type: "expression",
            source_text: item.meaning || item.usage || "Everyday expression",
            target_text: item.phrase,
            explanation: item.usage || item.meaning || "",
            mastery: 10,
            next_review_at: new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString()
          });
        }
      }

      await logEvent("phrases_saved_for_review", {
        count: taught.length,
        phrases: phrases.slice(0, 10)
      });
    }

    async function logEvent(eventType, eventData = {}) {
      if (!profile || !learnerLanguageId) return;
      try {
        const client = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
        const { data: sessionData } = await client.auth.getSession();
        const user = sessionData?.session?.user;
        if (!user) return;
        await client.from("learner_events").insert({
          user_id: user.id,
          learner_language_id: learnerLanguageId,
          event_type: eventType,
          event_data: eventData
        });
      } catch (error) {
        console.debug("Parla event logging skipped:", error);
      }
    }

    function speakPhrase(text) {
      if (!("speechSynthesis" in window) || !text) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = speechLocales[profile?.targetLanguage] || "en-US";
      utterance.rate = 0.82;
      window.speechSynthesis.speak(utterance);
      logEvent("speech_played", {
        cardIndex: currentCard,
        text: String(text).slice(0, 240)
      });
    }

    function renderScene() {
      const board = document.getElementById("sceneBoard");
      if (!board || !lesson?.scene) return;
      const scene = lesson.scene;
      board.innerHTML = `
        <div class="scene-main">
          <div class="scene-kicker">You're here</div>
          <div class="scene-setting">${escapeHtml(scene.setting)}</div>
          <div class="scene-moment">${escapeHtml(scene.moment)}</div>
          <div class="scene-orb" aria-hidden="true"></div>
        </div>
        <div class="scene-side">
          <div class="scene-detail">
            <div class="scene-detail-mark">YOU</div>
            <div><div class="scene-detail-label">Your role</div><div class="scene-detail-value">${escapeHtml(scene.learnerRole)}</div></div>
          </div>
          <div class="scene-detail">
            <div class="scene-detail-mark">GO</div>
            <div><div class="scene-detail-label">Your goal</div><div class="scene-detail-value">${escapeHtml(scene.goal)}</div></div>
          </div>
        </div>`;
    }

    function setNext(enabled, label = "Next") {
      const button = document.getElementById("nextButton");
      button.disabled = !enabled;
      button.innerHTML = label + " <span>→</span>";
    }

    function renderCard() {
      const card = cards[currentCard];
      const container = document.getElementById("lessonCard");
      const label = document.getElementById("cardLabel");
      const title = document.getElementById("cardTitle");
      const intro = document.getElementById("cardIntro");
      selectedCorrect = false;
      container.innerHTML = "";
      setNext(false);

      if (!card) return;

      logEvent("lesson_card_viewed", {
        cardIndex: currentCard,
        cardType: card.type,
        lessonTitle: lesson?.title || ""
      });

      if (card.type === "teach") {
        label.textContent = "Learn";
        title.textContent = "First, understand it.";
        intro.textContent = card.meaning || "Listen first. You do not need to read the word yet.";

        container.innerHTML = `
          <div class="context-card">
            <div class="context-label">What this means</div>
            <h2 style="margin-top:14px;font-size:30px;letter-spacing:-1px;">${escapeHtml(card.meaning || "A useful everyday phrase.")}</h2>
            <p style="margin-top:10px;color:var(--muted);line-height:1.55;">${escapeHtml(card.usage || "You will hear this in everyday conversation.")}</p>

            <div class="scenario" style="margin-top:24px;">
              <strong>Listen to it</strong><br>
              Hear the phrase before you worry about spelling.
              <br>
              <button class="answer" id="listenButton" type="button" style="margin-top:16px;width:auto;">
                ▶ Hear it
              </button>
            </div>

            <div id="revealArea" style="margin-top:20px;">
              <button class="answer" id="revealButton" type="button" style="width:100%;">
                Show me the phrase
              </button>
            </div>
          </div>`;

        const revealButton = document.getElementById("revealButton");
        const listenButton = document.getElementById("listenButton");

        revealButton.disabled = true;
        revealButton.style.opacity = ".45";

        listenButton.addEventListener("click", () => {
          speakPhrase(card.phrase);
          revealButton.disabled = false;
          revealButton.style.opacity = "1";
          revealButton.textContent = "Now show me the phrase";
        });

        revealButton.addEventListener("click", () => {
          const area = document.getElementById("revealArea");
          area.innerHTML = `
            <div class="scenario" style="margin-top:18px;">
              <strong>Phrase</strong><br>
              <div style="font-size:28px;font-weight:700;letter-spacing:-1px;margin-top:8px;">${escapeHtml(card.phrase)}</div>
            </div>
            <div class="scenario">
              <strong>How it sounds</strong><br>
              ${escapeHtml(card.pronunciation || "Listen and repeat.")}
              <br><br>
              <strong>IPA</strong><br>
              ${escapeHtml(card.ipa || "")}
            </div>
            <div class="scenario">
              <strong>Example</strong><br>
              ${escapeHtml(card.example || "")}
              <button class="answer" id="exampleButton" type="button" style="margin-top:12px;width:100%;">
                ▶ Hear the example
              </button>
            </div>
            <button class="answer" id="repeatButton" type="button" style="margin-top:12px;width:100%;">
              ▶ Hear the phrase again
            </button>
            <button class="answer" id="readyButton" type="button" style="margin-top:10px;width:100%;">
              I can say it
            </button>`;

          document.getElementById("repeatButton").addEventListener("click", () => speakPhrase(card.phrase));
          document.getElementById("exampleButton").addEventListener("click", () => speakPhrase(card.example));
          document.getElementById("readyButton").addEventListener("click", () => {
            setNext(true);
            document.getElementById("readyButton").textContent = "Ready ✓";
            document.getElementById("readyButton").disabled = true;
          });
        });
        return;
      }

      if (card.type === "quiz") {
        label.textContent = "Quick check";
        title.textContent = "Can you use it?";
        intro.textContent = card.prompt || "Choose the answer that fits.";

        const options = Array.isArray(card.options) ? card.options : [];
        container.innerHTML = `
          <div class="question-card">
            <div class="question-number">One quick question</div>
            <h2>${escapeHtml(card.prompt || "Choose the best answer.")}</h2>
            <button class="answer" id="quizListenButton" type="button" style="margin:16px 0;width:100%;">
              ▶ Hear the phrase
            </button>
            <div class="answers" id="quizAnswers"></div>
            <div class="feedback" id="quizFeedback"></div>
          </div>`;

        const answers = document.getElementById("quizAnswers");
        const quizListenButton = document.getElementById("quizListenButton");
        if (quizListenButton) {
          quizListenButton.addEventListener("click", () => {
            speakPhrase(card.answer || card.phrase);
          });
        }
        options.forEach(option => {
          const button = document.createElement("button");
          button.className = "answer";
          button.type = "button";
          button.textContent = option;
          button.addEventListener("click", () => {
            answers.querySelectorAll(".answer").forEach(b => b.classList.remove("correct","wrong"));
            const correct = option === card.answer;
            button.classList.add(correct ? "correct" : "wrong");
            const feedback = document.getElementById("quizFeedback");
            feedback.innerHTML = correct
              ? "<strong>Good.</strong> " + escapeHtml(card.feedback || "That's the phrase to use.")
              : "<strong>Not quite.</strong> " + escapeHtml(card.feedback || "Listen to the phrase again and try it.");
            feedback.classList.add("visible");
            selectedCorrect = correct;
            quizResponses.push({
              cardIndex: currentCard,
              answer: option,
              correct
            });
            logEvent("quiz_answered", {
              cardIndex: currentCard,
              answer: option,
              correct
            });
            setNext(correct);
          });
          answers.appendChild(button);
        });
        return;
      }

      label.textContent = "Speak";
      title.textContent = "Use it out loud";
      intro.textContent = card.prompt || "Say the phrase naturally.";
      container.innerHTML = `
        <div class="speaking-card">
          <div class="question-number">Speaking challenge</div>
          <h2>${escapeHtml(card.prompt || "Say it naturally.")}</h2>
          <p>${escapeHtml(card.instructions || "Listen first, then say it out loud.")}</p>
          <button class="mic-button" id="speakButton" type="button" aria-label="Listen to the phrase">▶</button>
          <div class="recording-text" id="recordingText">Tap to hear it, then say it yourself.</div>
        </div>`;
      document.getElementById("speakButton").addEventListener("click", () => {
        speakPhrase(card.phrase);
        document.getElementById("recordingText").textContent = "Now say it out loud.";
        logEvent("speaking_prompt_completed", {
          cardIndex: currentCard,
          phrase: card.phrase || ""
        });
        setNext(true, "I did it");
      });
      setNext(true, "I did it");
    }

    async function getProfile() {
      const client = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
      const { data: sessionData } = await client.auth.getSession();
      if (!sessionData?.session) return null;

      const user = sessionData.session.user;
      const { data: learnerLanguage } = await client
        .from("learner_languages")
        .select("id, level, goal, interests, languages(name, code)")
        .eq("user_id", user.id)
        .eq("is_current", true)
        .maybeSingle();

      if (!learnerLanguage) return null;

      const { data: dbProfile } = await client
        .from("profiles")
        .select("native_language_code")
        .eq("id", user.id)
        .maybeSingle();

      const nativeMap = {
        en:"English",es:"Spanish",pt:"Portuguese",fr:"French",de:"German",it:"Italian",
        ja:"Japanese",ko:"Korean",zh:"Mandarin",ar:"Arabic",nl:"Dutch",sv:"Swedish",
        el:"Greek",tr:"Turkish",hi:"Hindi",pl:"Polish"
      };

      learnerLanguageId = learnerLanguage.id;

      return {
        targetLanguage: learnerLanguage.languages?.name || "",
        nativeLanguage: nativeMap[dbProfile?.native_language_code] || "English",
        level: learnerLanguage.level || "A0",
        goal: learnerLanguage.goal || "Real conversation",
        interests: Array.isArray(learnerLanguage.interests) ? learnerLanguage.interests : []
      };
    }

    async function loadLesson() {
      try {
        profile = await getProfile();
        if (!profile?.targetLanguage) {
          window.location.href = "dashboard.html";
          return;
        }

        document.getElementById("lessonLanguage").textContent = profile.targetLanguage;
        document.getElementById("cardTitle").textContent = "Building your lesson…";
        document.getElementById("cardIntro").textContent = "One useful phrase at a time.";

        const response = await fetch("/api/learn", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({profile})
        });

        const raw = await response.text();
        let data = null;

        try {
          data = raw ? JSON.parse(raw) : null;
        } catch (parseError) {
          console.error("Parla lesson returned non-JSON:", raw);
          const serverPreview = String(raw || "")
            .replace(/<[^>]*>/g, " ")
            .replace(/\\s+/g, " ")
            .trim()
            .slice(0, 220);

          throw new Error(
            response.ok
              ? "The lesson server returned an unexpected response."
              : "The lesson server returned an error" +
                (serverPreview ? ": " + serverPreview : ".")
          );
        }

        if (!response.ok) {
          throw new Error(data?.error || "Lesson generation failed.");
        }

        if (!data?.lesson?.cards?.length) {
          throw new Error("No lesson cards were returned.");
        }

        lesson = data.lesson;
        cards = lesson.cards;
        renderScene();
        logEvent("lesson_started", {
          title: lesson.title,
          level: profile.level,
          scenario: lesson.scene?.setting || ""
        });

        // Display the generated lesson immediately. Saving history must never
        // prevent the learner from starting a lesson.
        document.getElementById("cardTitle").textContent = lesson.title;
        document.getElementById("cardIntro").textContent = lesson.intro;
        document.title = "Parla — " + profile.targetLanguage + " lesson";

        currentCard = 0;
        renderCard();
        updateProgress();
      } catch (error) {
        console.error("Parla lesson error:", error);
        document.getElementById("cardLabel").textContent = "Lesson unavailable";
        document.getElementById("cardTitle").textContent = "We couldn't build this lesson.";
        document.getElementById("cardIntro").textContent = error?.message || "Please try again.";
        document.getElementById("lessonCard").innerHTML = "";
        setNext(false);
      }
    }

    document.getElementById("nextButton").addEventListener("click", async () => {
      if (currentCard < cards.length - 1) {
        currentCard++;
        renderCard();
        updateProgress();
        window.scrollTo({top:0, behavior:"smooth"});
      } else {
        if (profile) {
          const client = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

          if (!lessonId) {
            const { data: savedLesson, error: saveLessonError } = await client
              .from("lessons")
              .insert({
                learner_language_id: learnerLanguageId,
                title: lesson.title,
                topic: lesson.intro || "Everyday conversation",
                level: profile.level,
                content: lesson
              })
              .select("id")
              .single();

            if (!saveLessonError && savedLesson?.id) lessonId = savedLesson.id;
          }
          const quizCount = quizResponses.length;
          const correctCount = quizResponses.filter(item => item.correct).length;
          const score = quizCount ? Math.round((correctCount / quizCount) * 100) : 100;

          if (!lessonId) {
            console.error("Lesson history could not be saved; completing locally.");
          } else {
            const { error: attemptError } = await client
              .from("lesson_attempts")
              .insert({
              lesson_id: lessonId,
              score,
              responses: {
                quizResponses,
                completedCards: cards.length,
                targetLanguage: profile.targetLanguage
              }
            });

            if (attemptError) {
              console.error("Could not save lesson attempt:", attemptError);
            }
          }

          await rememberTaughtPhrases(client);
        }

        logEvent("lesson_completed", {
          title: lesson?.title || "Lesson",
          score,
          completedCards: cards.length
        });
        sessionStorage.setItem("parla_lesson_completed", "true");
        sessionStorage.setItem("parla_last_lesson_title", lesson?.title || "Lesson");
        document.getElementById("lessonShell").style.display = "none";
        document.getElementById("result").classList.add("visible");
        document.getElementById("resultLesson").textContent = lesson?.title || "Complete";
        document.getElementById("resultCards").textContent = cards.length + " completed";
        const things = document.getElementById("thingsList");
        things.innerHTML = cards.filter(c => c.type === "teach").slice(0,3).map(c =>
          '<div class="thing"><strong>' + escapeHtml(c.phrase) + '</strong> — ' + escapeHtml(c.meaning) + '</div>'
        ).join("");
        document.getElementById("progress").style.width = "100%";
      }
    });

    document.getElementById("dashboardButton").addEventListener("click", () => {
      window.location.href = "dashboard.html";
    });

    function goBack() {
      window.location.href = "dashboard.html";
    }

    loadLesson();
  </script>

</body>
</html>
