<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<link rel="icon" type="image/jpeg" href="/Gradient%20Ribbon%20N%20Logo.jpg?v=20261024">
<title>Nahtive — Language placement test</title>
<meta name="description" content="Take a practical language placement test and estimate your CEFR level from A1 to C2.">
<link rel="stylesheet" href="nahtive-brand.css?v=20261024">
<style>
:root{color-scheme:dark;--bg:#0b0f1a;--card:#141b2d;--card2:#19233a;--line:#34435f;--text:#f4f7ff;--muted:#b8c4d9;--cyan:#67e8f9;--blue:#60a5fa;--violet:#a78bfa;--grad:linear-gradient(105deg,var(--cyan),var(--blue) 48%,var(--violet))}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 10% 0,rgba(56,189,248,.14),transparent 38%),radial-gradient(ellipse at 100% 15%,rgba(139,92,246,.15),transparent 35%),var(--bg);color:var(--text);font:16px/1.6 "Manrope",system-ui,sans-serif}.shell{width:min(900px,calc(100% - 32px));margin:auto}.nav{display:flex;align-items:center;justify-content:space-between;padding:22px 0 42px}.wordmark{font-size:1.65rem;font-weight:800;letter-spacing:-.06em;background:var(--grad);background-clip:text;-webkit-background-clip:text;color:transparent;text-decoration:none}.nav-links{display:flex;gap:20px}.nav-links a{color:var(--muted);text-decoration:none;font-size:.9rem}.nav-links a:hover{color:#fff}.card{max-width:740px;margin:0 auto 60px;padding:clamp(22px,5vw,42px);background:linear-gradient(145deg,rgba(25,35,58,.98),rgba(17,24,41,.98));border:1px solid var(--line);border-radius:24px;box-shadow:0 25px 80px #0005}.eyebrow{color:var(--cyan);font-size:.75rem;letter-spacing:.13em;font-weight:800;text-transform:uppercase}.card h1{font-size:clamp(2.1rem,6vw,3.5rem);letter-spacing:-.055em;line-height:1.08;margin:12px 0}.card h2{font-size:clamp(1.3rem,4vw,1.9rem);line-height:1.25;letter-spacing:-.035em;margin:12px 0}.muted{color:var(--muted)}.field{display:grid;gap:8px;margin-top:24px}.field label{font-size:.9rem;font-weight:700;color:#e0e8f7}.field select,.field input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #465674;background:#0d1425;color:var(--text);font:inherit}.language-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:26px}.choice,.answer{width:100%;text-align:left;border:1px solid #3a4967;border-radius:14px;background:#121b2d;color:var(--text);padding:16px;font:inherit;font-weight:700;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}.choice:hover,.answer:hover{border-color:#8ba8ff;background:#1b2943;transform:translateY(-1px)}.choice:focus-visible,.answer:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}.btn{border:0;border-radius:12px;padding:12px 18px;font:800 .95rem inherit;font-family:inherit;font-weight:800;cursor:pointer}.primary{background:var(--grad);color:#07101f}.secondary{background:#293650;color:#f3f6ff}.btn:disabled{opacity:.4;cursor:not-allowed}.progress{height:5px;background:#2b3650;border-radius:99px;overflow:hidden;margin-bottom:28px}.progress span{display:block;height:100%;background:var(--grad);transition:width .2s}.topline{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.85rem}.pill{color:#c5d9ff;font-size:.78rem;font-weight:800}.question-translation{border-left:2px solid var(--cyan);background:#0e1627;padding:12px 14px;color:#cbd7eb;border-radius:0 10px 10px 0;margin:18px 0}.answers{display:grid;gap:10px;margin-top:22px}.answer{font-size:.97rem;font-weight:600}.answer.selected{border-color:var(--cyan);background:#183044;box-shadow:inset 0 0 0 1px var(--cyan)}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:26px}.result{text-align:center}.level{font-size:clamp(5rem,17vw,7rem);font-weight:800;letter-spacing:-.08em;line-height:1.15;margin:18px 0;background:var(--grad);background-clip:text;-webkit-background-clip:text;color:transparent}.breakdown{max-width:420px;margin:28px auto;text-align:left}.score-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #ffffff18;color:#dbe5f5}.score-row strong{color:#fff}.result-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.note{font-size:.9rem;color:var(--muted);max-width:520px;margin:0 auto}.hidden{display:none!important}@media(max-width:600px){.nav{padding:18px 0 28px}.nav-links{gap:12px}.nav-links a{font-size:.82rem}.language-grid{grid-template-columns:1fr}.card{border-radius:19px}.actions .btn{padding:12px 14px}}
</style>
</head>
<body>
<div class="shell">
<nav class="nav"><a class="wordmark" href="index.html">Nahtive</a><div class="nav-links"><a href="index.html">Home</a><a href="login.html">Log in</a></div></nav>
<main id="app" class="card" aria-live="polite"></main>
</div>
<script>
(function(){
"use strict";
const LEVELS=["A1","A2","B1","B2","C1","C2"];
const BANK={
English:[
["A1","I ___ from Brazil.","am","is","are","be",0],["A1","She ___ to work by bus.","go","goes","going","gone",1],
["A2","Yesterday, we ___ a movie.","watch","watched","watching","watches",1],["A2","I've lived here ___ two years.","since","for","at","during",1],
["B1","If it rains tomorrow, we ___ at home.","stayed","would stay","will stay","have stayed",2],["B1","He told me that he ___ busy.","is","was","will","be",1],
["B2","By the time I arrived, they ___ dinner.","finished","have finished","had finished","are finishing",2],["B2","The plan sounds good, ___ it may be expensive.","although","because of","despite","unless",0],
["C1","I would rather you ___ me before making a decision.","tell","told","have told","will tell",1],["C1","Her explanation was clear and ___ supported by evidence.","well","good","strongly","deep",0],
["C2","The two reports seem to disagree, but they are actually ___.","compatible","complicated","comparable","competitive",0],["C2","His answer was vague, so its meaning remained ___.","obvious","uncertain","accurate","ordinary",1]
],
Spanish:[
["A1","Yo ___ de Brasil.","soy","es","estoy","ser",0],["A1","Ella ___ al trabajo en autobús.","voy","va","vas","ir",1],
["A2","Ayer ___ una película.","veo","vi","veré","viendo",1],["A2","Vivo aquí ___ dos años.","desde","por","hace","durante",2],
["B1","Si mañana llueve, ___ en casa.","nos quedamos","nos quedaremos","nos quedábamos","quedarnos",1],["B1","Me dijo que ___ ocupado.","está","estará","estaba","estar",2],
["B2","Cuando llegué, ellos ya ___ la cena.","terminaron","han terminado","habían terminado","terminan",2],["B2","El plan parece bueno, ___ puede ser caro.","aunque","porque de","a pesar","salvo",0],
["C1","Preferiría que me ___ antes de decidir.","avisas","avisaste","avisaras","avisarás",2],["C1","Su explicación fue clara y estuvo bien ___ con pruebas.","apoyada","apoyando","apoyar","apoya",0],
["C2","Los dos informes parecen contradecirse, pero en realidad son ___.","compatibles","complicados","competentes","competitivos",0],["C2","Su respuesta fue ambigua, así que el significado quedó ___.","obvio","incierto","exacto","habitual",1]
],
French:[
["A1","Je ___ du Brésil.","suis","est","es","être",0],["A1","Elle ___ au travail en bus.","vais","va","vas","aller",1],
["A2","Hier, nous ___ un film.","regardons","avons regardé","regarder","regardons-nous",1],["A2","J'habite ici ___ deux ans.","depuis","pendant","à","dans",0],
["B1","S'il pleut demain, nous ___ à la maison.","restions","resterons","sommes restés","rester",1],["B1","Il m'a dit qu'il ___ occupé.","est","sera","était","être",2],
["B2","Quand je suis arrivé, ils ___ déjà le dîner.","finissent","ont fini","avaient fini","finiront",2],["B2","Le plan semble bon, ___ il peut coûter cher.","bien que","mais","malgré","à cause",1],
["C1","Je préférerais que tu me ___ avant de décider.","préviens","prévenais","préviendras","prévenir",1],["C1","Son explication était claire et bien ___ par des preuves.","soutenu","soutenue","soutenir","soutenant",1],
["C2","Les deux rapports semblent se contredire, mais ils sont en fait ___.","compatibles","compliqués","compétents","compétitifs",0],["C2","Sa réponse était vague, donc le sens restait ___.","évident","incertain","exact","ordinaire",1]
]};
const TRANSLATIONS={
Spanish:{English:"English",Spanish:"Español",Portuguese:"Português",French:"Français"},
French:{English:"English",Spanish:"Español",Portuguese:"Português",French:"Français"},
English:{English:"English",Spanish:"Español",Portuguese:"Português",French:"Français"}
};
let language="",questions=[],index=0,answers=[];
const app=document.getElementById("app");
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function intro(){
app.innerHTML='<span class="eyebrow">Free placement test</span><h1>Find your real level.</h1><p class="muted">18 practical questions across A1–C2. This test runs instantly—no account or AI generation request required. Choose the language you want to assess.</p><div class="language-grid"><button class="choice" data-lang="English">English <span class="muted">· EN</span></button><button class="choice" data-lang="Spanish">Spanish <span class="muted">· ES</span></button><button class="choice" data-lang="French">French <span class="muted">· FR</span></button></div><p class="muted" style="font-size:.82rem;margin:20px 0 0">Choose the language you are learning, not your native language.</p>';
app.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>start(b.dataset.lang)));
}
function start(lang){language=lang;questions=shuffle(BANK[lang].map(q=>({level:q[0],question:q[1],choices:q.slice(2,6),correct:q[6]})));index=0;answers=Array(questions.length).fill(null);renderQuestion();}
function renderQuestion(){
const q=questions[index];
app.innerHTML='<div class="progress"><span style="width:'+((index+1)/questions.length*100)+'%"></span></div><div class="topline"><span>Question '+(index+1)+' of '+questions.length+'</span><span class="pill">'+esc(language)+' · CEFR placement</span></div><h2>'+esc(q.question)+'</h2><div class="answers">'+q.choices.map((c,i)=>'<button class="answer'+(answers[index]===i?' selected':'')+'" data-answer="'+i+'">'+String.fromCharCode(65+i)+'. '+esc(c)+'</button>').join("")+'</div><div class="actions"><button class="btn secondary" id="back" '+(index===0?'disabled':'')+'>Back</button><button class="btn primary" id="next" '+(answers[index]===null?'disabled':'')+'>'+(index===questions.length-1?'See my result':'Next question')+' →</button></div>';
app.querySelectorAll("[data-answer]").forEach(b=>b.addEventListener("click",()=>{answers[index]=Number(b.dataset.answer);renderQuestion();}));
document.getElementById("back").addEventListener("click",()=>{if(index>0){index--;renderQuestion();}});
document.getElementById("next").addEventListener("click",()=>{if(answers[index]===null)return;if(index<questions.length-1){index++;renderQuestion();}else result();});
}
function result(){
const scores=Object.fromEntries(LEVELS.map(l=>[l,0])),totals=Object.fromEntries(LEVELS.map(l=>[l,0]));
questions.forEach((q,i)=>{totals[q.level]++;if(answers[i]===q.correct)scores[q.level]++;});
let level="A1";
for(const l of LEVELS){if(scores[l]<1)break;level=l;}
const rows=LEVELS.map(l=>'<div class="score-row"><span>'+l+'</span><strong>'+scores[l]+' / 3 correct</strong></div>').join("");
const description={A1:"You are at the beginner stage. Build confidence with everyday words and simple sentences.",A2:"You can handle familiar, everyday communication and are building independence.",B1:"You can manage many everyday situations and communicate the main points clearly.",B2:"You can communicate with good independence and handle more complex ideas.",C1:"You show strong control of complex language, nuance, and varied situations.",C2:"Your answers suggest highly advanced control of the language."};
app.innerHTML='<div class="result"><span class="eyebrow">Your result</span><h1>Your estimated level</h1><div class="level">'+level+'</div><p class="note">'+description[level]+' This is a short screening estimate; a fuller assessment can refine it.</p><div class="breakdown"><h3 style="font-size:1rem;margin:0 0 8px">Level breakdown</h3>'+rows+'</div><div class="result-actions"><a class="btn primary" style="text-decoration:none" href="signup.html?targetLanguage='+encodeURIComponent(language)+'&level='+encodeURIComponent(level)+'">Start at '+level+' →</a><button class="btn secondary" id="retake">Retake test</button></div></div>';
document.getElementById("retake").addEventListener("click",intro);
}
intro();
})();
</script>
</body>
</html>
