<!DOCTYPE html>
<html lang="en">
<head>
  <script src="site-config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nahtive — Find your language level</title>
  <meta name="description" content="Take a free CEFR language placement test and find your level in minutes.">
  <link rel="stylesheet" href="nahtive.css">
  <style>
    body.placement-page .language-choice{color:#f4f1ea!important;background:#141a2b!important;border:1px solid rgba(255,255,255,.12)!important;text-shadow:none!important}
    body.placement-page .language-choice:hover{color:#10200a!important;background:#b6f36a!important;border-color:#b6f36a!important}
    body.placement-page .language-choice:focus-visible{outline:2px solid #b6f36a;outline-offset:2px}
    body.placement-page{min-height:100vh;background:#0b0f1a;color:#f4f1ea}
    .placement-wrap{width:min(760px,calc(100% - 32px));margin:0 auto;padding:28px 0 70px}
    .placement-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:70px;background:#0b0f1a!important;color:#f4f1ea!important;border:0!important;box-shadow:none!important}
    .placement-nav .logo{color:#f4f1ea!important;text-decoration:none;font-weight:800;font-size:22px}.placement-nav a{color:#f4f1ea!important}.placement-nav a:hover{color:#b6f36a!important}
    .placement-nav .logo span{color:#b6f36a}
    .placement-progress{height:5px;background:#1b2238;border-radius:99px;overflow:hidden;margin:0 0 42px}
    .placement-progress span{display:block;height:100%;width:0;background:#b6f36a;transition:width .25s}
    .placement-card{background:#141a2b;border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:34px}
    .eyebrow{display:inline-block;color:#b6f36a;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px}
    h1{font-size:clamp(34px,6vw,56px);line-height:1.02;margin:0 0 16px;letter-spacing:-.04em}
    h2{font-size:28px;margin:0 0 10px}
    .muted{color:#9ba4ba;line-height:1.6}
    .language-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:28px}
    .language-choice,.answer{font:600 15px Manrope,system-ui,sans-serif;color:#f4f1ea;background:#1b2238;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:15px;text-align:left;cursor:pointer;transition:.16s}
    .language-choice:hover,.answer:hover{background:#1b2a24;border-color:#b6f36a;transform:translateY(-2px)}
    .answer-grid{display:grid;gap:11px;margin-top:26px}
    .answer.selected{border-color:#b6f36a;background:#1b2a24}
    .answer.correct{border-color:#b6f36a;background:#1b2a24}
    .answer.wrong{border-color:#ff6b6b;background:#321e28}
    .answer:disabled{cursor:default}
    .topline{display:flex;justify-content:space-between;color:#9ba4ba;font-size:13px;margin-bottom:22px}
    .level-pill{color:#b6f36a;font-weight:800}
    .actions{display:flex;justify-content:space-between;gap:12px;margin-top:28px}
    .btn{font:800 15px Manrope,system-ui,sans-serif;border:0;border-radius:13px;padding:13px 20px;cursor:pointer}
    .primary{background:#b6f36a;color:#10200a}.secondary{background:#263554;color:#f4f1ea}
    .result{text-align:center}
    .result-level{font-size:86px;line-height:1;font-weight:800;color:#b6f36a;margin:22px 0 10px;letter-spacing:-.06em}
    .result-note{max-width:520px;margin:0 auto;color:#9ba4ba;line-height:1.7}
    .result-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:30px}
    .error{margin-top:16px;color:#ff9b9b;font-size:14px}
    @media(max-width:560px){.placement-card{padding:24px}.language-grid{grid-template-columns:1fr}.placement-nav{margin-bottom:45px}}
  </style>
</head>
<body class="placement-page">
<div class="placement-wrap">
  <nav class="placement-nav">
    <a class="logo" href="index.html">Nahtive<span>•</span></a>
    <a href="login.html" style="color:#9ba4ba;text-decoration:none;font-size:14px">Log in</a>
  </nav>
  <div id="app"></div>
</div>
<script>
const app=document.getElementById("app");
const languages=["Spanish","English","Portuguese","French","Italian","German","Japanese","Korean","Mandarin","Arabic","Dutch","Swedish","Greek","Turkish","Hindi","Polish"];
let questions=[],index=0,answers=[],language="";
function escapeHtml(v){const d=document.createElement("div");d.textContent=String(v??"");return d.innerHTML}
function renderLanguage(){
 app.innerHTML='<div class="placement-card"><span class="eyebrow">Free placement test</span><h1>Find your real level.</h1><p class="muted">Answer a short set of questions that gets harder as it goes. No account required.</p><div class="language-grid">'+languages.map(l=>'<button class="language-choice" data-language="'+escapeHtml(l)+'">'+escapeHtml(l)+'</button>').join("")+'</div><div id="error" class="error"></div></div>';
 document.querySelectorAll(".language-choice").forEach(b=>b.onclick=()=>start(b.dataset.language));
}
async function start(l){
 language=l;
 app.innerHTML='<div class="placement-card"><span class="eyebrow">Preparing your test</span><h2>Building your '+escapeHtml(l)+' level check…</h2><p class="muted">This usually takes a few seconds.</p><div id="error" class="error"></div></div>';
 try{
   const res=await fetch("/api/generate-placement",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({language:l})});
   const data=await res.json();
   if(!res.ok||!data.questions)throw new Error(data.error||"Could not load the test.");
   questions=data.questions.slice().sort((a,b)=>["A1","A2","B1","B2","C1","C2"].indexOf(a.level)-["A1","A2","B1","B2","C1","C2"].indexOf(b.level));
   index=0;answers=[];renderQuestion();
 }catch(e){app.innerHTML='<div class="placement-card"><h2>We could not load the test.</h2><p class="muted">'+escapeHtml(e.message)+'</p><button class="btn secondary" onclick="renderLanguage()">Try again</button></div>'}
}
function renderQuestion(){
 const q=questions[index];
 app.innerHTML='<div class="placement-progress"><span style="width:'+((index/questions.length)*100)+'%"></span></div><div class="placement-card"><div class="topline"><span>Question '+(index+1)+' of '+questions.length+'</span><span class="level-pill">'+escapeHtml(q.level)+'</span></div><h2>'+escapeHtml(q.question)+'</h2><div class="answer-grid">'+q.choices.map((c,i)=>'<button class="answer" data-index="'+i+'">'+escapeHtml(c)+'</button>').join("")+'</div><div class="actions"><button class="btn secondary" onclick="goBack()" '+(index===0?"disabled":"")+' style="'+(index===0?"opacity:.4":"")+'">Back</button><button class="btn primary" id="next" disabled>Next</button></div></div>';
 document.querySelectorAll(".answer").forEach(b=>b.onclick=()=>{document.querySelectorAll(".answer").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");document.getElementById("next").disabled=false;answers[index]=Number(b.dataset.index)});
 document.getElementById("next").onclick=()=>{if(index<questions.length-1){index++;renderQuestion()}else showResult()};
}
function goBack(){if(index>0){index--;renderQuestion()}}
function showResult(){
 const levels=["A1","A2","B1","B2","C1","C2"];
 const scores={A1:0,A2:0,B1:0,B2:0,C1:0,C2:0};
 questions.forEach((q,i)=>{if(answers[i]===q.correct_index)scores[q.level]++});
 let level="A1";
 for(let i=0;i<levels.length;i++){
   const current=scores[levels[i]];
   const prior=levels.slice(0,i).every(l=>scores[l]>=1);
   if(current===2&&prior)level=levels[i];
 }
 const next=level==="C2"?"C2":levels[Math.min(levels.indexOf(level)+1,5)];
 const strengths=levels.filter(l=>scores[l]>0);
 app.innerHTML='<div class="placement-card result"><span class="eyebrow">Your result</span><h1>You tested at</h1><div class="result-level">'+level+'</div><p class="result-note">That is your current placement estimate for '+escapeHtml(language)+'. Nahtive will use this as a starting point, and you can change your level later. For the most useful learning path, start at '+level+' and move up when the lessons feel consistently easy.</p><div class="result-actions"><a class="btn primary" href="signup.html?targetLanguage='+encodeURIComponent(language)+'&level='+encodeURIComponent(level)+'">Start learning at '+level+' →</a><button class="btn secondary" onclick="renderLanguage()">Retake test</button></div></div>';
}
renderLanguage();
</script>
</body>
</html>
