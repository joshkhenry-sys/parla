<!DOCTYPE html>
<html lang="en">
<head>
  <script src="site-config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nahtive — Find your language level</title>
  <meta name="description" content="Take a free CEFR language placement test and find your level in minutes.">
  <link rel="stylesheet" href="nahtive.css">
  <style>
    body.placement-page .aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
    body.placement-page .aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.28;animation:placementDrift 22s ease-in-out infinite alternate}
    body.placement-page .aurora i:nth-child(1){width:520px;height:520px;background:#2f4b8f;top:-200px;left:-160px;opacity:.22}
    body.placement-page .aurora i:nth-child(2){width:460px;height:460px;background:#ff9f5a;top:30%;right:-160px;animation-duration:28s;opacity:.18}
    body.placement-page .aurora i:nth-child(3){width:400px;height:400px;background:#b6f36a;bottom:-180px;left:25%;animation-duration:25s;opacity:.10}
    @keyframes placementDrift{to{transform:translate(70px,50px) scale(1.15)}}@keyframes nahtiveDotPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.22);opacity:.72}}
    body.placement-page .placement-wrap{position:relative;z-index:1;max-width:1080px;width:auto;margin:0 auto;padding:0 22px 70px}
    body.placement-page .placement-nav{display:flex;align-items:center;justify-content:space-between;padding:20px 0;margin:0 0 54px;background:transparent!important;color:#f4f1ea!important;border:0!important;box-shadow:none!important}
    body.placement-page .placement-nav .logo{font-family:Manrope,system-ui,sans-serif!important;color:#f4f1ea!important;font-weight:700;font-size:1.5rem;letter-spacing:-.02em;text-decoration:none;display:inline-flex!important;align-items:center!important;gap:0!important;white-space:nowrap!important;line-height:1!important}
    body.placement-page .placement-nav .logo span{color:#b6f36a!important;display:inline!important;position:static!important;vertical-align:baseline!important;line-height:1!important;margin:0!important;padding:0!important;animation:nahtiveDotPulse 2.2s ease-in-out infinite;transform-origin:center}
    body.placement-page .placement-nav-right{display:flex;gap:10px;align-items:center}
    body.placement-page .placement-nav-right a{color:#9ba4ba!important;text-decoration:none;font-weight:500;padding:8px 12px;font-size:15px}
    body.placement-page .placement-nav-right a:hover{color:#f4f1ea!important}
    body.placement-page .placement-nav-right .nav-cta{color:#10200a!important;background:#b6f36a!important;padding:10px 18px;border-radius:14px;font-weight:700;box-shadow:0 4px 0 #7fbf3a}
    body.placement-page .placement-nav-right .nav-cta:hover{color:#10200a!important;filter:brightness(1.06)}
    body.placement-page .language-choice{color:#f4f1ea!important;background:#141a2b!important;border:1px solid rgba(255,255,255,.09)!important;text-shadow:none!important}
    body.placement-page .language-choice:hover{color:#10200a!important;background:color-mix(in srgb,#b6f36a 16%,#141a2b)!important;border-color:#b6f36a!important}
    body.placement-page .language-choice:focus-visible{outline:2px solid #b6f36a;outline-offset:2px}
    body.placement-page{min-height:100vh;background:#0b0f1a!important;color:#f4f1ea;font-family:Manrope,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .placement-card{max-width:760px;margin:0 auto;background:linear-gradient(160deg,#1b2238,#141a2b);border:1px solid rgba(255,255,255,.09);border-radius:26px;padding:34px;box-shadow:0 30px 70px -30px rgba(0,0,0,.6)}
    .placement-progress{height:5px;background:#1b2238;border-radius:99px;overflow:hidden;margin:0 0 42px}
    .placement-progress span{display:block;height:100%;width:0;background:#b6f36a;transition:width .25s}

    .placement-card .eyebrow{display:inline-block;color:#b6f36a!important;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px;background:transparent!important}
    .placement-card h1{font-family:Manrope,system-ui,sans-serif!important;color:#f4f1ea!important;font-size:clamp(34px,6vw,56px);line-height:1.02;margin:0 0 16px;letter-spacing:-.04em;font-weight:700!important}
    .placement-card h2{font-family:Manrope,system-ui,sans-serif!important;color:#f4f1ea!important;font-size:28px;margin:0 0 10px;font-weight:700!important}
    .placement-card .muted{color:#d4d9e5!important;line-height:1.6}
    .language-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:32px}
    .language-choice,.answer{font:700 14px Manrope,system-ui,sans-serif;color:#f4f1ea;background:#1b2238;border:1px solid rgba(255,255,255,.10);border-radius:16px;padding:17px 16px;text-align:left;cursor:pointer;transition:transform .16s ease,background .16s ease,border-color .16s ease}
    .language-choice:hover,.answer:hover{background:#1b2a24;border-color:#b6f36a;transform:translateY(-2px)}
    .answer-grid{display:grid;gap:11px;margin-top:26px}\n    .translate-question{margin-top:2px;background:transparent;border:0;color:#b6f36a;font:700 14px Manrope,system-ui,sans-serif;padding:0;cursor:pointer;text-align:left}.translate-question:hover{text-decoration:underline}.question-translation{margin-top:10px;padding:12px 14px;border-left:2px solid #b6f36a;background:#11182a;color:#d4d9e5;line-height:1.5;font-size:14px;border-radius:0 10px 10px 0}
    .answer.selected{border-color:#b6f36a;background:#1b2a24}
    .answer.correct{border-color:#b6f36a;background:#1b2a24}
    .answer.wrong{border-color:#ff6b6b;background:#321e28}
    .answer:disabled{cursor:default}
    .topline{display:flex;justify-content:space-between;color:#9ba4ba;font-size:13px;margin-bottom:22px}
    .level-pill{color:#b6f36a;font-weight:800}
    .actions{display:flex;justify-content:space-between;gap:12px;margin-top:28px}
    .btn{font:800 15px Manrope,system-ui,sans-serif;border:0;border-radius:13px;padding:13px 20px;cursor:pointer}
    .primary{background:#b6f36a;color:#10200a}.secondary{background:#263554;color:#f4f1ea}
    .result{text-align:center}
    .result-level{font-size:86px;line-height:1;font-weight:800;color:#b6f36a;margin:22px 0 10px;letter-spacing:-.06em}
    .result-note{max-width:520px;margin:0 auto;color:#9ba4ba;line-height:1.7}
    .result-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:30px}
    .error{margin-top:16px;color:#ff9b9b;font-size:14px}
    @media(max-width:760px){.language-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:560px){.placement-wrap{width:calc(100% - 24px);padding-top:18px}.placement-card{padding:24px;border-radius:22px}.language-grid{grid-template-columns:1fr}.placement-nav{margin-bottom:38px}}
  </style>
</head>
<body class="placement-page">
<div class="aurora"><i></i><i></i><i></i></div>
<div class="wrap placement-wrap">
  <nav class="placement-nav">
    <a class="logo" href="index.html">Nahtive<span>•</span></a>
    <div class="placement-nav-right">
      <a href="index.html">Home</a>
      <a href="login.html">Log in</a>
      <a class="nav-cta" href="signup.html">Start learning</a>
    </div>
  </nav>
  <div id="app"></div>
</div>
<script>
const app=document.getElementById("app");
const languages=["Spanish","English","Portuguese","French","Italian","German","Japanese","Korean","Mandarin","Arabic","Dutch","Swedish","Greek","Turkish","Hindi","Polish"];
let questions=[],index=0,answers=[],language="",instructionLanguage="English";
function escapeHtml(v){const d=document.createElement("div");d.textContent=String(v??"");return d.innerHTML}
function renderLanguage(){
 app.innerHTML='<div class="placement-card"><span class="eyebrow">Free placement test</span><h1>Find your real level.</h1><p class="muted">Answer a short set of questions that gets harder as it goes. No account required.</p><label for="instructionLanguage" style="display:block;margin-top:24px;color:#d4d9e5">Read questions in</label><select id="instructionLanguage" style="display:block;width:100%;margin-top:8px;padding:14px;border-radius:12px;background:#141a2b;color:#f4f1ea;border:1px solid #444"><option value="Spanish" >Spanish</option><option value="English" selected>English</option><option value="Portuguese" >Portuguese</option><option value="French" >French</option><option value="Italian" >Italian</option><option value="German" >German</option><option value="Japanese" >Japanese</option><option value="Korean" >Korean</option><option value="Mandarin" >Mandarin</option><option value="Arabic" >Arabic</option><option value="Dutch" >Dutch</option><option value="Swedish" >Swedish</option><option value="Greek" >Greek</option><option value="Turkish" >Turkish</option><option value="Hindi" >Hindi</option><option value="Polish" >Polish</option><option value="Russian">Russian</option><option value="Ukrainian">Ukrainian</option><option value="Bengali">Bengali</option><option value="Urdu">Urdu</option><option value="Punjabi">Punjabi</option><option value="Tamil">Tamil</option><option value="Telugu">Telugu</option><option value="Vietnamese">Vietnamese</option><option value="Thai">Thai</option><option value="Indonesian">Indonesian</option><option value="Malay">Malay</option><option value="Filipino">Filipino</option><option value="Swahili">Swahili</option><option value="Hebrew">Hebrew</option><option value="Persian">Persian</option><option value="Romanian">Romanian</option><option value="Czech">Czech</option><option value="Hungarian">Hungarian</option><option value="Danish">Danish</option><option value="Norwegian">Norwegian</option><option value="Finnish">Finnish</option><option value="Serbian">Serbian</option><option value="Croatian">Croatian</option><option value="Bulgarian">Bulgarian</option><option value="Amharic">Amharic</option><option value="Yoruba">Yoruba</option></select><div class="language-grid">'+languages.map(l=>'<button class="language-choice" data-language="'+escapeHtml(l)+'">'+escapeHtml(l)+'</button>').join("")+'</div><div id="error" class="error"></div></div>';
 document.querySelectorAll(".language-choice").forEach(b=>b.onclick=()=>{instructionLanguage=document.getElementById("instructionLanguage").value;start(b.dataset.language)});
}
async function start(l){
 language=l;
 app.innerHTML='<div class="placement-card"><span class="eyebrow">Preparing your test</span><h2>Building your '+escapeHtml(l)+' level check…</h2><p class="muted">This usually takes a few seconds.</p><div id="error" class="error"></div></div>';
 try{
   const res=await fetch("/api/generate-placement",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({language:l,instructionLanguage})});
   const raw=await res.text();
   let data={};
   try{data=JSON.parse(raw)}catch(_){throw new Error("The placement test server returned an invalid response. Please try again.")}
   if(!res.ok||!data.questions)throw new Error(data.error||"Could not load the test.");
   questions=data.questions.slice().sort(()=>Math.random()-.5);
   index=0;answers=[];renderQuestion();
 }catch(e){app.innerHTML='<div class="placement-card"><h2>We could not load the test.</h2><p class="muted">'+escapeHtml(e.message)+'</p><button class="btn secondary" onclick="renderLanguage()">Try again</button></div>'}
}
function renderQuestion(){
 const q=questions[index];
 app.innerHTML='<div class="placement-progress"><span style="width:'+(((index+1)/questions.length)*100)+'%"></span></div><div class="placement-card"><div class="topline"><span>Question '+(index+1)+' of '+questions.length+'</span><span class="level-pill">Adaptive assessment</span></div><h2>'+escapeHtml(q.question)+'</h2>'+(q.question_translation?'<p class="muted" style="margin-top:12px;padding:12px;border-left:2px solid #b6f36a;background:#11182a"><strong>'+escapeHtml(instructionLanguage)+':</strong> '+escapeHtml(q.question_translation)+'</p>':'')+'<div class="answer-grid">'+q.choices.map((c,i)=>'<button class="answer" data-index="'+i+'">'+escapeHtml(c)+'</button>').join("")+'</div><div class="actions"><button class="btn secondary" onclick="goBack()" '+(index===0?"disabled":"")+' style="'+(index===0?"opacity:.4":"")+'">Back</button><button class="btn primary" id="next" disabled>Next</button></div></div>';
 document.querySelectorAll(".answer").forEach(b=>b.onclick=()=>{document.querySelectorAll(".answer").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");document.getElementById("next").disabled=false;answers[index]=Number(b.dataset.index)});
 document.getElementById("next").onclick=()=>{if(index<questions.length-1){index++;renderQuestion()}else showResult()};
}
function goBack(){if(index>0){index--;renderQuestion()}}
function showResult(){
 const levels=["A1","A2","B1","B2","C1","C2"];
 const scores={A1:0,A2:0,B1:0,B2:0,C1:0,C2:0};
 questions.forEach((q,i)=>{if(answers[i]===q.correct_index)scores[q.level]++});
 // Advance through CEFR bands in order. Later answers cannot compensate
 // for a gap at an earlier band.
 let level="A1";
 for(const band of levels){
   if(scores[band]>=2) level=band;
   else break;
 }
 const scoreRows=levels.map(band=>'<div style="display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08);color:#d4d9e5"><span>'+band+'</span><strong>'+scores[band]+' / 3</strong></div>').join("");
 app.innerHTML='<div class="placement-card result"><span class="eyebrow">Your result</span><h1>You tested at</h1><div class="result-level">'+level+'</div><p class="result-note">This is an estimate based on your performance across increasing difficulty. You need at least 2 of 3 correct answers at each level to advance. Your scores below show where your strengths and gaps appeared.</p><div style="max-width:420px;margin:24px auto;text-align:left"><h3 style="color:#f4f1ea;font-size:14px;margin:0 0 8px">Level breakdown</h3>'+scoreRows+'</div><div class="result-actions"><a class="btn primary" href="signup.html?targetLanguage='+encodeURIComponent(language)+'&level='+encodeURIComponent(level)+'">Start learning at '+level+' →</a><button class="btn secondary" onclick="renderLanguage()">Retake test</button></div></div>';
}
renderLanguage();
</script>
</body>
</html>
