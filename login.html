<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | Parla</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f6f2;
      color: #171717;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "SF Pro Text", Inter, Helvetica, Arial, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    nav {
      height: 78px;
      padding: 0 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -1.5px;
    }

    .logo span {
      font-weight: 400;
    }

    .nav-right {
      font-size: 14px;
      color: #666;
    }

    .nav-right a {
      color: #111;
      font-weight: 600;
      margin-left: 8px;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 70px 20px 100px;
    }

    .login-card {
      width: 100%;
      max-width: 460px;
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #777;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(42px, 6vw, 64px);
      line-height: .95;
      letter-spacing: -3px;
      margin: 0 0 20px;
      font-weight: 700;
    }

    .intro {
      font-size: 17px;
      line-height: 1.6;
      color: #666;
      margin: 0 0 34px;
    }

    .google-btn,
    .submit-btn {
      width: 100%;
      min-height: 54px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    .google-btn {
      background: #fff;
      border: 1px solid #deddd8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: .2s ease;
    }

    .google-btn:hover {
      border-color: #bbb;
      transform: translateY(-1px);
    }

    .google-icon {
      font-size: 18px;
      font-weight: 700;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 28px 0;
      color: #999;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: #deddd8;
      flex: 1;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .field {
      margin-bottom: 18px;
    }

    input {
      width: 100%;
      height: 52px;
      border: 1px solid #d8d7d2;
      border-radius: 12px;
      background: #fff;
      padding: 0 15px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
    }

    input:focus {
      border-color: #222;
    }

    .password-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .forgot {
      font-size: 12px;
      color: #666;
      cursor: pointer;
    }

    .submit-btn {
      margin-top: 8px;
      border: 0;
      background: #171717;
      color: white;
      transition: .2s ease;
    }

    .submit-btn:hover {
      background: #2c2c2c;
      transform: translateY(-1px);
    }

    .message {
      margin-top: 16px;
      font-size: 13px;
      line-height: 1.5;
      color: #b3261e;
      min-height: 20px;
    }

    .terms {
      margin-top: 25px;
      font-size: 11px;
      line-height: 1.6;
      color: #888;
      text-align: center;
    }

    footer {
      padding: 25px 5%;
      text-align: center;
      font-size: 12px;
      color: #999;
    }

    @media (max-width: 600px) {
      nav {
        height: 70px;
      }

      .nav-right {
        font-size: 13px;
      }

      main {
        align-items: flex-start;
        padding-top: 65px;
      }

      h1 {
        letter-spacing: -2px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <nav>
      <a href="index.html" class="logo">parla<span>•</span></a>

      <div class="nav-right">
        New to Parla?
        <a href="signup.html">Create account</a>
      </div>
    </nav>

    <main>
      <section class="login-card">

        <div class="eyebrow">Welcome back</div>

        <h1>Good to see you.</h1>

        <p class="intro">
          Pick up where you left off. Your learning, progress, and conversations
          are waiting for you.
        </p>

        <button type="button" class="google-btn" id="googleBtn">
          <span class="google-icon">G</span>
          <span>Continue with Google</span>
        </button>

        <div class="divider">or continue with email</div>

        <form id="loginForm">

          <div class="field">
            <label for="email">Email</label>
            <input
              id="email"
              type="email"
              autocomplete="email"
              required
            >
          </div>

          <div class="field">
            <div class="password-row">
              <label for="password">Password</label>
              <button
                type="button"
                class="forgot"
                id="forgotBtn"
              >
                Forgot password?
              </button>
            </div>

            <input
              id="password"
              type="password"
              autocomplete="current-password"
              required
            >
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">
            Log in
          </button>

          <div class="message" id="message"></div>

        </form>

        <div class="terms">
          By continuing, you agree to Parla's Terms and Privacy Policy.
        </div>

      </section>
    </main>

    <footer>
      © 2026 Parla
    </footer>

  </div>

  <script>
    const supabaseClient = window.supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_ANON_KEY
    );

    const googleBtn = document.getElementById("googleBtn");
    const loginForm = document.getElementById("loginForm");
    const forgotBtn = document.getElementById("forgotBtn");
    const message = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    function showMessage(text) {
      message.textContent = text;
    }

    function getNextPage() {
      const source = new URLSearchParams(window.location.search);
      const params = new URLSearchParams();

      const keys = [
        "targetLanguage",
        "nativeLanguage",
        "level",
        "goal",
        "interests",
        "language"
      ];

      keys.forEach(key => {
        const value = source.get(key);
        if (value) params.set(key, value);
      });

      const hasPendingOnboarding =
        params.has("targetLanguage") ||
        params.has("language") ||
        params.has("nativeLanguage") ||
        params.has("level") ||
        params.has("goal") ||
        params.has("interests");

      if (!hasPendingOnboarding) {
        return "dashboard.html";
      }

      const query = params.toString();
      return "onboarding.html" + (query ? "?" + query : "");
    }

    googleBtn.addEventListener("click", async () => {
      googleBtn.disabled = true;
      googleBtn.textContent = "Connecting…";
      showMessage("");

      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo: window.location.origin + "/" + getNextPage()
        }
      });

      if (error) {
        googleBtn.disabled = false;
        googleBtn.innerHTML = `
          <span class="google-icon">G</span>
          <span>Continue with Google</span>
        `;
        showMessage(error.message);
      }
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      submitBtn.disabled = true;
      submitBtn.textContent = "Logging in…";
      showMessage("");

      const { error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        showMessage(error.message);
        submitBtn.disabled = false;
        submitBtn.textContent = "Log in";
        return;
      }

      window.location.href = getNextPage();
    });

    forgotBtn.addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();

      if (!email) {
        showMessage("Enter your email address first.");
        return;
      }

      const { error } = await supabaseClient.auth.resetPasswordForEmail(
        email,
        {
          redirectTo: window.location.origin + "/login.html"
        }
      );

      if (error) {
        showMessage(error.message);
        return;
      }

      message.style.color = "#444";
      showMessage("Password reset instructions have been sent.");
    });

    async function showExistingSession() {
      const { data, error } = await supabaseClient.auth.getSession();
      if (error || !data.session) return;

      const user = data.session.user;
      const name = user.user_metadata?.full_name || user.user_metadata?.name || user.email || "this account";
      const notice = document.createElement("div");
      notice.style.marginTop = "15px";
      notice.style.padding = "14px 16px";
      notice.style.border = "1px solid var(--border)";
      notice.style.borderRadius = "14px";
      notice.style.background = "#f1f1ec";
      notice.style.color = "#555";
      notice.style.fontSize = "13px";
      notice.style.lineHeight = "1.5";
      notice.innerHTML = "<strong>Already signed in.</strong><br>Current account: " + escapeHtml(name) + ".";

      const continueLink = document.createElement("a");
      continueLink.href = getNextPage();
      continueLink.textContent = "Continue to dashboard";
      continueLink.style.display = "inline-block";
      continueLink.style.marginTop = "10px";
      continueLink.style.marginRight = "10px";
      continueLink.style.color = "var(--text)";
      continueLink.style.fontWeight = "700";
      
      const logout = document.createElement("button");
      logout.type = "button";
      logout.textContent = "Log out";
      logout.style.border = "1px solid var(--border)";
      logout.style.background = "white";
      logout.style.borderRadius = "999px";
      logout.style.padding = "9px 13px";
      logout.style.cursor = "pointer";
      logout.addEventListener("click", async () => {
        const { error: signOutError } = await supabaseClient.auth.signOut();
        if (signOutError) {
          showMessage(signOutError.message);
          return;
        }
        notice.remove();
      });

      notice.appendChild(continueLink);
      notice.appendChild(logout);
      document.querySelector(".card").appendChild(notice);
    }

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = value == null ? "" : String(value);
      return div.innerHTML;
    }

    showExistingSession();
  </script>
</body>
</html>
