<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | Nahtive</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  
<link rel="stylesheet" href="nahtive.css"></head>

<body>
  <div class="page">

    <nav>
      <a href="index.html" class="logo">nahtive<span>•</span></a>

      <div class="nav-right">
        New to Nahtive?
        <a href="signup.html">Create account</a>
      </div>
    </nav>

    <main>
      <section class="login-card">

        <div class="eyebrow">Welcome back</div>

        <h1>Good to see you.</h1>

        <p class="intro">
          Pick up where you left off. Your learning, progress, and conversations
          are waiting for you.
        </p>

        <button type="button" class="google-btn" id="googleBtn">
          <span class="google-icon">G</span>
          <span>Continue with Google</span>
        </button>

        <div class="divider">or continue with email</div>

        <form id="loginForm">

          <div class="field">
            <label for="email">Email</label>
            <input
              id="email"
              type="email"
              autocomplete="email"
              required
            >
          </div>

          <div class="field">
            <div class="password-row">
              <label for="password">Password</label>
              <button
                type="button"
                class="forgot"
                id="forgotBtn"
              >
                Forgot password?
              </button>
            </div>

            <input
              id="password"
              type="password"
              autocomplete="current-password"
              required
            >
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">
            Log in
          </button>

          <div class="message" id="message"></div>

        </form>

        <div class="terms">
          By continuing, you agree to Nahtive's Terms and Privacy Policy.
        </div>

      </section>
    </main>

    <footer>
      © 2026 Nahtive
    </footer>

  </div>

  <script>
    const supabaseClient = window.supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_ANON_KEY
    );

    const googleBtn = document.getElementById("googleBtn");
    const loginForm = document.getElementById("loginForm");
    const forgotBtn = document.getElementById("forgotBtn");
    const message = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    function showMessage(text) {
      message.textContent = text;
    }

    function getNextPage() {
      const source = new URLSearchParams(window.location.search);
      const params = new URLSearchParams();

      const keys = [
        "targetLanguage",
        "NahtiveLanguage",
        "level",
        "goal",
        "interests",
        "language"
      ];

      keys.forEach(key => {
        const value = source.get(key);
        if (value) params.set(key, value);
      });

      const hasPendingOnboarding =
        params.has("targetLanguage") ||
        params.has("language") ||
        params.has("NahtiveLanguage") ||
        params.has("level") ||
        params.has("goal") ||
        params.has("interests");

      if (!hasPendingOnboarding) {
        return "dashboard.html";
      }

      const query = params.toString();
      return "onboarding.html" + (query ? "?" + query : "");
    }

    googleBtn.addEventListener("click", async () => {
      googleBtn.disabled = true;
      googleBtn.textContent = "Connecting…";
      showMessage("");

      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo: window.location.origin + "/" + getNextPage()
        }
      });

      if (error) {
        googleBtn.disabled = false;
        googleBtn.innerHTML = `
          <span class="google-icon">G</span>
          <span>Continue with Google</span>
        `;
        showMessage(error.message);
      }
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      submitBtn.disabled = true;
      submitBtn.textContent = "Logging in…";
      showMessage("");

      const { error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        showMessage(error.message);
        submitBtn.disabled = false;
        submitBtn.textContent = "Log in";
        return;
      }

      const { data: signedInData } = await supabaseClient.auth.getSession();
      const pending = signedInData?.session?.user?.user_metadata?.nahtive_onboarding_pending;

      window.location.href = pending ? "onboarding.html?resume=1" : getNextPage();
    });

    forgotBtn.addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();

      if (!email) {
        showMessage("Enter your email address first.");
        return;
      }

      const { error } = await supabaseClient.auth.resetPasswordForEmail(
        email,
        {
          redirectTo: window.location.origin + "/login.html"
        }
      );

      if (error) {
        showMessage(error.message);
        return;
      }

      message.style.color = "#444";
      showMessage("Password reset instructions have been sent.");
    });

    async function showExistingSession() {
      const { data, error } = await supabaseClient.auth.getSession();
      if (error || !data.session) return;

      const user = data.session.user;
      const name = user.user_metadata?.full_name || user.user_metadata?.name || user.email || "this account";
      const notice = document.createElement("div");
      notice.style.marginTop = "15px";
      notice.style.padding = "14px 16px";
      notice.style.border = "1px solid var(--border)";
      notice.style.borderRadius = "14px";
      notice.style.background = "#f7f5ef";
      notice.style.color = "#555";
      notice.style.fontSize = "13px";
      notice.style.lineHeight = "1.5";
      notice.innerHTML = "<strong>Already signed in.</strong><br>Current account: " + escapeHtml(name) + ".";

      const continueLink = document.createElement("a");
      continueLink.href = getNextPage();
      continueLink.textContent = "Continue to dashboard";
      continueLink.style.display = "inline-block";
      continueLink.style.marginTop = "10px";
      continueLink.style.marginRight = "10px";
      continueLink.style.color = "var(--text)";
      continueLink.style.fontWeight = "700";
      
      const logout = document.createElement("button");
      logout.type = "button";
      logout.textContent = "Log out";
      logout.style.border = "1px solid var(--border)";
      logout.style.background = "white";
      logout.style.borderRadius = "999px";
      logout.style.padding = "9px 13px";
      logout.style.cursor = "pointer";
      logout.addEventListener("click", async () => {
        const { error: signOutError } = await supabaseClient.auth.signOut();
        if (signOutError) {
          showMessage(signOutError.message);
          return;
        }
        notice.remove();
      });

      notice.appendChild(continueLink);
      notice.appendChild(logout);
      document.querySelector(".card").appendChild(notice);
    }

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = value == null ? "" : String(value);
      return div.innerHTML;
    }

    showExistingSession();
  </script>
</body>
</html>
