<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Log in | Parla</title>
  <meta name="description" content="Log in to your Parla language learning account.">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #f7f7f4;
      --surface: #ffffff;
      --text: #171717;
      --muted: #777773;
      --border: #e5e5df;
      --blue: #536dff;
      --blue-soft: #edf0ff;
      --coral: #ed927c;
      --green: #78a58d;
      --radius-lg: 24px;
      --radius-md: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    nav {
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5vw;
    }

    .logo {
      color: var(--text);
      text-decoration: none;
      font-size: 27px;
      font-weight: 700;
      letter-spacing: -1.5px;
    }

    .logo span {
      color: var(--blue);
    }

    .nav-right {
      font-size: 14px;
      color: var(--muted);
    }

    .nav-right a {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      margin-left: 6px;
    }

    .nav-right a:hover {
      text-decoration: underline;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px 90px;
    }

    .login-wrap {
      width: 100%;
      max-width: 430px;
    }

    .intro {
      text-align: center;
      margin-bottom: 30px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .3px;
    }

    .eyebrow-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--blue);
    }

    h1 {
      font-size: clamp(38px, 7vw, 48px);
      line-height: .98;
      letter-spacing: -2.5px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .intro p {
      max-width: 340px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 30px;
      box-shadow:
        0 18px 50px rgba(23, 23, 23, .05),
        0 3px 12px rgba(23, 23, 23, .03);
    }

    .google-btn {
      width: 100%;
      height: 52px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: white;
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      transition: .2s ease;
    }

    .google-btn:hover {
      border-color: #cfcfc8;
      transform: translateY(-1px);
      box-shadow: 0 5px 15px rgba(0,0,0,.05);
    }

    .google-icon {
      font-size: 18px;
      font-weight: 700;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 24px 0;
      color: #aaa9a3;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: var(--border);
      flex: 1;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 52px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: #fcfcfa;
      padding: 0 15px;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      outline: none;
      transition: .2s ease;
    }

    input::placeholder {
      color: #aaa9a3;
    }

    input:focus {
      border-color: var(--blue);
      background: white;
      box-shadow: 0 0 0 4px rgba(83,109,255,.08);
    }

    .password-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .forgot {
      color: var(--blue);
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    .submit-btn {
      width: 100%;
      height: 54px;
      margin-top: 5px;
      border: 0;
      border-radius: var(--radius-md);
      background: var(--text);
      color: white;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s ease;
    }

    .submit-btn:hover {
      transform: translateY(-1px);
      background: #292929;
      box-shadow: 0 8px 20px rgba(23,23,23,.12);
    }

    .submit-btn:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #fff1ef;
      color: #a4493b;
      border: 1px solid #f1d0ca;
    }

    .message.success {
      display: block;
      background: #eef8f1;
      color: #39704d;
      border: 1px solid #cfe6d6;
    }

    .terms {
      text-align: center;
      margin-top: 21px;
      color: #999892;
      font-size: 11px;
      line-height: 1.6;
    }

    .terms a {
      color: var(--muted);
      text-decoration: underline;
    }

    footer {
      padding: 24px 5vw;
      display: flex;
      justify-content: center;
      color: #aaa9a3;
      font-size: 11px;
    }

    @media (max-width: 800px) {
      nav {
        height: 72px;
        padding: 0 22px;
      }

      .logo {
        font-size: 25px;
      }

      .nav-right {
        font-size: 13px;
      }

      main {
        padding: 40px 16px 65px;
        align-items: flex-start;
      }

      .login-wrap {
        max-width: 100%;
      }

      .intro {
        margin-bottom: 25px;
      }

      h1 {
        font-size: 42px;
        letter-spacing: -2px;
      }

      .intro p {
        font-size: 14px;
        max-width: 310px;
      }

      .card {
        padding: 22px;
        border-radius: 20px;
      }

      footer {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <nav>
    <a href="index.html" class="logo">parla<span>•</span></a>

    <div class="nav-right">
      New to Parla?
      <a href="signup.html">Create account</a>
    </div>
  </nav>

  <main>
    <div class="login-wrap">

      <div class="intro">
        <div class="eyebrow">
          <span class="eyebrow-dot"></span>
          Welcome back
        </div>

        <h1>Good to see you.</h1>

        <p>
          Pick up where you left off and keep building a language you can actually use.
        </p>
      </div>

      <div class="card">

        <button class="google-btn" type="button" id="googleBtn">
          <span class="google-icon">G</span>
          Continue with Google
        </button>

        <div class="divider">
          or continue with email
        </div>

        <div id="message" class="message"></div>

        <form id="loginForm">

          <div class="field">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            >
          </div>

          <div class="field">

            <div class="password-row">
              <label for="password">Password</label>
              <a href="#" class="forgot" id="forgotPassword">
                Forgot password?
              </a>
            </div>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

          </div>

          <button class="submit-btn" id="loginBtn" type="submit">
            Log in
          </button>

        </form>

        <div class="terms">
          By continuing, you agree to Parla's
          <a href="#">Terms</a> and
          <a href="#">Privacy Policy</a>.
        </div>

      </div>

    </div>
  </main>

  <footer>
    © 2026 Parla
  </footer>

  <script src="supabase-config.js"></script>

  <script>
    const { createClient } = supabase;

    const supabaseClient = createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const loginForm = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const message = document.getElementById("message");
    const forgotPassword = document.getElementById("forgotPassword");
    const googleBtn = document.getElementById("googleBtn");

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = "message " + type;
    }

    function clearMessage() {
      message.textContent = "";
      message.className = "message";
    }

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      clearMessage();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      loginBtn.disabled = true;
      loginBtn.textContent = "Logging in...";

      const { error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        showMessage(error.message);
        loginBtn.disabled = false;
        loginBtn.textContent = "Log in";
        return;
      }

      window.location.href = "dashboard.html";
    });

    forgotPassword.addEventListener("click", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();

      if (!email) {
        showMessage("Enter your email address first.");
        return;
      }

      clearMessage();

      const { error } = await supabaseClient.auth.resetPasswordForEmail(
        email,
        {
          redirectTo: window.location.origin + "/reset-password.html"
        }
      );

      if (error) {
        showMessage(error.message);
        return;
      }

      showMessage(
        "Check your email for a password reset link.",
        "success"
      );
    });

    googleBtn.addEventListener("click", async () => {
      clearMessage();

      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo: window.location.origin + "/dashboard.html"
        }
      });

      if (error) {
        showMessage(error.message);
      }
    });

    async function checkExistingSession() {
      const { data } = await supabaseClient.auth.getSession();

      if (data.session) {
        window.location.href = "dashboard.html";
      }
    }

    checkExistingSession();
  </script>

</body>
</html>
