<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=20261023">
  <script src="site-config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | Nahtive</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  
<link rel="stylesheet" href="nahtive.css">
  <style>
    body.login-page{min-height:100vh;background:radial-gradient(ellipse at 85% 18%,rgba(182,243,106,.08),transparent 32%),var(--bg)!important}
    .login-page .page{width:min(1100px,calc(100% - 48px));margin:0 auto;display:flex;min-height:100vh;flex-direction:column}
    .login-page nav{min-height:84px;border-bottom:1px solid var(--line)}
    .login-page .logo{text-transform:capitalize!important;font-size:25px!important}
    .login-page .logo span,.login-page .logo i{color:var(--accent)!important}
    .login-page .nav-right{font-size:13px}
    .login-page .nav-right a{color:var(--accent)!important;font-weight:750}
    .login-page main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 0 62px}
    .login-page .login-card{width:100%;max-width:460px;margin:0;padding:clamp(26px,4vw,38px)!important;border-color:rgba(255,255,255,.1)!important;border-radius:26px!important;background:rgba(20,26,43,.96)!important;box-shadow:0 30px 90px rgba(0,0,0,.28)!important}
    .login-page .eyebrow{display:inline-flex;align-items:center;padding:8px 12px;border:1px solid rgba(182,243,106,.24);border-radius:999px;background:rgba(182,243,106,.08);color:var(--accent)!important;font-size:10px!important;letter-spacing:.12em}
    .login-page h1{margin-top:20px;font-size:clamp(36px,5vw,48px);line-height:1.08;letter-spacing:-.05em;color:#fff!important}
    .login-page .intro{margin:14px 0 25px!important;color:#c2cada!important;font-size:14px;line-height:1.75}
    .login-page .google-btn{height:51px;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:13px!important;border-color:rgba(255,255,255,.16)!important;background:#1b2238!important;color:#f4f1ea!important;font-size:13px;font-weight:750}
    .login-page .divider{margin:21px 0;color:#aeb7c9!important;font-size:10px}
    .login-page .field{margin-bottom:17px}
    .login-page .field label{color:#f4f1ea!important;font-size:12px;font-weight:750}
    .login-page input{display:block;width:100%;min-height:50px;margin-top:8px;padding:13px 14px;border:1px solid #e4e7ec!important;border-radius:12px!important;background:#fff!important;color:#172033!important;font-size:14px;box-shadow:none!important}
    .login-page input::placeholder{color:#7b8494!important}
    .login-page input:focus{border-color:#9bd34f!important;box-shadow:0 0 0 3px rgba(182,243,106,.16)!important}
    .login-page .password-row{align-items:center}
    .login-page .forgot{border:0;background:transparent;color:var(--accent)!important;font-size:11px;text-decoration:none}
    .login-page .submit-btn{width:100%;min-height:51px;margin-top:4px;border-radius:13px!important;background:var(--accent)!important;color:#10200a!important;font-size:13px;font-weight:800}
    .login-page .message{color:#ffb5ad!important;line-height:1.6}
    .login-page .terms{margin-top:20px;color:#aab3c5!important;font-size:10px;line-height:1.8}
    .login-page footer{padding:20px 0 24px;border-top:1px solid var(--line);text-align:center;color:#7e899f;font-size:11px}
    @media(max-width:600px){
      .login-page .page{width:calc(100% - 32px)}
      .login-page nav{min-height:72px}
      .login-page main{padding:34px 0 42px}
      .login-page .login-card{padding:24px!important}
    }
  </style><style id="nahtive-brand-style">
.nahtive-logo{display:block;width:clamp(132px,16vw,174px);height:auto;max-width:100%}
a.logo:has(>.nahtive-logo),a.brand:has(>.nahtive-logo),.nahtive-brand{display:inline-flex;align-items:center;flex:none;line-height:0;text-decoration:none}
.nahtive-brand{position:fixed;top:22px;left:24px;z-index:10}
@media(max-width:520px){.nahtive-logo{width:132px}.nahtive-brand{top:16px;left:16px}}
</style>
</head>

<body class="login-page" style="visibility:hidden">
  <div class="page">

    <nav>
      <a href="index.html" class="logo"><img src="nahtive-logo.svg?v=20261023" alt="Nahtive" class="nahtive-logo"></a>

      <div class="nav-right">
        New to Nahtive?
        <a href="signup.html">Create account</a>
      </div>
    </nav>

    <main>
      <section class="login-card">

        <div class="eyebrow">Welcome back</div>

        <h1>Good to see you.</h1>

        <p class="intro">
          Pick up where you left off. Your learning, progress, and conversations
          are waiting for you.
        </p>

        <button type="button" class="google-btn" id="googleBtn">
          <span class="google-icon" style="font-weight:800;background:conic-gradient(#4285F4 0 25%,#34A853 25% 50%,#FBBC05 50% 75%,#EA4335 75%);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:21px">G</span>
          <span>Continue with Google</span>
        </button>

        <div class="divider">or continue with email</div>

        <form id="loginForm">

          <div class="field">
            <label for="email">Email</label>
            <input
              id="email"
              type="email"
              autocomplete="email"
              required
            >
          </div>

          <div class="field">
            <div class="password-row">
              <label for="password">Password</label>
              <button
                type="button"
                class="forgot"
                id="forgotBtn"
              >
                Forgot password?
              </button>
            </div>

            <input
              id="password"
              type="password"
              autocomplete="current-password"
              required
            >
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">
            Log in
          </button>

          <div class="message" id="message"></div>

        </form>

        <div class="terms">
          By continuing, you agree to Nahtive's Terms and Privacy Policy.
        </div>

      </section>
    </main>

    <footer>
      © 2026 Nahtive
    </footer>

  </div>

  <script>
    const supabaseClient = window.supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_ANON_KEY
    );

    const googleBtn = document.getElementById("googleBtn");
    const loginForm = document.getElementById("loginForm");
    const forgotBtn = document.getElementById("forgotBtn");
    const message = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    function showMessage(text) {
      message.textContent = text;
    }

    function getNextPage() {
      const source = new URLSearchParams(window.location.search);
      const params = new URLSearchParams();

      const keys = [
        "targetLanguage",
        "NahtiveLanguage",
        "level",
        "goal",
        "interests",
        "language"
      ];

      keys.forEach(key => {
        const value = source.get(key);
        if (value) params.set(key, value);
      });

      const hasPendingOnboarding =
        params.has("targetLanguage") ||
        params.has("language") ||
        params.has("NahtiveLanguage") ||
        params.has("level") ||
        params.has("goal") ||
        params.has("interests");

      if (!hasPendingOnboarding) {
        return "dashboard.html";
      }

      const query = params.toString();
      return "onboarding.html" + (query ? "?" + query : "");
    }

    googleBtn.addEventListener("click", async () => {
      googleBtn.disabled = true;
      googleBtn.textContent = "Connecting…";
      showMessage("");

      localStorage.setItem("nahtive_auth_next", getNextPage());

      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo: window.location.origin + "/auth-callback.html"
        }
      });

      if (error) {
        googleBtn.disabled = false;
        googleBtn.innerHTML = `
          <span class="google-icon">G</span>
          <span>Continue with Google</span>
        `;
        showMessage(error.message);
      }
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      submitBtn.disabled = true;
      submitBtn.textContent = "Logging in…";
      showMessage("");

      const { error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        showMessage(error.message);
        submitBtn.disabled = false;
        submitBtn.textContent = "Log in";
        return;
      }

      const { data: signedInData } = await supabaseClient.auth.getSession();
      const pending = signedInData?.session?.user?.user_metadata?.nahtive_onboarding_pending;

      window.location.href = pending ? "onboarding.html?resume=1" : getNextPage();
    });

    forgotBtn.addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();

      if (!email) {
        showMessage("Enter your email address first.");
        return;
      }

      const { error } = await supabaseClient.auth.resetPasswordForEmail(
        email,
        {
          redirectTo: window.location.origin + "/login.html"
        }
      );

      if (error) {
        showMessage(error.message);
        return;
      }

      message.style.color = "#b6f36a";
      showMessage("Password reset instructions have been sent.");
    });

    async function showExistingSession() {
      const { data, error } = await supabaseClient.auth.getSession();
      if (error) {
        document.body.style.visibility="visible";
        return;
      }
      if (!data.session) {
        document.body.style.visibility="visible";
        document.body.classList.add("auth-ready");
        return;
      }

      const pending = data.session.user?.user_metadata?.nahtive_onboarding_pending;
      window.location.replace(pending ? "onboarding.html?resume=1" : "dashboard.html");
    }


    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = value == null ? "" : String(value);
      return div.innerHTML;
    }

    showExistingSession();
  </script>
</body>
</html>
