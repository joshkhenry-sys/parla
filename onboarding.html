  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <script>
    const supabaseClient = window.supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_ANON_KEY
    );

    async function redirectReturningLearner() {
      const params = new URLSearchParams(window.location.search);
      try {
        const { data } = await supabaseClient.auth.getSession();
        const user = data?.session?.user;
        if (!user) {
          document.body.style.visibility = "visible";
          return;
        }

        const requested = params.get("language") || params.get("targetLanguage");
        const adding = params.get("add") === "1";

        const { data: saved } = await supabaseClient
          .from("learner_languages")
          .select("id,is_current,languages(name)")
          .eq("user_id", user.id);

        if (!adding && !requested && saved?.length) {
          window.location.replace("dashboard.html");
          return;
        }

        if (!adding && requested && saved?.length) {
          const match = saved.find(row => (row.languages?.name || "").toLowerCase() === requested.toLowerCase());
          if (match) {
            await supabaseClient.from("learner_languages").update({is_current:false}).eq("user_id", user.id);
            await supabaseClient.from("learner_languages").update({is_current:true}).eq("id", match.id).eq("user_id", user.id);
            localStorage.setItem("Nahtive_current_learner_language", match.id);
            window.location.replace("dashboard.html");
            return;
          }
        }

        document.body.style.visibility = "visible";
      } catch (error) {
        console.error("Could not resume learning:", error);
        document.body.style.visibility = "visible";
      }
    }


    const state = {
      targetLanguage: null,
      NahtiveLanguage: null,
      level: null,
      goal: "Conversation",
      interests: ["EverydayLife"]
    };

    let currentStep = 1;

    const steps = document.querySelectorAll(".step");
    const progressBar = document.getElementById("progressBar");
    const progressLabel = document.getElementById("progressLabel");
    const progressNumber = document.getElementById("progressNumber");

    const labels = {
      1: "Language",
      2: "You speak",
      3: "Your level"
    };

    function updateProgress() {
      progressBar.style.width = (currentStep * 33.333) + "%";
      progressLabel.textContent = labels[currentStep] || "Ready";
      progressNumber.textContent = currentStep <= 3 ? (currentStep + " of 3") : "Complete";
    }
    function showStep(stepNumber) {
      steps.forEach(step => {
        step.classList.toggle(
          "active",
          Number(step.dataset.step) === stepNumber
        );
      });

      currentStep = stepNumber;

      updateProgress();
      updateContinueButton();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function updateContinueButton() {}
    
    function nextStep() {
      if (currentStep < 3) {
        showStep(currentStep + 1);
        return;
      }
      finishOnboarding();
    }

    function goBack() {
      if (currentStep > 1) {
        showStep(currentStep - 1);
      }
    }

    /* LANGUAGE / STANDARD OPTION SELECTION */

    document.querySelectorAll(
      ".language-card, .option, .big-option"
    ).forEach(element => {

      element.addEventListener("click", () => {

        const group = element.dataset.group;
        const value = element.dataset.value;

        if (!group || !value) return;

        /* INTERESTS = MULTI SELECT */

        if (group === "interests") {

          element.classList.toggle("selected");

          if (state.interests.includes(value)) {
            state.interests = state.interests.filter(
              interest => interest !== value
            );
          } else {
            state.interests.push(value);
          }

        } else {

          const selector =
            `.step[data-step="${currentStep}"] ` +
            `[data-group="${group}"]`;

          document.querySelectorAll(selector).forEach(item => {
            item.classList.remove("selected");
          });

          element.classList.add("selected");

          state[group] = value;

          if (group === "targetLanguage") {
            updateLanguageSummary();
          }
        }

        updateContinueButton();

        if (currentStep === 1 && state.targetLanguage) {
          setTimeout(() => showStep(2), 120);
        } else if (currentStep === 2 && state.NahtiveLanguage) {
          setTimeout(() => showStep(3), 120);
        } else if (currentStep === 3 && state.level) {
          setTimeout(() => finishOnboarding(), 120);
        }
      });

    });

    function updateLanguageSummary() {
      const summary = document.getElementById("selectedSummary");
      const text = document.getElementById("selectedLanguageText");

      if (!state.targetLanguage) {
        summary.classList.remove("visible");
        return;
      }

      text.textContent = state.targetLanguage;
      summary.classList.add("visible");
    }

    function buildFinishPreview() {
      const preview = document.getElementById("languagePreview");

      preview.innerHTML = "";

      const pill = document.createElement("div");
      pill.className = "preview-pill";
      pill.textContent =
        `${state.targetLanguage} · ${state.level}`;

      preview.appendChild(pill);
    }

    async function finishOnboarding() {
      const learningProfile = {
        targetLanguage: state.targetLanguage,
        NahtiveLanguage: state.NahtiveLanguage,
        level: state.level,
        goal: state.goal,
        interests: state.interests
      };

      try {
        sessionStorage.setItem(
          "nahtive_learning_profile",
          JSON.stringify(learningProfile)
        );

        const client = window.supabase.createClient(
          window.SUPABASE_URL,
          window.SUPABASE_ANON_KEY
        );

        const { data: sessionData } = await client.auth.getSession();
        const user = sessionData?.session?.user;

        if (!user) {
          window.location.href = buildAuthUrl("signup");
          return;
        }

        const languageMap = {
          Spanish: "es", English: "en", Portuguese: "pt", French: "fr",
          Italian: "it", German: "de", Japanese: "ja", Korean: "ko",
          Mandarin: "zh", Arabic: "ar", Dutch: "nl", Swedish: "sv",
          Greek: "el", Turkish: "tr", Hindi: "hi", Polish: "pl"
        };

        const languageCode = languageMap[state.targetLanguage];
        if (!languageCode) throw new Error("Unsupported language.");

        const { data: language, error: languageError } = await client
          .from("languages")
          .select("id")
          .eq("code", languageCode)
          .single();

        if (languageError) throw languageError;

        const { error: clearCurrentError } = await client
          .from("learner_languages")
          .update({ is_current: false })
          .eq("user_id", user.id)
          .eq("is_current", true);

        if (clearCurrentError) throw clearCurrentError;

        const { data: learnerLanguage, error: learnerError } = await client
          .from("learner_languages")
          .upsert({
            user_id: user.id,
            language_id: language.id,
            level: state.level,
            goal: state.goal,
            interests: state.interests,
            is_current: true
          }, {
            onConflict: "user_id,language_id"
          })
          .select("id")
          .single();

        if (learnerError) throw learnerError;

        const skills = ["vocabulary", "grammar", "understanding", "conversation", "confidence"];
        await client.from("learner_skills").upsert(
          skills.map(skill => ({
            learner_language_id: learnerLanguage.id,
            skill,
            mastery: 0
          })),
          { onConflict: "learner_language_id,skill" }
        );

        const NahtiveLanguageMap = {
          English: "en",
          Spanish: "es",
          Portuguese: "pt",
          French: "fr",
          German: "de",
          Italian: "it",
          Japanese: "ja",
          Korean: "ko",
          Mandarin: "zh",
          Arabic: "ar",
          Other: null
        };

        const { error: profileError } = await client.from("profiles").upsert({
          id: user.id,
          Nahtive_language_code: NahtiveLanguageMap[state.NahtiveLanguage] || null,
          goal: state.goal,
          interests: state.interests
        });

        if (profileError) throw profileError;

        const { error: metadataError } = await client.auth.updateUser({
          data: {
            nahtive_onboarding_pending: false
          }
        });

        if (metadataError) throw metadataError;

        window.location.href = "dashboard.html";
      } catch (error) {
        console.error("Onboarding save failed:", error);
        alert("We couldn't save your learning profile yet. Please try again.");
      }
    }

    function buildAuthParams() {
      const params = new URLSearchParams();

      if (state.targetLanguage) params.set("targetLanguage", state.targetLanguage);
      if (state.NahtiveLanguage) params.set("NahtiveLanguage", state.NahtiveLanguage);
      if (state.level) params.set("level", state.level);
      if (state.goal) params.set("goal", state.goal);
      if (state.interests.length) params.set("interests", JSON.stringify(state.interests));

      return params;
    }

    function buildAuthUrl(page) {
      const params = buildAuthParams();
      return page + ".html?" + params.toString();
    }

    async function applyPendingProfile() {
      const params = new URLSearchParams(window.location.search);

      let pendingTarget = params.get("targetLanguage") || params.get("language");
      let pendingNahtive = params.get("NahtiveLanguage");
      let pendingLevel = params.get("level");
      let pendingGoal = params.get("goal");
      let pendingInterests = [];

      try {
        const rawInterests = params.get("interests");
        if (rawInterests) {
          const parsed = JSON.parse(rawInterests);
          if (Array.isArray(parsed)) pendingInterests = parsed;
        }
      } catch (_) {
        pendingInterests = [];
      }

      if (!(pendingTarget && pendingNahtive && pendingLevel && pendingGoal && pendingInterests.length)) {
        const { data } = await supabaseClient.auth.getSession();
        const pending = data?.session?.user?.user_metadata?.nahtive_onboarding_pending;
        const saved = data?.session?.user?.user_metadata?.nahtive_onboarding_profile;

        if (pending && saved) {
          pendingTarget = saved.targetLanguage || pendingTarget;
          pendingNahtive = saved.NahtiveLanguage || pendingNahtive;
          pendingLevel = saved.level || pendingLevel;
          pendingGoal = saved.goal || pendingGoal;
          pendingInterests = Array.isArray(saved.interests) ? saved.interests : pendingInterests;
        }
      }

      try {
        const rawInterests = params.get("interests");
        if (rawInterests) {
          const parsed = JSON.parse(rawInterests);
          if (Array.isArray(parsed)) pendingInterests = parsed;
        }
      } catch (_) {
        pendingInterests = [];
      }

      const clickValue = (group, value) => {
        if (!value) return;
        const card = Array.from(
          document.querySelectorAll('[data-group="' + group + '"]')
        ).find(item => item.dataset.value === value);
        if (card) card.click();
      };

      clickValue("targetLanguage", pendingTarget);
      clickValue("NahtiveLanguage", pendingNahtive);
      clickValue("level", pendingLevel);
      clickValue("goal", pendingGoal);

      pendingInterests.forEach(value => clickValue("interests", value));

      return Boolean(
        pendingTarget &&
        pendingNahtive &&
        pendingLevel &&
        pendingGoal &&
        pendingInterests.length > 0
      );
    }

    async function finishPendingProfileAfterAuth() {
      const hasPendingProfile = await applyPendingProfile();
      if (!hasPendingProfile) {
        updateProgress();
        updateContinueButton();
        return;
      }

      const { data } = await supabaseClient.auth.getSession();

      if (data?.session) {
        currentStep = 6;
        buildFinishPreview();
        await finishOnboarding();
        return;
      }

      updateProgress();
      updateContinueButton();
    }

    redirectReturningLearner();
    applyPendingProfile().then(() => updateProgress());
  </script>
