<!doctype html>
<html lang="en">
<head>
<link rel="icon" type="image/jpeg" href="/Gradient%20Ribbon%20N%20Logo.jpg?v=20261024">
  <script src="site-config.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nahtive — Lesson</title>
  <link rel="stylesheet" href="nahtive.css">
  <style>
    /* Lesson-only layout. Global typography, surfaces, and base controls come from nahtive.css. */
    :root{
      --lesson-bg:#080c15;
      --lesson-surface:#141d2e;
      --lesson-surface2:#202c43;
      --lesson-white:#f8faff;
      --lesson-muted:#c0cadb;
      --lesson-lime:#c2ff70;
      --lesson-coral:#ff6b6b;
    }

    body.lesson-page{background:var(--lesson-bg)!important;color:var(--lesson-white)!important}
    body.lesson-page .shell{width:min(1080px,calc(100% - 34px))}
    body.lesson-page nav{min-height:72px}
    body.lesson-page .logo{color:#fff!important}
    body.lesson-page .exit{color:var(--lesson-muted)!important}

    .lesson-wrap{padding:16px 0 70px}
    .lesson-top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:20px 0 14px}
    .lesson-eyebrow{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--lesson-lime)}
    .lesson-top h1{font-size:clamp(30px,5vw,52px);line-height:.98;letter-spacing:-.055em;margin-top:7px;color:#fff}
    .lesson-intro{margin-top:9px;color:var(--lesson-muted);font-size:14px}
    .xp-pill{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:999px;background:#242e4b;border:1px solid #34415f;color:var(--lesson-lime);font-size:12px;font-weight:900;white-space:nowrap}
    .xp-star{display:grid;place-items:center;width:19px;height:19px;border-radius:7px;background:var(--lesson-lime);color:#10162a;font-size:11px}

    .lesson-progress{position:sticky;top:0;z-index:5;padding:12px 0;background:linear-gradient(var(--lesson-bg) 72%,transparent)}
    .progress-meta{display:flex;justify-content:space-between;gap:15px;color:var(--lesson-muted);font-size:11px;font-weight:800}
    .progress-track{height:9px;margin-top:8px;border-radius:99px;background:#202a43;overflow:hidden;border:1px solid #2d3855}
    .progress-fill{height:100%;width:0;background:var(--lesson-lime);border-radius:99px;transition:width .35s cubic-bezier(.2,.8,.2,1)}

    .lesson-card{position:relative;max-width:900px;margin:16px auto 0;padding:clamp(24px,5vw,48px);border-radius:30px;background:var(--lesson-surface);border:1px solid #2b3653;box-shadow:0 24px 70px rgba(0,0,0,.24);overflow:hidden}
    .lesson-card:before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-100px;top:-100px;background:rgba(182,243,106,.10);pointer-events:none}
    .stage-chip{display:inline-flex;padding:7px 10px;border-radius:10px;background:#222d49;color:var(--lesson-lime);font-size:10px;font-weight:900;letter-spacing:.11em;text-transform:uppercase}

    .scene-card{min-height:410px;display:flex;flex-direction:column;justify-content:center}
    .scene-icon{width:68px;height:68px;display:grid;place-items:center;border-radius:22px;background:var(--lesson-lime);color:#12182a;font-size:30px;font-weight:900;box-shadow:8px 8px 0 rgba(182,243,106,.18);margin-bottom:25px}
    .scene-card h2{font-size:clamp(34px,6vw,66px);line-height:.94;letter-spacing:-.06em;color:#fff;max-width:700px;margin:17px 0}
    .scene-card p{max-width:650px;color:var(--lesson-muted);font-size:17px;line-height:1.65}
    .mission{display:inline-flex;align-items:center;gap:9px;margin-top:25px;padding:12px 15px;border-radius:14px;background:#17213a;border:1px solid #2c3958;color:#fff;font-size:13px;font-weight:750;width:max-content;max-width:100%}
    .mission b{color:var(--lesson-lime)}

    .teach-card{min-height:470px}
    .target{font-size:clamp(36px,6vw,64px);line-height:1;letter-spacing:-.055em;color:#fff;margin:24px 0 10px;max-width:820px}
    .translation{font-size:20px;color:#dbe5f6;line-height:1.5}
    .explain-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:28px}
    .explain{padding:18px;border-radius:17px;background:#202b46!important;border:1px solid #3b4a6d!important;color:var(--lesson-white)!important}
    .explain-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#b6f36a!important;font-weight:900;margin-bottom:8px}
    .explain p{color:#f4f1ea!important;font-size:13px;line-height:1.55}
    .explain strong{color:#fff!important}
    .clarification{margin-top:18px;padding:18px 20px;border-radius:18px;background:#172b24!important;border:1px solid var(--lesson-lime)!important;box-shadow:0 0 0 1px rgba(182,243,106,.08),0 12px 30px rgba(0,0,0,.18)}
    .clarification .explain-label{color:#b6f36a!important;margin-bottom:7px}
    .clarification p{color:var(--lesson-white)!important;font-size:14px;line-height:1.65}
    .clarification strong{color:#ffffff!important;font-weight:900;text-decoration:underline;text-decoration-color:rgba(182,243,106,.7);text-underline-offset:3px}
    .verb-highlight{color:#101729;background:var(--lesson-lime);padding:0 .08em;border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone;font-weight:950}
    .verb-focus-list{display:grid;gap:12px;margin-top:18px}
    .verb-focus{padding:18px;border:1px solid #3b4a6d;border-radius:17px;background:#19233a}
    .verb-focus-head{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-bottom:10px}
    .verb-form{font-size:20px;font-weight:950;color:var(--lesson-lime)}
    .verb-tense{font-size:11px;font-weight:850;letter-spacing:.04em;color:#dbe5f6;background:#293654;padding:6px 9px;border-radius:999px}
    .verb-focus p{color:var(--lesson-white);font-size:14px;line-height:1.65;margin-top:6px}
    .verb-focus .verb-meta{color:var(--lesson-muted);font-size:12px}
    .example{margin-top:10px;padding:16px;border-radius:17px;background:#121a2d;border:1px solid #2c3958}
    .example strong{display:block;color:#fff;font-size:16px}
    .example span{display:block;margin-top:4px;color:var(--lesson-muted);font-size:12px}
    .audio-btn{margin-top:18px;border:1px solid #34415f!important;background:#202b46!important;color:#fff!important;border-radius:14px!important;padding:11px 14px!important;font-weight:850!important}

    .builder{margin-top:25px}
    .build-prompt{font-size:13px;color:var(--lesson-muted);margin-bottom:10px}
    .build-target{font-size:24px;line-height:1.35;color:#fff;font-weight:800;margin-bottom:16px}
    .built{min-height:72px;display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:12px;border-radius:18px;background:#0e1527;border:2px dashed #35415e;margin-bottom:15px}
    .built.empty{color:#65728d;font-size:13px}
    .word-bank{display:flex;flex-wrap:wrap;gap:9px}
    .arabic-build{direction:rtl;unicode-bidi:plaintext;text-align:right}
    .arabic-build .word,.arabic-build .built-word{direction:rtl;unicode-bidi:plaintext;text-align:center;font-size:17px!important;line-height:1.5}
    .word{border:1px solid #3a4867!important;background:#263554!important;color:#f4f1ea!important;border-radius:13px!important;padding:12px 14px!important;font-size:14px!important;font-weight:800!important;transition:.14s!important}
    .word:hover{transform:translateY(-2px);border-color:var(--lesson-lime)!important;background:#263554!important}
    .word.used{opacity:1!important;transform:none!important;border:2px solid #b6f36a!important;background:#263554!important;color:#f4f1ea!important;box-shadow:0 0 0 3px rgba(182,243,106,.2),0 5px 16px rgba(182,243,106,.12)!important;position:relative}
    .word.used::after{content:" ✓";color:#b6f36a!important;font-weight:950}
    .built-word{border:1px solid #b6f36a!important;background:#263554!important;color:#f4f1ea!important;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:850;cursor:pointer;box-shadow:0 3px 10px rgba(182,243,106,.12)}
    .built-word:hover{background:#314267!important;border-color:#b6f36a!important;transform:translateY(-1px)}
    .built-word:focus-visible,.word:focus-visible{outline:3px solid #fff!important;outline-offset:3px}
    .build-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}
    .primary-lesson,.secondary-lesson{border-radius:14px!important;padding:13px 18px!important;font-weight:900!important;border:0!important}
    .primary-lesson{background:var(--lesson-lime)!important;color:#111729!important}
    .primary-lesson:hover{transform:translateY(-2px)}
    .secondary-lesson{background:#222d49!important;color:#fff!important;border:1px solid #35415f!important}
    .feedback{min-height:25px;margin-top:13px;font-size:13px;font-weight:750;color:var(--lesson-muted)}
    .feedback.good{color:var(--lesson-lime)}
    .feedback.bad{color:var(--lesson-coral)}

    .question{font-size:clamp(24px,4vw,38px);line-height:1.12;letter-spacing:-.04em;color:#fff;margin:22px 0}
    .options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    #challengeOptions{grid-template-columns:1fr;gap:10px;margin:16px 0}
    #challengeOptions .option{width:100%;min-width:0;align-items:flex-start;white-space:normal;line-height:1.45;padding:15px 16px}
    #challengeOptions .option-copy{display:block;min-width:0;overflow-wrap:anywhere}
    .option{display:flex;align-items:center;gap:12px;text-align:left;min-height:65px;padding:14px;border-radius:16px!important;border:1px solid #35415f!important;background:#1d2741!important;color:#fff!important;font-size:14px;font-weight:750!important}
    .option:hover{border-color:var(--lesson-lime)!important;transform:translateY(-1px)}
    .option.correct{background:#173629!important;border-color:var(--lesson-lime)!important}
    .option.wrong{background:#3a2028!important;border-color:var(--lesson-coral)!important}
    .letter{display:grid;place-items:center;width:30px;height:30px;flex:none;border-radius:10px;background:#2a3653;color:#dce7f8;font-size:11px;font-weight:900}
    .streak-note{margin-top:17px;color:var(--lesson-lime);font-size:12px;font-weight:850}

    .final-card{text-align:center}
    .finish-badge{width:82px;height:82px;display:grid;place-items:center;margin:0 auto 18px;border-radius:28px;background:var(--lesson-lime);font-size:38px;box-shadow:8px 8px 0 rgba(182,243,106,.22)}
    .final-card h2{font-size:clamp(38px,6vw,64px);line-height:.95;letter-spacing:-.06em;color:#fff}
    .final-card p{max-width:560px;margin:14px auto;color:var(--lesson-muted);line-height:1.65}
    .xp-total{font-size:54px;line-height:1;color:var(--lesson-lime);font-weight:950;letter-spacing:-.05em;margin-top:16px}
    .xp-label{color:var(--lesson-muted);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.12em;margin-top:5px}
    .learned{display:grid;grid-template-columns:1fr 1fr;gap:9px;text-align:left;margin:28px 0}
    .learned-item{padding:13px 15px;border-radius:15px;background:#1b2540;border:1px solid #303c5b}
    .learned-item strong{display:block;color:#fff;font-size:14px}
    .learned-item span{display:block;color:var(--lesson-muted);font-size:12px;margin-top:3px}

    .confetti{position:fixed;width:9px;height:14px;z-index:50;pointer-events:none;animation:fall 1.25s ease-out forwards}
    @keyframes fall{0%{transform:translate3d(0,0,0) rotate(0);opacity:1}100%{transform:translate3d(var(--dx),var(--dy),0) rotate(720deg);opacity:0}}
    @keyframes pop{0%{transform:scale(.95)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
    .pop{animation:pop .35s ease}
    .loading-dark{padding:70px 0;color:var(--lesson-muted)}

    /* Mobile-first lesson experience */
    body.lesson-page{
      -webkit-text-size-adjust:100%;
      overscroll-behavior-x:none;
    }
    body.lesson-page .shell{
      width:min(1080px,calc(100% - 32px));
    }
    body.lesson-page nav{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      min-height:58px;
      padding:10px 0;
    }
    body.lesson-page .exit{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:42px;
      padding:8px 12px;
      border:1px solid #303b57;
      border-radius:999px;
      font-size:12px;
      text-decoration:none;
      white-space:nowrap;
    }
    .lesson-wrap{padding:8px 0 calc(32px + env(safe-area-inset-bottom))}
    .lesson-top{align-items:center;margin:14px 0 8px}
    .lesson-intro{max-width:40ch;line-height:1.5}
    .lesson-progress{
      top:0;
      padding:10px 0 12px;
      background:var(--lesson-bg);
      background:color-mix(in srgb,var(--lesson-bg) 96%,transparent);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }
    .progress-meta{font-size:12px}
    .progress-track{height:6px;border:0}
    .lesson-card{
      padding:clamp(20px,4vw,42px);
      border-radius:26px;
      overflow:visible;
    }
    .lesson-card:before{width:120px;height:120px;right:-55px;top:-55px}
    .scene-card{min-height:0;padding:12px 0}
    .scene-icon{width:54px;height:54px;border-radius:17px;margin-bottom:18px;font-size:25px}
    .scene-card h2{font-size:clamp(34px,5vw,60px);line-height:1.02;margin:14px 0}
    .scene-card p{font-size:16px;line-height:1.7}
    .mission{width:100%;box-sizing:border-box;align-items:flex-start;line-height:1.5;margin-top:20px}
    .target{font-size:clamp(34px,5.5vw,58px);line-height:1.13;overflow-wrap:anywhere;margin:22px 0 12px}
    .translation{font-size:clamp(17px,2.2vw,20px);line-height:1.6}
    .explain-grid{gap:10px;margin-top:20px}
    .explain{padding:16px}
    .explain p,.clarification p,.verb-focus p{font-size:15px;line-height:1.7}
    .clarification{padding:16px;margin-top:14px}
    .verb-focus{padding:15px}
    .verb-form{font-size:19px;overflow-wrap:anywhere}
    .example{padding:15px}
    .build-prompt{font-size:14px;line-height:1.5}
    .build-target{font-size:clamp(20px,3vw,25px);line-height:1.5;overflow-wrap:anywhere}
    .built{min-height:64px;padding:10px;gap:7px}
    .word-bank{gap:8px}
    .word,.built-word{
      min-height:48px;
      max-width:100%;
      padding:11px 13px!important;
      font-size:15px!important;
      line-height:1.4;
      overflow-wrap:anywhere;
      touch-action:manipulation;
    }
    .build-actions{
      display:grid;
      grid-template-columns:1fr;
      gap:9px;
      margin-top:22px;
    }
    .primary-lesson,.secondary-lesson{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:100%;
      min-height:54px;
      padding:14px 18px!important;
      font-size:15px!important;
      touch-action:manipulation;
    }
    .option{
      width:100%;
      min-width:0;
      min-height:60px;
      align-items:flex-start;
      padding:14px;
      font-size:15px;
      line-height:1.5;
      overflow-wrap:anywhere;
      touch-action:manipulation;
    }
    .option-copy{min-width:0;overflow-wrap:anywhere}
    .letter{width:30px;height:30px;flex:0 0 30px}
    .question{font-size:clamp(23px,4.5vw,34px);line-height:1.2;overflow-wrap:anywhere}
    .reading-passage{font-size:16px;line-height:1.85!important;padding:16px!important}
    .feedback{font-size:14px;line-height:1.55}
    .learned{gap:8px;margin:22px 0}
    .learned-item{padding:14px}
    .xp-total{font-size:clamp(42px,10vw,54px)}
    button,a{-webkit-tap-highlight-color:transparent}
    button:focus-visible,a:focus-visible{
      outline:3px solid #fff!important;
      outline-offset:3px;
    }
    @media(max-width:680px){
      body.lesson-page .shell{width:calc(100% - 28px);max-width:520px}
      body.lesson-page nav{min-height:54px}
      body.lesson-page .logo{font-size:21px}
      body.lesson-page .exit{min-height:40px;padding:7px 10px}
      .lesson-top{align-items:flex-start;gap:10px;margin-top:10px}
      .lesson-top h1{font-size:clamp(29px,8vw,38px);line-height:1.02;letter-spacing:-.045em}
      .lesson-eyebrow{font-size:10px;letter-spacing:.09em}
      .lesson-intro{font-size:13px;max-width:26ch}
      .xp-pill{padding:7px 9px;font-size:11px;gap:5px}
      .xp-star{width:17px;height:17px}
      .lesson-progress{margin:0 -2px}
      .lesson-card{padding:22px 16px;border-radius:22px;margin-top:10px}
      .scene-card{min-height:0}
      .scene-card h2{font-size:clamp(34px,10vw,46px)}
      .scene-card p{font-size:15px}
      .target{font-size:clamp(32px,8.5vw,42px);letter-spacing:-.04em}
      .translation{font-size:18px}
      .stage-chip{font-size:10px;letter-spacing:.08em;line-height:1.4;white-space:normal}
      .question{font-size:25px;margin:18px 0 14px}
      .options{grid-template-columns:minmax(0,1fr);gap:9px}
      .option{min-height:60px}
      .explain-grid,.learned{grid-template-columns:minmax(0,1fr)}
      .verb-focus-head{align-items:flex-start}
      .verb-tense{white-space:normal;line-height:1.4}
      .final-card h2{font-size:clamp(36px,10vw,48px)}
      .finish-badge{width:68px;height:68px;border-radius:22px}
      .loading-dark{padding:38px 0;line-height:1.6}
    }
    @media(max-width:360px){
      body.lesson-page .shell{width:calc(100% - 22px)}
      .lesson-card{padding:19px 13px}
      .lesson-top h1{font-size:29px}
      .xp-pill{padding:6px 7px}
      .target{font-size:30px}
      .build-actions{gap:8px}
    }
    @media(prefers-reduced-motion:reduce){
      .pop,.confetti{animation:none!important}
      .progress-fill{transition:none!important}
      .word,.built-word,.option,.primary-lesson{transition:none!important}
    }
  </style>
<style id="nahtive-brand-style">
.nahtive-logo{display:block;width:clamp(132px,16vw,174px);height:auto;max-width:100%}

.nahtive-wordmark{display:inline-block;font-family:Manrope,system-ui,sans-serif;font-size:clamp(1.55rem,2.2vw,2rem);font-weight:800;letter-spacing:-.065em;line-height:1.1;background:linear-gradient(105deg,#67e8f9 0%,#60a5fa 48%,#a78bfa 100%);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}

<body class="lesson-page">
<div class="shell">
  <nav><a class="logo" href="dashboard.html"><span class="nahtive-wordmark">Nahtive</span></a><a class="exit" href="dashboard.html">Leave lesson</a></nav>
  <div id="loading" class="loading-dark">Building your lesson…</div>
  <div id="lesson" class="lesson-wrap" style="display:none">
    <div class="lesson-top">
      <div>
        <div class="lesson-eyebrow" id="language">LANGUAGE · A1</div>
        <h1 id="title">Lesson</h1>
        <p class="lesson-intro" id="intro">Learn it. Understand it. Use it.</p>
      </div>
      <div class="xp-pill"><span class="xp-star">★</span><span id="xpLive">0 XP</span></div>
    </div>
    <div class="lesson-progress">
      <div class="progress-meta"><span id="stage">Situation</span><strong id="count">1 / 1</strong></div>
      <div class="progress-track"><div class="progress-fill" id="fill"></div></div>
    </div>
    <main id="card"></main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
let client=null,user=null,profile=null,baseLesson=null,lesson=null,index=0,finished=false,xp=0,answers=[],audioCtx=null;
let practiceSeconds=0,practiceStartedAt=null,practiceClockStarted=false;
function startPracticeClock(){if(practiceClockStarted)return;practiceClockStarted=true;if(document.visibilityState==="visible")practiceStartedAt=Date.now();document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){if(practiceStartedAt!==null){practiceSeconds+=Math.max(0,Date.now()-practiceStartedAt);practiceStartedAt=null;}}else if(practiceStartedAt===null){practiceStartedAt=Date.now();}});}
function stopPracticeClock(){if(practiceStartedAt!==null){practiceSeconds+=Math.max(0,Date.now()-practiceStartedAt);practiceStartedAt=null;}return Math.floor(practiceSeconds/1000);}
const lessonLoadWatchdog=setTimeout(()=>{

    const followUp=phrases.find(p=>/\bwhat about you\b|\bhow about you\b|\by tú\b/i.test(p.target));
    if(preference&&followUp){
      correctAnswer=preference.target.replace(/[.!?]+$/,"")+". "+followUp.target.replace(/^[.!?\s]+/,"");
      // Use four complete, readable responses that test the whole conversational turn.
      const candidates=[
        correctAnswer,
        preference.target,
        phrases.find(p=>/\bwhat book do you like\b|\bwhat .* do you like\b/i.test(p.target))?.target||"What book do you like?",
        "I like romance books."
      ];
      choices=[];
      candidates.forEach(value=>{
        const cleaned=String(value||"").trim();
        if(cleaned&&!choices.some(x=>normalizeBuildAnswer(x)===normalizeBuildAnswer(cleaned)))choices.push(cleaned);
      });
      // Guarantee four options without reintroducing concatenated legacy text.
      ["I like mystery books.","What about you?","I prefer romance books.","That sounds interesting."].forEach(value=>{
        if(choices.length<4&&!choices.some(x=>normalizeBuildAnswer(x)===normalizeBuildAnswer(value)))choices.push(value);
      });
      choices=choices.slice(0,4);
    }
  }

  let selected=false;
  shell('<span class="stage-chip">Real-world practice</span><h2 style="margin:12px 0 8px">What would sound natural?</h2><p style="color:var(--lesson-muted);line-height:1.65;margin:0 0 18px">'+esc(fc.situation||lesson.scene?.situation||"Choose the most natural response for this moment.")+'</p><div class="question" style="margin-bottom:16px">'+esc(fc.prompt||"Choose the most natural response.")+'</div><div class="options" id="challengeOptions">'+options+'</div><div class="feedback" id="feedback" aria-live="polite"></div><div id="challengeCorrection" style="display:none;padding:14px 16px;border:1px solid var(--line);border-radius:12px;margin-top:12px"><strong>'+esc(correctAnswer)+'</strong><div style="color:var(--muted);margin-top:7px;line-height:1.6">This is the best fit for the situation. Compare what it communicates with the other options.</div></div>',
    '<button class="primary-lesson" id="next" disabled>Finish lesson →</button>');
  document.querySelectorAll("#challengeOptions .option").forEach(button=>button.onclick=()=>{
    if(selected)return;selected=true;
    const correct=normalizeBuildAnswer(button.dataset.choice)===normalizeBuildAnswer(correctAnswer);
    document.querySelectorAll("#challengeOptions .option").forEach(option=>{
      option.disabled=true;
      if(normalizeBuildAnswer(option.dataset.choice)===normalizeBuildAnswer(correctAnswer))option.classList.add("correct");
    });
    if(correct){
      button.classList.add("correct");sound("good");addXP(15);
      $("feedback").textContent="That fits the situation. Nice work.";
      $("feedback").className="feedback good";
    }else{
      button.classList.add("wrong");sound("click");addXP(5);
      $("feedback").textContent="Not quite. Compare the best response below with your choice to see what fits the situation better.";
      $("feedback").className="feedback";
    }
    answers.push({type:"challenge",target:correctAnswer,attempt:button.dataset.choice,correct});
    $("challengeCorrection").style.display="block";$("next").disabled=false;
  });
  $("next").onclick=next;
}
function confetti(){
  const pieces=["#4da3ff","#ffd84d","#9df06b","#ff6b6b","#9b7cff"];
  for(let i=0;i<55;i++){const el=document.createElement("i");el.className="confetti";el.style.left=(35+Math.random()*30)+"vw";el.style.top="42vh";el.style.background=pieces[i%pieces.length];el.style.setProperty("--dx",(Math.random()*600-300)+"px");el.style.setProperty("--dy",(Math.random()*500+150)+"px");document.body.appendChild(el);setTimeout(()=>el.remove(),1400)}
}
function renderVerbCheck(c){

    if(correct){button.classList.add("correct");sound("good");addXP(8);$("verbFeedback").textContent="Correct — you understand the form, not just the translation.";$("verbFeedback").className="feedback good";}

function renderReading(c){

async function finish(){

  const scored=answers.filter(x=>["build","recall","understanding","challenge","production","reading"].includes(x.type));
  const correct=scored.filter(x=>x.correct).length,total=scored.length;
  const score=total?Math.round(correct/total*100):0;

    if(baseLesson?.id){
      await client.from("lesson_attempts").insert({lesson_id:baseLesson.id,score,responses:{answers,xp,completed:true}});
      const reviewRows=lesson.phrases.slice(0,5).map(p=>({learner_language_id:profile.id,item_type:"expression",source_text:p.meaning,target_text:p.target,explanation:p.usage||p.meaning,mastery:Math.min(100,15+xp/5),next_review_at:new Date(Date.now()+86400000).toISOString()}));

    }
