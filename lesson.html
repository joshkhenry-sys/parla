<!doctype html>
<html lang="en">
<head>
  <script src="site-config.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nahtive — Lesson</title>
  <link rel="stylesheet" href="nahtive.css">
  <style>
    /* Lesson-only layout. Global typography, surfaces, and base controls come from nahtive.css. */
    :root{
      --lesson-bg:#0b0f1a;
      --lesson-surface:#141a2b;
      --lesson-surface2:#1b2238;
      --lesson-white:#f4f1ea;
      --lesson-muted:#9ba4ba;
      --lesson-lime:#b6f36a;
      --lesson-coral:#ff6b6b;
    }

    body.lesson-page{background:var(--lesson-bg)!important;color:var(--lesson-white)!important}
    body.lesson-page .shell{width:min(1080px,calc(100% - 34px))}
    body.lesson-page nav{min-height:72px}
    body.lesson-page .logo{color:#fff!important}
    body.lesson-page .exit{color:var(--lesson-muted)!important}

    .lesson-wrap{padding:16px 0 70px}
    .lesson-top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:20px 0 14px}
    .lesson-eyebrow{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--lesson-lime)}
    .lesson-top h1{font-size:clamp(30px,5vw,52px);line-height:.98;letter-spacing:-.055em;margin-top:7px;color:#fff}
    .lesson-intro{margin-top:9px;color:var(--lesson-muted);font-size:14px}
    .xp-pill{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:999px;background:#242e4b;border:1px solid #34415f;color:var(--lesson-lime);font-size:12px;font-weight:900;white-space:nowrap}
    .xp-star{display:grid;place-items:center;width:19px;height:19px;border-radius:7px;background:var(--lesson-lime);color:#10162a;font-size:11px}

    .lesson-progress{position:sticky;top:0;z-index:5;padding:12px 0;background:linear-gradient(var(--lesson-bg) 72%,transparent)}
    .progress-meta{display:flex;justify-content:space-between;gap:15px;color:var(--lesson-muted);font-size:11px;font-weight:800}
    .progress-track{height:9px;margin-top:8px;border-radius:99px;background:#202a43;overflow:hidden;border:1px solid #2d3855}
    .progress-fill{height:100%;width:0;background:var(--lesson-lime);border-radius:99px;transition:width .35s cubic-bezier(.2,.8,.2,1)}

    .lesson-card{position:relative;max-width:900px;margin:16px auto 0;padding:clamp(24px,5vw,48px);border-radius:30px;background:var(--lesson-surface);border:1px solid #2b3653;box-shadow:0 24px 70px rgba(0,0,0,.24);overflow:hidden}
    .lesson-card:before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-100px;top:-100px;background:rgba(182,243,106,.10);pointer-events:none}
    .stage-chip{display:inline-flex;padding:7px 10px;border-radius:10px;background:#222d49;color:var(--lesson-lime);font-size:10px;font-weight:900;letter-spacing:.11em;text-transform:uppercase}

    .scene-card{min-height:410px;display:flex;flex-direction:column;justify-content:center}
    .scene-icon{width:68px;height:68px;display:grid;place-items:center;border-radius:22px;background:var(--lesson-lime);color:#12182a;font-size:30px;font-weight:900;box-shadow:8px 8px 0 rgba(182,243,106,.18);margin-bottom:25px}
    .scene-card h2{font-size:clamp(34px,6vw,66px);line-height:.94;letter-spacing:-.06em;color:#fff;max-width:700px;margin:17px 0}
    .scene-card p{max-width:650px;color:var(--lesson-muted);font-size:17px;line-height:1.65}
    .mission{display:inline-flex;align-items:center;gap:9px;margin-top:25px;padding:12px 15px;border-radius:14px;background:#17213a;border:1px solid #2c3958;color:#fff;font-size:13px;font-weight:750;width:max-content;max-width:100%}
    .mission b{color:var(--lesson-lime)}

    .teach-card{min-height:470px}
    .target{font-size:clamp(36px,6vw,64px);line-height:1;letter-spacing:-.055em;color:#fff;margin:24px 0 10px;max-width:820px}
    .translation{font-size:20px;color:#dbe5f6;line-height:1.5}
    .explain-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:28px}
    .explain{padding:18px;border-radius:17px;background:#202b46!important;border:1px solid #3b4a6d!important;color:var(--lesson-white)!important}
    .explain-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#b6f36a!important;font-weight:900;margin-bottom:8px}
    .explain p{color:#f4f1ea!important;font-size:13px;line-height:1.55}
    .explain strong{color:#fff!important}
    .clarification{margin-top:18px;padding:18px 20px;border-radius:18px;background:#172b24!important;border:1px solid var(--lesson-lime)!important;box-shadow:0 0 0 1px rgba(182,243,106,.08),0 12px 30px rgba(0,0,0,.18)}
    .clarification .explain-label{color:#b6f36a!important;margin-bottom:7px}
    .clarification p{color:var(--lesson-white)!important;font-size:14px;line-height:1.65}
    .clarification strong{color:#ffffff!important;font-weight:900;text-decoration:underline;text-decoration-color:rgba(182,243,106,.7);text-underline-offset:3px}
    .example{margin-top:10px;padding:16px;border-radius:17px;background:#121a2d;border:1px solid #2c3958}
    .example strong{display:block;color:#fff;font-size:16px}
    .example span{display:block;margin-top:4px;color:var(--lesson-muted);font-size:12px}
    .audio-btn{margin-top:18px;border:1px solid #34415f!important;background:#202b46!important;color:#fff!important;border-radius:14px!important;padding:11px 14px!important;font-weight:850!important}

    .builder{margin-top:25px}
    .build-prompt{font-size:13px;color:var(--lesson-muted);margin-bottom:10px}
    .build-target{font-size:24px;line-height:1.35;color:#fff;font-weight:800;margin-bottom:16px}
    .built{min-height:72px;display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:12px;border-radius:18px;background:#0e1527;border:2px dashed #35415e;margin-bottom:15px}
    .built.empty{color:#65728d;font-size:13px}
    .word-bank{display:flex;flex-wrap:wrap;gap:9px}
    .arabic-build{direction:rtl;unicode-bidi:plaintext;text-align:right}
    .arabic-build .word,.arabic-build .built-word{direction:rtl;unicode-bidi:plaintext;text-align:center;font-size:17px!important;line-height:1.5}
    .word{border:1px solid #3a4867!important;background:#263554!important;color:#f4f1ea!important;border-radius:13px!important;padding:12px 14px!important;font-size:14px!important;font-weight:800!important;transition:.14s!important}
    .word:hover{transform:translateY(-2px);border-color:var(--lesson-lime)!important;background:#263554!important}
    .word.used{opacity:1!important;transform:none!important;border:2px solid #b6f36a!important;background:#263554!important;color:#f4f1ea!important;box-shadow:0 0 0 3px rgba(182,243,106,.2),0 5px 16px rgba(182,243,106,.12)!important;position:relative}
    .word.used::after{content:" ✓";color:#b6f36a!important;font-weight:950}
    .built-word{border:1px solid #b6f36a!important;background:#263554!important;color:#f4f1ea!important;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:850;cursor:pointer;box-shadow:0 3px 10px rgba(182,243,106,.12)}
    .built-word:hover{background:#314267!important;border-color:#b6f36a!important;transform:translateY(-1px)}
    .built-word:focus-visible,.word:focus-visible{outline:3px solid #fff!important;outline-offset:3px}
    .build-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}
    .primary-lesson,.secondary-lesson{border-radius:14px!important;padding:13px 18px!important;font-weight:900!important;border:0!important}
    .primary-lesson{background:var(--lesson-lime)!important;color:#111729!important}
    .primary-lesson:hover{transform:translateY(-2px)}
    .secondary-lesson{background:#222d49!important;color:#fff!important;border:1px solid #35415f!important}
    .feedback{min-height:25px;margin-top:13px;font-size:13px;font-weight:750;color:var(--lesson-muted)}
    .feedback.good{color:var(--lesson-lime)}
    .feedback.bad{color:var(--lesson-coral)}

    .question{font-size:clamp(24px,4vw,38px);line-height:1.12;letter-spacing:-.04em;color:#fff;margin:22px 0}
    .options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .option{display:flex;align-items:center;gap:12px;text-align:left;min-height:65px;padding:14px;border-radius:16px!important;border:1px solid #35415f!important;background:#1d2741!important;color:#fff!important;font-size:14px;font-weight:750!important}
    .option:hover{border-color:var(--lesson-lime)!important;transform:translateY(-1px)}
    .option.correct{background:#173629!important;border-color:var(--lesson-lime)!important}
    .option.wrong{background:#3a2028!important;border-color:var(--lesson-coral)!important}
    .letter{display:grid;place-items:center;width:30px;height:30px;flex:none;border-radius:10px;background:#2a3653;color:#dce7f8;font-size:11px;font-weight:900}
    .streak-note{margin-top:17px;color:var(--lesson-lime);font-size:12px;font-weight:850}

    .final-card{text-align:center}
    .finish-badge{width:82px;height:82px;display:grid;place-items:center;margin:0 auto 18px;border-radius:28px;background:var(--lesson-lime);font-size:38px;box-shadow:8px 8px 0 rgba(182,243,106,.22)}
    .final-card h2{font-size:clamp(38px,6vw,64px);line-height:.95;letter-spacing:-.06em;color:#fff}
    .final-card p{max-width:560px;margin:14px auto;color:var(--lesson-muted);line-height:1.65}
    .xp-total{font-size:54px;line-height:1;color:var(--lesson-lime);font-weight:950;letter-spacing:-.05em;margin-top:16px}
    .xp-label{color:var(--lesson-muted);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.12em;margin-top:5px}
    .learned{display:grid;grid-template-columns:1fr 1fr;gap:9px;text-align:left;margin:28px 0}
    .learned-item{padding:13px 15px;border-radius:15px;background:#1b2540;border:1px solid #303c5b}
    .learned-item strong{display:block;color:#fff;font-size:14px}
    .learned-item span{display:block;color:var(--lesson-muted);font-size:12px;margin-top:3px}

    .confetti{position:fixed;width:9px;height:14px;z-index:50;pointer-events:none;animation:fall 1.25s ease-out forwards}
    @keyframes fall{0%{transform:translate3d(0,0,0) rotate(0);opacity:1}100%{transform:translate3d(var(--dx),var(--dy),0) rotate(720deg);opacity:0}}
    @keyframes pop{0%{transform:scale(.95)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
    .pop{animation:pop .35s ease}
    .loading-dark{padding:70px 0;color:var(--lesson-muted)}

    @media(max-width:680px){
      body.lesson-page .shell{width:min(100% - 22px,1080px)}
      .lesson-top{align-items:flex-start}
      .lesson-top h1{font-size:36px}
      .xp-pill{padding:8px 10px}
      .lesson-card{border-radius:23px;padding:24px 19px}
      .scene-card{min-height:430px}
      .explain-grid,.options,.learned{grid-template-columns:1fr}
      .target{font-size:42px}
      .question{font-size:27px}
    }
  </style>
</head>
<body class="lesson-page">
<div class="shell">
  <nav><a class="logo" href="dashboard.html">Nahtive<i></i></a><a class="exit" href="dashboard.html">Leave lesson</a></nav>
  <div id="loading" class="loading-dark">Building your lesson…</div>
  <div id="lesson" class="lesson-wrap" style="display:none">
    <div class="lesson-top">
      <div>
        <div class="lesson-eyebrow" id="language">LANGUAGE · A1</div>
        <h1 id="title">Lesson</h1>
        <p class="lesson-intro" id="intro">Learn it. Build it. Use it.</p>
      </div>
      <div class="xp-pill"><span class="xp-star">★</span><span id="xpLive">0 XP</span></div>
    </div>
    <div class="lesson-progress">
      <div class="progress-meta"><span id="stage">Situation</span><strong id="count">1 / 1</strong></div>
      <div class="progress-track"><div class="progress-fill" id="fill"></div></div>
    </div>
    <main id="card"></main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
let client=null,user=null,profile=null,baseLesson=null,lesson=null,index=0,finished=false,xp=0,answers=[],audioCtx=null;
const lessonLoadWatchdog=setTimeout(()=>{
  const loading=$("loading");
  if(loading&&loading.style.display!=="none"){
    loading.innerHTML="<strong>This lesson is taking too long to load.</strong><br><span style='color:#aab6ce;font-size:13px'>Your lesson request did not finish. Try again; if it keeps happening, the timeout message will help identify where it is stuck.</span><br><button class='primary-lesson' style='margin-top:18px' onclick='location.reload()'>Try again</button>";
  }
},50000);

function sound(kind){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const now=audioCtx.currentTime;
    const tones=kind==="good"?[[523,.08],[659,.09],[784,.13]]:kind==="bad"?[[170,.12],[130,.16]]:kind==="complete"?[[523,.09],[659,.09],[784,.09],[1047,.22]]:[[330,.055]];
    tones.forEach(([freq,dur],i)=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type=kind==="bad"?"sawtooth":"sine";o.frequency.value=freq;
      g.gain.setValueAtTime(.0001,now+i*.075);
      g.gain.exponentialRampToValueAtTime(.07,now+i*.075+.015);
      g.gain.exponentialRampToValueAtTime(.0001,now+i*.075+dur);
      o.connect(g);g.connect(audioCtx.destination);o.start(now+i*.075);o.stop(now+i*.075+dur+.02);
    });
  }catch(e){}
}
function speak(text){
  if(!text||!("speechSynthesis" in window))return;
  try{
    speechSynthesis.cancel();
    const map={es:"es-MX",fr:"fr-FR",nl:"nl-NL",de:"de-DE",pt:"pt-BR",pl:"pl-PL",it:"it-IT",ar:"ar-SA",ja:"ja-JP",ko:"ko-KR",zh:"zh-CN",en:"en-US",sv:"sv-SE",el:"el-GR",tr:"tr-TR",hi:"hi-IN"};
    const u=new SpeechSynthesisUtterance(text);u.lang=map[profile?.code]||profile?.code||"en-US";u.rate=.94;speechSynthesis.speak(u);
  }catch(e){}
}
function normalizePhrase(raw){
  if(raw&&typeof raw==="object")return {
    target:String(raw.target||"").trim(),meaning:String(raw.meaning||"").trim(),usage:String(raw.usage||"").trim(),
    breakdown:Array.isArray(raw.breakdown)?raw.breakdown:[],example:String(raw.example||"").trim(),
    example_meaning:String(raw.example_meaning||"").trim(),pronunciation:String(raw.pronunciation||"").trim(),
    build_target:String(raw.build_target||raw.target||"").trim(),build_meaning:String(raw.build_meaning||raw.meaning||"").trim(),
    build_words:Array.isArray(raw.build_words)?raw.build_words.map(String).filter(Boolean):[],
    distractors:Array.isArray(raw.distractors)?raw.distractors.map(String).filter(Boolean):[]
  };
  if(Array.isArray(raw))return {target:String(raw[0]||""),meaning:String(raw[1]||""),usage:String(raw[2]||""),breakdown:[],example:String(raw[3]||""),example_meaning:"",pronunciation:String(raw[4]||""),build_target:String(raw[0]||""),build_meaning:String(raw[1]||""),build_words:String(raw[0]||"").split(/\s+/).filter(Boolean),distractors:[]};
  return {target:String(raw||""),meaning:"",usage:"",breakdown:[],example:"",example_meaning:"",pronunciation:"",build_target:String(raw||""),build_meaning:"",build_words:String(raw||"").split(/\s+/).filter(Boolean),distractors:[]};
}
function normalizeLesson(row){
  const d=row?.content&&typeof row.content==="object"?row.content:{};
  return {language_code:String(d.language_code||"").toLowerCase(),language_name:String(d.language_name||""),level:String(d.level||row?.level||"").toUpperCase(),title:String(row?.title||d.title||"Lesson"),topic:String(row?.topic||d.topic||"Real life"),
    scene:d.scene&&typeof d.scene==="object"?d.scene:{},phrases:(Array.isArray(d.phrases)?d.phrases:[]).map(normalizePhrase).filter(p=>p.target),
    dialogue:Array.isArray(d.dialogue)?d.dialogue:[],
    finalChallenge:d.final_challenge&&typeof d.final_challenge==="object"?{
      situation:String(d.final_challenge.situation||"").trim(),
      prompt:String(d.final_challenge.prompt||"").trim(),
      choices:Array.isArray(d.final_challenge.choices)?d.final_challenge.choices.map(String).filter(Boolean):[],
      correct_answer:String(d.final_challenge.correct_answer||"").trim()
    }:null};
}
function fallbackNormalize(p){
  const target=String(p.build_target||p.target||"").normalize("NFKC").replace(/\s+/g," ").trim();
  const chunks=Array.isArray(p.build_words)?p.build_words.map(String).filter(Boolean):[];
  const joined=chunks.join(" ").normalize("NFKC").replace(/\s+/g," ").trim();
  // Never render an impossible build exercise. If stored chunks do not
  // reconstruct the target sentence, rebuild them from the target itself.
  if(!chunks.length||joined!==target)p.build_words=target.split(/\s+/).filter(Boolean);
  return p;
}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function normalizeBuildAnswer(value){
  return String(value||"")
    .normalize("NFKC")
    .replace(/[\u0640\u064B-\u065F\u0670\u06D6-\u06ED]/g,"")
    .replace(/[،؛؟.!,:;()[\]{}«»“”"']/g,"")
    .replace(/\s+/g," ")
    .trim();
}
function makeBank(p,all){
  const correct=p.build_words.length?p.build_words:p.build_target.split(/\s+/).filter(Boolean);
  // Keep distractors local to this sentence. Pulling words from other phrases
  // makes the answer too easy because the learner can eliminate unrelated vocabulary.
  const unique=[];
  [...(p.distractors||[])].forEach(w=>{
    const value=String(w||"").trim();
    if(value&&!correct.includes(value)&&!unique.includes(value))unique.push(value);
  });
  const count=4;
  return shuffle([...correct,...unique.slice(0,count)]);
}
function buildCards(row){
  const c=normalizeLesson(row);c.phrases.forEach(fallbackNormalize);
  const p=c.phrases.slice(0,5);
  if(p.length<2)throw new Error("This lesson needs at least two taught phrases.");
  const cards=[{type:"scene",stage:"Mission",scene:c.scene,topic:c.topic}];
  p.forEach((phrase,i)=>{
    cards.push({type:"teach",stage:i===0?"Learn":"Add on",phrase});
    cards.push({type:"build",stage:"Build it",phrase,bank:makeBank(phrase,p)});
    cards.push({type:"recall",stage:"Recall",phrase,choices:makeChoices(phrase,p)});
  });
  const dialogue=c.dialogue.filter(x=>x?.text).slice(0,4);
  // Older saved lessons may predate the dedicated final_challenge field.
  // Do not reject otherwise valid lessons. Build a deterministic challenge from
  // the lesson's own taught phrases so existing lessons remain playable.
  if(!c.finalChallenge||c.finalChallenge.choices.length!==4||!c.finalChallenge.correct_answer||!c.finalChallenge.choices.includes(c.finalChallenge.correct_answer)){
    const last=p[p.length-1];
    const choices=shuffle([last.target,...p.slice(0,-1).map(x=>x.target)]).slice(0,4);
    c.finalChallenge={
      situation:String(c.scene?.situation||c.scene?.mission||"Use the language you just learned in this situation."),
      prompt:String(c.scene?.mission||"Respond naturally using the language you just learned."),
      choices,
      correct_answer:last.target
    };
  }
  cards.push({type:"challenge",stage:"Final challenge",phrase:p[p.length-1],dialogue,finalChallenge:c.finalChallenge});
  return {...c,phrases:p,cards};
}
function makeChoices(p,all){
  // The correct answer must always be present. Use only target-language phrases
  // from this lesson so recall never falls back to English filler answers.
  const correct=String(p.target||"");
  const alternatives=shuffle(all.filter(x=>x!==p).map(x=>String(x.target||"")).filter(Boolean)).slice(0,3);
  return shuffle([correct,...alternatives]);
}
function addXP(n){
  xp+=n;$("xpLive").textContent=xp+" XP";
}
function updateProgress(){
  const total=lesson.cards.length;const shown=Math.min(index,total);
  $("stage").textContent=lesson.cards[index]?.stage||"Complete";
  $("count").textContent=index<total?(index+1)+" / "+total:"";
  $("fill").style.width=Math.round((shown/total)*100)+"%";
}
function shell(body,actions=""){
  $("card").innerHTML='<section class="lesson-card pop">'+body+(actions?'<div class="build-actions">'+actions+"</div>":"")+"</section>";
}
function next(){index++;updateProgress();render()}
function render(){
  if(index>=lesson.cards.length){finish();return}
  updateProgress();
  const c=lesson.cards[index];
  if(c.type==="scene")renderScene(c);
  else if(c.type==="teach")renderTeach(c);
  else if(c.type==="build")renderBuild(c);
  else if(c.type==="recall")renderRecall(c);
  else renderChallenge(c);
}
function renderScene(c){
  const s=c.scene||{};
  shell('<div class="scene-card"><div class="scene-icon">✦</div><span class="stage-chip">Your mission</span><h2>'+esc(c.topic||s.place||"Everyday life")+'</h2><p>'+esc(s.situation||"You’re about to handle a real everyday situation.")+'</p><div class="mission"><b>GOAL</b> '+esc(s.mission||"Use the language naturally.")+'</div></div>','<button class="primary-lesson" id="go">Let’s go →</button>');
  $("go").onclick=()=>{sound("click");addXP(5);next()};
}
function renderTeach(c){
  const p=c.phrase;
  const phraseMarkup='<div class="target">'+esc(p.target)+'</div><div class="translation">'+esc(p.meaning)+'</div>';
  shell('<span class="stage-chip">'+esc(c.stage)+'</span>'+phraseMarkup+
    '<div class="explain-grid"><div class="explain"><div class="explain-label">When to use it</div><p>'+esc(p.usage||"Use it when this situation calls for it.")+'</p></div><div class="explain"><div class="explain-label">Say it naturally</div><p>'+esc(p.pronunciation||"Listen first, then say the phrase out loud on your own.")+'</p></div></div>'+
    (p.breakdown?.length?'<div class="clarification"><div class="explain-label">Clarification</div>'+p.breakdown.map(x=>'<p style="margin-top:5px"><strong>'+esc(x.target)+'</strong> — '+esc(x.meaning)+'</p>').join("")+'</div>':"")+
    (p.example?'<div class="example"><strong>'+esc(p.example)+'</strong><span>'+esc(p.example_meaning||"")+'</span></div>':"")+
    '<button class="audio-btn" id="listen">▶ Listen</button>',
    '<button class="primary-lesson" id="go">I’ve got it →</button>');
  $("listen").onclick=()=>{sound("click");speak(p.target)};
  $("go").onclick=()=>{sound("click");addXP(5);next()};
  setTimeout(()=>speak(p.target),180);
}
function renderBuild(c){
  const p=c.phrase;let selected=[];let checked=false;
  const target=p.build_target||p.target;const bank=shuffle(c.bank);
  const isArabic=/^(ar|arabic)(-|$)/i.test(String(profile?.code||lesson?.language_code||""));
  shell('<span class="stage-chip">Build it</span><div class="build-prompt">Put the words in the right order.</div><div class="build-target">'+esc(p.build_meaning||p.meaning)+'</div>'+
    '<div class="built empty'+(isArabic?' arabic-build':'')+'" id="built"'+(isArabic?' dir="rtl"':'')+'>Tap words below to build the sentence.</div><div class="word-bank'+(isArabic?' arabic-build':'')+'" id="bank"'+(isArabic?' dir="rtl"':'')+'>'+bank.map((w,i)=>'<button class="word" data-i="'+i+'" data-word="'+esc(w)+'"'+(isArabic?' dir="rtl"':'')+'>'+esc(w)+'</button>').join("")+'</div>'+
    '<div class="feedback" id="feedback"></div>',
    '<button class="secondary-lesson" id="clear">Clear</button><button class="secondary-lesson" id="hint">Hint</button><button class="primary-lesson" id="check">Check ✓</button>');
  const renderBuilt=()=>{$("built").classList.toggle("empty",!selected.length);$("built").innerHTML=selected.length?selected.map((w,i)=>'<button class="built-word" data-i="'+i+'" title="Remove '+esc(w.word)+'">'+esc(w.word)+'</button>').join(""):"Tap words below to build the sentence.";document.querySelectorAll(".word").forEach(b=>b.classList.toggle("used",selected.some(x=>x.k===key(b.dataset.word,b.dataset.i))))};
  const key=(w,i)=>w+"::"+i;
  document.querySelectorAll(".word").forEach(btn=>btn.onclick=()=>{if(checked)return;const k=key(btn.dataset.word,btn.dataset.i);if(selected.some(x=>x.k===k))return;selected.push({word:btn.dataset.word,k});sound("click");renderBuilt()});
  $("built").onclick=e=>{const b=e.target.closest(".built-word");if(!b||checked)return;selected.splice(Number(b.dataset.i),1);renderBuilt();sound("click")};
  $("clear").onclick=()=>{if(!checked){selected=[];renderBuilt();sound("click")}};
  $("hint").onclick=()=>{
    if(checked)return;
    const nextWord=(p.build_words.length?p.build_words:target.split(/\s+/))[selected.length];
    if(nextWord){$("feedback").textContent="Hint: look for “"+nextWord+"”";$("feedback").className="feedback";sound("click")}
  };
  $("check").onclick=()=>{
    if(checked)return;
    const answer=selected.map(x=>x.word).join(" ").trim();
    const expected=p.build_words.length?p.build_words.join(" ").trim():target.trim();
    // Arabic text can differ in diacritics, tatweel, or punctuation even when
    // the learner selected the correct words. Compare normalized text, not raw bytes.
    const correct=normalizeBuildAnswer(answer)===normalizeBuildAnswer(expected);
    if(correct){
      checked=true;sound("good");addXP(15);$("feedback").textContent="Perfect build. You actually constructed it.";$("feedback").className="feedback good";$("check").textContent="Continue →";$("check").onclick=next;
      $("built").classList.add("pop");
    }else{
      sound("bad");$("feedback").textContent=answer?"Not quite. Check the word order and try again.":"Build the sentence first.";$("feedback").className="feedback bad";
      answers.push({type:"build",target:expected,attempt:answer,correct:false});
    }
  };
}
function renderRecall(c){
  const p=c.phrase;let answered=false;
  shell('<span class="stage-chip">Recall</span><div class="question">'+esc("Which phrase means “"+p.meaning+"”?")+'</div><div class="options">'+c.choices.map((o,i)=>'<button class="option" data-value="'+esc(o)+'"><span class="letter">'+String.fromCharCode(65+i)+'</span>'+esc(o)+'</button>').join("")+'</div><div class="feedback" id="feedback"></div>',
    '<button class="primary-lesson" id="next" disabled>Continue →</button>');
  document.querySelectorAll(".option").forEach(btn=>btn.onclick=()=>{
    if(answered)return;answered=true;const ok=btn.dataset.value===p.target;btn.classList.add(ok?"correct":"wrong");document.querySelectorAll(".option").forEach(x=>x.disabled=true);
    $("feedback").textContent=ok?"Yes. You remembered it.":"The phrase you want is: "+p.target;$("feedback").className="feedback "+(ok?"good":"bad");
    answers.push({type:"recall",target:p.target,choice:btn.dataset.value,correct:ok});
    if(ok){sound("good");addXP(10)}else sound("bad");
    $("next").disabled=false;
  });
  $("next").onclick=next;
}
function renderChallenge(c){
  const fc=c.finalChallenge;let answered=false;
  let challengeChoices=fc.choices;
  const choices=shuffle(challengeChoices);
  const learnedPhrases=(c.phrases||[]).slice(0,5).map(p=>'<div style="padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-top:8px"><strong>'+esc(p.target)+'</strong><div style="color:var(--muted);font-size:13px;margin-top:4px">'+esc(p.meaning)+'</div></div>').join("");
  shell('<span class="stage-chip">Final challenge</span><div class="question">'+esc(fc.prompt)+'</div><div class="explain" style="margin-bottom:15px"><div class="explain-label">Situation</div><p>'+esc(fc.situation)+'</p></div><div class="explain" style="margin-bottom:15px"><div class="explain-label">Use what you learned</div><p style="margin-bottom:6px;color:var(--muted);font-size:13px">Review these phrases before choosing your response.</p>'+learnedPhrases+'</div><div class="options">'+choices.map((o,i)=>'<button class="option" data-value="'+esc(o)+'"><span class="letter">'+String.fromCharCode(65+i)+'</span>'+esc(o)+'</button>').join("")+'</div><div class="feedback" id="feedback"></div>',
    '<button class="primary-lesson" id="next" disabled>Finish lesson →</button>');
  document.querySelectorAll(".option").forEach(btn=>btn.onclick=()=>{
    if(answered)return;answered=true;const ok=normalizeBuildAnswer(btn.dataset.value)===normalizeBuildAnswer(fc.correct_answer);btn.classList.add(ok?"correct":"wrong");document.querySelectorAll(".option").forEach(x=>x.disabled=true);
    $("feedback").textContent=ok?"That fits the situation.":"Not quite. Read the situation and prompt again, then compare what each response actually means.";
    $("feedback").className="feedback "+(ok?"good":"bad");
    answers.push({type:"challenge",target:fc.correct_answer,choice:btn.dataset.value,correct:ok});
    if(ok){sound("good");addXP(25)}else sound("bad");
    $("next").disabled=false;
  });
  $("next").onclick=next;
}
function confetti(){
  const pieces=["#4da3ff","#ffd84d","#9df06b","#ff6b6b","#9b7cff"];
  for(let i=0;i<55;i++){const el=document.createElement("i");el.className="confetti";el.style.left=(35+Math.random()*30)+"vw";el.style.top="42vh";el.style.background=pieces[i%pieces.length];el.style.setProperty("--dx",(Math.random()*600-300)+"px");el.style.setProperty("--dy",(Math.random()*500+150)+"px");document.body.appendChild(el);setTimeout(()=>el.remove(),1400)}
}
async function finish(){
  if(finished)return;finished=true;sound("complete");addXP(40);confetti();
  const correct=answers.filter(x=>x.correct).length,total=answers.filter(x=>x.type==="recall"||x.type==="challenge").length+lesson.phrases.length;
  const score=total?Math.round((correct+lesson.phrases.length)/Math.max(total,1)*100):100;
  try{
    if(baseLesson?.id){
      await client.from("lesson_attempts").insert({lesson_id:baseLesson.id,score,responses:{answers,xp,completed:true}});
      const reviewRows=lesson.phrases.slice(0,5).map(p=>({learner_language_id:profile.id,item_type:"expression",source_text:p.meaning,target_text:p.target,explanation:p.usage||p.meaning,mastery:Math.min(100,15+xp/5),next_review_at:new Date(Date.now()+86400000).toISOString()}));
      for(const row of reviewRows){
        const existing=await client.from("review_items").select("id,mastery").eq("learner_language_id",profile.id).eq("target_text",row.target_text).eq("item_type","expression").limit(1).maybeSingle();
        if(existing.data?.id)await client.from("review_items").update({mastery:Math.min(100,Number(existing.data.mastery||0)+12),updated_at:new Date().toISOString(),next_review_at:row.next_review_at}).eq("id",existing.data.id);
        else await client.from("review_items").insert(row);
      }
      await client.from("learner_events").insert({user_id:user.id,learner_language_id:profile.id,event_type:"lesson_completed",event_data:{lesson_id:baseLesson.id,xp,score,level:profile.level}});
    }
  }catch(e){console.warn("completion save",e)}
  sessionStorage.setItem("nahtive_lesson_completed","true");sessionStorage.setItem("nahtive_last_lesson_title",lesson.title);
  $("stage").textContent="Complete";$("count").textContent="";$("fill").style.width="100%";
  $("card").innerHTML='<section class="lesson-card final-card pop"><div class="finish-badge">★</div><div class="stage-chip">Lesson complete</div><h2>You built it.</h2><p>You learned the language, reconstructed it, recalled it, and used it in a challenge.</p><div class="xp-total">+'+xp+'</div><div class="xp-label">XP earned</div><div class="learned">'+lesson.phrases.map(p=>'<div class="learned-item"><strong>'+esc(p.target)+'</strong><span>'+esc(p.meaning)+'</span></div>').join("")+'</div><a class="primary-lesson" href="dashboard.html" style="display:inline-flex;text-decoration:none">Keep going →</a></section>';
}
async function load(){
  try{
    if(!window.supabase)throw new Error("Supabase client did not load.");
    if(!window.SUPABASE_URL||!window.SUPABASE_ANON_KEY)throw new Error("Nahtive database configuration is missing.");
    client=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
    const sessionResult=await Promise.race([client.auth.getSession(),new Promise((_,reject)=>setTimeout(()=>reject(new Error("Session check timed out.")),7000))]);
    if(sessionResult.error||!sessionResult.data?.session?.user){location.href="login.html";return}
    user=sessionResult.data.session.user;
    const saved=localStorage.getItem("Nahtive_current_learner_language");
    const langResult=await Promise.race([client.from("learner_languages").select("id,level,is_current,languages(name,code)").eq("user_id",user.id),new Promise((_,reject)=>setTimeout(()=>reject(new Error("Language data timed out.")),7000))]);
    if(langResult.error)throw langResult.error;
    const langs=langResult.data||[];if(!langs.length){location.href="onboarding.html";return}
    const current=langs.find(x=>x.id===saved)||langs.find(x=>x.is_current)||langs[0];current.level=["A1","A2","B1","B2","C1","C2"].includes(String(current.level||"").toUpperCase())?String(current.level).toUpperCase():"A1";localStorage.setItem("Nahtive_current_learner_language",current.id);
    const requested=new URLSearchParams(location.search).get("id");
    if(requested){
      const r=await client.from("lessons").select("id,title,topic,level,content,learner_language_id,curriculum_node_id,created_at,learner_languages(id,user_id,level,languages(name,code)),curriculum_nodes(sequence_number,stage_name,title,situation,focus)").eq("id",requested).maybeSingle();
      if(r.error)throw r.error;if(!r.data||r.data.learner_languages?.user_id!==user.id)throw new Error("This lesson is not available.");baseLesson=r.data;
      const challenge=baseLesson.content?.final_challenge;
      if(String(baseLesson.level||"A1").toUpperCase()!==current.level||!baseLesson.curriculum_node_id||!Array.isArray(baseLesson.content?.phrases)||baseLesson.content.phrases.length<5||!challenge||!Array.isArray(challenge.choices)||challenge.choices.length!==4||!challenge.choices.includes(challenge.correct_answer)){location.replace("lesson.html");return;}
    }else{
      const r=await client.from("lessons").select("id,title,topic,level,content,learner_language_id,curriculum_node_id,created_at").eq("learner_language_id",current.id).order("created_at",{ascending:false}).limit(80);
      if(r.error)throw r.error;
      const lessons=(r.data||[]).map(x=>({...x,learner_languages:{id:current.id,user_id:user.id,level:current.level,languages:current.languages}}));
      const wantedCode=String(current.languages?.code||"").toLowerCase();
      const requiredPhraseCount=5;const valid=lessons.filter(x=>String(x.level||"A1").toUpperCase()===current.level&&(()=>{const ps=Array.isArray(x?.content?.phrases)?x.content.phrases:[];const storedCode=String(x?.content?.language_code||"").toLowerCase();const fc=x?.content?.final_challenge;return !!x.curriculum_node_id&&storedCode===wantedCode&&ps.length>=requiredPhraseCount&&ps.slice(0,requiredPhraseCount).every(p=>p&&p.target&&p.meaning&&p.build_target&&Array.isArray(p.build_words)&&p.build_words.length&&Array.isArray(p.distractors)&&p.distractors.length>=3)&&!!fc&&typeof fc.situation==="string"&&fc.situation.trim()&&typeof fc.prompt==="string"&&fc.prompt.trim()&&Array.isArray(fc.choices)&&fc.choices.length===4&&typeof fc.correct_answer==="string"&&fc.choices.includes(fc.correct_answer)})());
      const attempts=valid.length?await client.from("lesson_attempts").select("lesson_id").in("lesson_id",valid.map(x=>x.id)):{data:[],error:null};
      if(attempts.error)throw attempts.error;
      const completed=new Set((attempts.data||[]).map(x=>x.lesson_id));
      const unfinished=valid.find(x=>!completed.has(x.id));
      if(unfinished)baseLesson=unfinished;
      else{
        const bands=["A1","A2","B1","B2","C1","C2","C1/C2"];const maxSeq=valid.reduce((m,x)=>Math.max(m,Number(x.curriculum_nodes?.sequence_number||0)),0);
        let nodeQuery=client.from("curriculum_nodes").select("id,sequence_number,stage_number,stage_name,title,situation,focus,level_band").in("level_band",bands).order("sequence_number",{ascending:true}).limit(1);
        if(maxSeq>0)nodeQuery=nodeQuery.gt("sequence_number",maxSeq);
        let nodeResult=await nodeQuery;
        if(nodeResult.error)throw nodeResult.error;
        if(!nodeResult.data?.length&&maxSeq>0)nodeResult=await client.from("curriculum_nodes").select("id,sequence_number,stage_number,stage_name,title,situation,focus,level_band").in("level_band",bands).order("sequence_number",{ascending:true}).limit(1);
        let node=nodeResult.data?.[0];
        if(!node)node={id:null,sequence_number:maxSeq+1,stage_number:maxSeq+1,stage_name:"Real-world practice",title:"Your next conversation",situation:"Handle a useful everyday interaction.",focus:"Practical conversation"};
        const nativeCodes = {en:"English",es:"Spanish",pt:"Portuguese",fr:"French",de:"German",it:"Italian",ja:"Japanese",ko:"Korean",zh:"Mandarin",ar:"Arabic",nl:"Dutch",sv:"Swedish",el:"Greek",tr:"Turkish",hi:"Hindi",pl:"Polish"};
        let nativeLanguage = "English";
        const nativeProfile = await client.from("profiles").select("Nahtive_language_code").eq("id",user.id).maybeSingle();
        if (!nativeProfile.error && nativeProfile.data?.Nahtive_language_code) nativeLanguage = nativeCodes[String(nativeProfile.data.Nahtive_language_code).toLowerCase()] || "English";
        const generationController=new AbortController();
        const generationTimer=setTimeout(()=>generationController.abort(),35000);
        let gen;
        try {
          gen=await fetch("/api/generate-lesson",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({language:current.languages?.name||"English",code:current.languages?.code||"en",level:current.level,nativeLanguage,node}),signal:generationController.signal});
        } catch (generationError) {
          if(generationError?.name==="AbortError") throw new Error("Lesson generation timed out after 35 seconds. Please try again.");
          throw generationError;
        } finally {
          clearTimeout(generationTimer);
        }
        const generated=await gen.json().catch(()=>({}));
        if(!gen.ok||!generated.content)throw new Error(generated.error||"Could not build your lesson.");
        const savedLesson=await Promise.race([
          client.from("lessons").insert({learner_language_id:current.id,curriculum_node_id:node.id,title:generated.title||node.title,topic:generated.topic||node.focus,level:current.level,content:{...generated.content,level:current.level}}).select("id,title,topic,level,content,learner_language_id,curriculum_node_id,created_at,learner_languages(id,user_id,level,languages(name,code)),curriculum_nodes(sequence_number,stage_name,title,situation,focus)").single(),
          new Promise((_,reject)=>setTimeout(()=>reject(new Error("Saving your lesson timed out. Please try again.")),12000))
        ]);
        if(savedLesson.error)throw savedLesson.error;baseLesson=savedLesson.data;
      }
    }
    const linked=baseLesson.learner_languages;
    const lessonCode=String(baseLesson.content?.language_code||"").toLowerCase();
    const currentCode=String(linked?.languages?.code||"").toLowerCase();
    if(!lessonCode||lessonCode!==currentCode)throw new Error("This lesson belongs to a different language. Please start the next lesson.");
    if(!linked?.id)throw new Error("This language is not linked to your account.");
    profile={id:linked.id,name:linked.languages?.name||"Language",code:linked.languages?.code||"en-US",level:String(linked.level||baseLesson.level||current.level||"A1").toUpperCase()};
    lesson=buildCards(baseLesson);
    $("language").textContent=profile.name+" · "+profile.level;
    $("title").textContent=lesson.title;
    $("intro").textContent=(lesson.scene?.stage_name||baseLesson.curriculum_nodes?.stage_name||"Real-world practice")+" · Learn, build, recall.";
    clearTimeout(lessonLoadWatchdog);    $("loading").style.display="none";$("lesson").style.display="block";render();
  }catch(e){
    console.error("Nahtive lesson load failed",e);
    $("loading").innerHTML="<strong>We couldn’t load this lesson.</strong><br><span style='color:#aab6ce;font-size:13px'>"+esc(e?.message||"Please try again.")+"</span><br><button class='primary-lesson' style='margin-top:18px' onclick='location.reload()'>Try again</button>";
  }
}
load();
</script>
