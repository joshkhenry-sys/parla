<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nahtive — Lesson</title>
<link rel="stylesheet" href="nahtive.css">
<style>
*{font-family:var(--font),Arial,sans-serif!important}
.lesson{max-width:980px;margin:0 auto}
.lesson-header{padding:28px 0 20px}
.lesson-header h1{font-size:clamp(32px,5vw,48px);line-height:1.05;margin:8px 0}
.lesson-header p{font-size:17px;color:var(--muted);margin:0}
.lesson-progress{margin:4px 0 28px}
.progress-top{display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px;color:var(--muted)}
.progress-track{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.progress-track .fill{height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease}
.lesson-card{max-width:820px;margin:auto;padding:38px;border:1px solid var(--line);border-radius:24px;background:var(--surface)}
.kicker{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:18px}
.phrase{font-size:clamp(34px,6vw,56px);font-weight:700;line-height:1.08;letter-spacing:-.04em;margin:0 0 10px}
.meaning{font-size:20px;line-height:1.5;color:var(--muted);margin:0 0 22px}
.question{font-size:26px;line-height:1.35;font-weight:650;margin:0 0 20px}
.options{display:grid;gap:10px}
.option{width:100%;min-height:64px;text-align:left;padding:15px 18px;border:1px solid var(--line);border-radius:15px;background:var(--surface2);color:var(--text);font-size:17px;display:flex;align-items:center;gap:13px;cursor:pointer}
.option:hover{border-color:var(--accent)}
.option.correct{border-color:var(--accent);background:rgba(184,243,107,.09)}
.option.wrong{border-color:#d56b6b}
.letter{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:rgba(255,255,255,.06);font-size:12px;font-weight:800;flex:none}
.feedback{margin-top:14px;color:var(--muted);font-size:14px;line-height:1.5}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
.primary,.secondary{min-height:50px;padding:12px 20px}
.scene-text{font-size:22px;line-height:1.45;margin:0 0 10px}
.scene-goal{color:var(--muted);font-size:16px;line-height:1.55}
.speak-box{text-align:center;padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--surface2)}
.speak-target{font-size:30px;font-weight:700;margin:8px 0 6px}
.speak-meaning{color:var(--muted);font-size:16px}
.speak-button{margin-top:20px;min-width:150px;min-height:56px}
.status{min-height:24px;margin-top:14px;color:var(--muted);font-size:14px}
.live-goal{font-size:17px;line-height:1.5;margin-bottom:20px}
.chat{display:grid;gap:9px;margin-bottom:18px;max-height:360px;overflow:auto}
.bubble{padding:12px 14px;border-radius:14px;background:var(--surface2);line-height:1.5}
.bubble.you{background:rgba(184,243,107,.08)}
.bubble-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:3px}
.input{width:100%;min-height:52px;resize:none}
.scene-wrap{padding:4px 0}
.complete{text-align:center}
.complete h2{font-size:34px;margin:0 0 10px}
.xp{font-size:22px;font-weight:700;margin:18px 0}
@media(max-width:600px){
 .lesson-card{padding:26px 20px;border-radius:20px}
 .phrase{font-size:40px}
 .meaning{font-size:18px}
 .question{font-size:23px}
 .scene-text{font-size:20px}
}
</style>
<style id="nahtive-readable-light-lesson">
body:has(.lesson){background:#f6f3eb!important;color:#26312d!important}
body:has(.lesson) .lesson-card{background:#fffefa!important;color:#26312d!important;border:1px solid #d8d8cf!important;box-shadow:0 14px 34px rgba(38,49,45,.07)!important}
body:has(.lesson) .lesson-header h1,body:has(.lesson) .question,body:has(.lesson) .scene-text,body:has(.lesson) .phrase,body:has(.lesson) .speak-target,body:has(.lesson) .complete h2{color:#26312d!important}
body:has(.lesson) .lesson-header p,body:has(.lesson) .meaning,body:has(.lesson) .scene-goal,body:has(.lesson) .speak-meaning,body:has(.lesson) .status,body:has(.lesson) .feedback,body:has(.lesson) .progress-top{color:#5d6863!important}
body:has(.lesson) .kicker{color:#667b4f!important}
body:has(.lesson) .progress-track{background:#dfdfd7!important}
body:has(.lesson) .progress-track .fill{background:#879b68!important}
body:has(.lesson) .option{background:#fffefa!important;color:#26312d!important;border:1px solid #cfd1c9!important;box-shadow:none!important}
body:has(.lesson) .option:hover{background:#eef2e7!important;border-color:#879b68!important}
body:has(.lesson) .option.correct{background:#e7eddc!important;border-color:#879b68!important}
body:has(.lesson) .option.wrong{background:#f5dfd7!important;border-color:#d9957f!important}
body:has(.lesson) .letter{background:#edf0e9!important;color:#39443f!important}
body:has(.lesson) .speak-box{background:#f0eee6!important;border-color:#d8d8cf!important}
body:has(.lesson) .chat .bubble{background:#f0eee6!important;color:#26312d!important;border-color:#d8d8cf!important}
body:has(.lesson) .chat .bubble.you{background:#e7eddc!important;border-color:#c8d5b5!important}
body:has(.lesson) textarea.input{background:#fffefa!important;color:#26312d!important;border:1px solid #cfd1c9!important}
body:has(.lesson) textarea.input::placeholder{color:#7a827e!important}
body:has(.lesson) .primary{background:#26312d!important;color:#fffefa!important;box-shadow:none!important}
body:has(.lesson) .secondary{background:#fffefa!important;color:#26312d!important;border:1px solid #cfd1c9!important}
body:has(.lesson) .complete{background:#e7eddc!important}
</style></head>
<body>
<div class="shell">
<nav><a class="logo" href="dashboard.html">Nahtive<i></i></a><a class="exit" href="dashboard.html">Exit lesson</a></nav>
<div id="loading" class="loading">Loading lesson…</div>
<div id="lesson" class="lesson" style="display:none">
<header class="lesson-header">
<div class="eyebrow"><span id="language">Language</span> · LIVE LESSON</div>
<h1 id="title">Lesson</h1>
<p id="intro">Learn it. Use it. Then talk.</p>
</header>
<div class="lesson-progress">
<div class="progress-top"><span id="stage">Situation</span><strong id="count">1 / 8</strong></div>
<div class="progress-track"><div class="fill" id="fill"></div></div>
</div>
<main id="card"></main>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
"use strict";
const client=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
let user=null,profile=null,baseLesson=null,lesson=null,index=0,xp=0,answers=[],conversation=[],recognition=null;

function buildLessonFromContent(baseLesson){
 const data=baseLesson?.content&&typeof baseLesson.content==="object"?baseLesson.content:{};
 const scene=data.scene||{};
 const dialogue=Array.isArray(data.dialogue)?data.dialogue:[];
 const lang=data.language||{};
 const nativeLine=dialogue.find(x=>String(x.speaker||"").toLowerCase()==="native")?.text||"";
 const learnerLines=dialogue.filter(x=>String(x.speaker||"").toLowerCase()==="learner").map(x=>String(x.text||"")).filter(Boolean);
 const phrase=String(lang.phrase||nativeLine||learnerLines[0]||"").trim();
 const meaning=String(lang.meaning||lang.usage||"").trim();
 const second=learnerLines[0]&&learnerLines[0]!==phrase?learnerLines[0]:"";
 const secondNative=dialogue.filter(x=>String(x.speaker||"").toLowerCase()==="native").map(x=>String(x.text||"")).find(x=>x!==nativeLine)||"";\n const secondMeaning=secondNative?"Use this naturally in the situation.":"Use this naturally in the situation.";\n const pool=[...new Set(dialogue.map(x=>String(x.text||"").trim()).filter(Boolean))];
 const distractors=pool.filter(x=>x!==phrase&&x!==second).slice(0,3);
 while(distractors.length<3)distractors.push(["Thanks, that's all.","Maybe later.","I'm not sure."][distractors.length]);
 const setting=String(scene.place||baseLesson.topic||"Everyday situation");
 const moment=String(scene.situation||scene.time||"A real-world interaction.");
 const goal=String(scene.mission||"Handle the interaction naturally.");
 const cards=[
   {type:"scene",stage:"Situation",setting,moment,goal},
   {type:"teach",stage:"Learn",phrase,meaning:meaning||"A natural expression used in this situation."},
   {type:"check",stage:"Recognize",prompt:"Which phrase fits this moment?",answer:phrase,distractors},
   {type:"teach",stage:"Use",phrase:second||phrase,meaning:second?secondMeaning:"Now use the expression yourself in the same situation."},
   {type:"check",stage:"Adapt",prompt:"What would you say to keep the exchange moving?",answer:second||phrase,distractors:second?[phrase,...distractors.slice(0,2)]:distractors},
   {type:"speak",stage:"Speak",phrase:second||phrase,meaning:second?"Say it naturally, without translating first.":"Say the phrase naturally."},
   {type:"teach",stage:"Adapt",phrase:phrase,meaning:"You will meet this expression again in a different context."},
   {type:"talk",stage:"Talk",setting,goal,opening:nativeLine||phrase}
 ];
 return {
   setting,moment,goal,opening:nativeLine||phrase,
   cards:cards.filter(card=>card.phrase||card.type==="scene"||card.type==="check"||card.type==="talk")
 };
}

function localReply(c,input,turn){
 const lines=Array.isArray(baseLesson?.content?.dialogue)?baseLesson.content.dialogue:[];
 const native=lines.filter(x=>String(x.speaker||"").toLowerCase()==="native").map(x=>String(x.text||"")).filter(Boolean);
 if(native.length)return native[Math.min(turn-1,native.length-1)];
 return "That makes sense. Tell me a little more.";
}

function startRecognition(expected,done){
 stopRecognition();
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){done("");return}
 const r=new SR();
 recognition=r;
 r.lang=profile?.code||"en-US";
 r.continuous=false;
 r.interimResults=false;
 r.maxAlternatives=3;
 r.onresult=e=>{
   const text=Array.from(e.results).map(x=>x[0]?.transcript||"").join(" ").trim();
   recognition=null;
   done(text);
 };
 r.onerror=()=>{recognition=null;done("")};
 r.onend=()=>{if(recognition===r)recognition=null};
 r.start();
}

function similarity(a,b){
 const clean=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\u0600-\u06ff ]/g," ").replace(/\s+/g," ").trim();
 const A=clean(a).split(" ").filter(Boolean),B=clean(b).split(" ").filter(Boolean);
 if(!A.length||!B.length)return 0;
 const set=new Set(B);return A.filter(x=>set.has(x)).length/Math.max(A.length,B.length);
}

function render(){
 const cards=lesson.cards;
 if(index>=cards.length){finish();return}
 $("stage").textContent=cards[index].stage;
 $("count").textContent=(index+1)+" / "+cards.length;
 $("fill").style.width=((index+1)/cards.length*100)+"%";
 const c=cards[index];
 if(c.type==="scene")renderScene(c);
 else if(c.type==="teach")renderTeach(c);
 else if(c.type==="check")renderCheck(c);
 else if(c.type==="speak")renderSpeak(c);
 else renderTalk(c);
}

function frame(body,action){
 $("card").innerHTML='<section class="lesson-card">'+body+(action?'<div class="actions">'+action+'</div>':'')+'</section>';
}

function renderScene(c){
 frame('<div class="kicker">Situation</div><div class="scene-wrap"><p class="scene-text">'+esc(c.setting)+'</p><p class="scene-goal">'+esc(c.moment)+'</p><p class="scene-goal">'+esc(c.goal)+'</p></div>','<button class="primary" id="next">Start →</button>');
 $("next").onclick=()=>{index++;render()};
}

function renderTeach(c){
 frame('<div class="kicker">Learn</div><p class="phrase">'+esc(c.phrase)+'</p><p class="meaning">'+esc(c.meaning)+'</p><button class="secondary" id="listen">Listen</button>','<button class="primary" id="next">Got it →</button>');
 $("listen").onclick=()=>browserSpeak(c.phrase);
 browserSpeak(c.phrase);
 $("next").onclick=()=>{xp+=5;index++;render()};
}

function renderCheck(c){
 const opts=[c.answer,...c.distractors].sort(()=>Math.random()-.5);
 frame('<div class="kicker">Choose</div><p class="question">'+esc(c.prompt)+'</p><div class="options">'+opts.map((o,i)=>'<button class="option" data-value="'+esc(o)+'"><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+esc(o)+'</span></button>').join("")+'</div><div class="feedback" id="feedback"></div>','<button class="primary" id="next" disabled>Continue →</button>');
 let answered=false;
 document.querySelectorAll(".option").forEach(btn=>btn.onclick=()=>{
   if(answered)return;
   answered=true;
   const ok=similarity(btn.dataset.value,c.answer)>.8;
   btn.classList.add(ok?"correct":"wrong");
   document.querySelectorAll(".option").forEach(x=>x.disabled=true);
   $("feedback").textContent=ok?"That fits the situation.":"Not quite. Think about what you need to say here.";
   $("next").disabled=false;
   xp+=ok?8:2;
   answers.push({type:"check",choice:btn.dataset.value,correct:ok});
 });
 $("next").onclick=()=>{index++;render()};
}

function renderSpeak(c){
 frame('<div class="kicker">Your turn</div><div class="speak-box"><div class="speak-target">'+esc(c.phrase)+'</div><div class="speak-meaning">'+esc(c.meaning)+'</div><button class="primary speak-button" id="speak">Speak</button><div class="status" id="status">Say the phrase naturally.</div></div>','<button class="primary" id="next" disabled>Continue →</button>');
 $("speak").onclick=()=>{
   $("status").textContent="Listening…";
   $("speak").disabled=true;
   startRecognition(c.phrase,text=>{
     if(!text){$("status").textContent="I didn't catch that. Try again.";$("speak").disabled=false;return}
     const score=similarity(text,c.phrase);
     answers.push({type:"speak",expected:c.phrase,heard:text,score});
     if(score>=.7){
       $("status").textContent="Heard: "+text;
       xp+=12;
       $("next").disabled=false;
       setTimeout(()=>{index++;render()},450);
     }else{
       $("status").textContent="Heard: "+text+" — try it once more.";
       $("speak").disabled=false;
     }
   });
 };
}

function renderTalk(c){
 frame('<div class="kicker">Talk</div><p class="live-goal">'+esc(c.goal)+'</p><div class="chat" id="chat"></div><textarea class="input" id="input" placeholder="Say what you would actually say…"></textarea><div class="actions"><button class="secondary" id="voice">Speak</button><button class="primary" id="send">Respond →</button></div><div class="feedback" id="status">The other person is waiting.</div>');
 conversation=[{role:"assistant",content:c.opening}];
 drawChat();
 browserSpeak(c.opening);
 $("voice").onclick=()=>{
   $("status").textContent="Listening…";
   startRecognition("",text=>{if(text){$("input").value=text;$("status").textContent="Heard: "+text}else $("status").textContent="Try again.";});
 };
 $("send").onclick=sendTalk;
}

function drawChat(){
 $("chat").innerHTML=conversation.map(m=>'<div class="bubble '+(m.role==="user"?"you":"")+'"><div class="bubble-label">'+(m.role==="user"?"You":"Native speaker")+'</div>'+esc(m.content)+'</div>').join("");
 $("chat").scrollTop=$("chat").scrollHeight;
}

async function sendTalk(){
 const input=$("input").value.trim();
 if(!input){$("status").textContent="Say or type something first.";return}
 const c=lesson.cards[index];
 const turn=conversation.filter(x=>x.role==="user").length+1;
 conversation.push({role:"user",content:input});
 $("input").value="";
 drawChat();
 $("send").disabled=true;
 let reply="";
 try{
   const controller=new AbortController();
   const timer=setTimeout(()=>controller.abort(),9000);
   const res=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({language:profile.name,level:profile.level,goal:c.goal,topic:c.setting,context:{setting:c.setting,goal:c.goal,openingLine:c.opening},messages:conversation}),signal:controller.signal});
   clearTimeout(timer);
   const data=await res.json().catch(()=>({}));
   if(!res.ok||!data.text)throw new Error("chat failed");
   reply=String(data.text);
 }catch(e){reply=localReply(c,input,turn)}
 conversation.push({role:"assistant",content:reply});
 drawChat();
 browserSpeak(reply);
 xp+=15;
 if(turn>=3){
   $("send").textContent="Finish lesson";
   $("send").disabled=false;
   $("send").onclick=finish;
   $("status").textContent="You handled the situation.";
 }else{
   $("send").disabled=false;
   $("send").textContent="Respond →";
   $("status").textContent="Keep the conversation moving.";
 }
}

async function finish(){
 try{
   if(user&&baseLesson?.id)await client.from("lesson_attempts").insert({lesson_id:baseLesson.id,score:Math.min(100,xp*2),responses:{answers,xp}});
 }catch(e){console.error("lesson save failed",e)}
 $("stage").textContent="Complete";
 $("count").textContent="";
 $("fill").style.width="100%";
 $("card").innerHTML='<section class="lesson-card complete"><div class="kicker">Complete</div><h2>Lesson complete</h2><p class="meaning">You learned the language, used it, and handled a real interaction.</p><div class="xp">'+xp+' XP</div><a class="primary" href="dashboard.html" style="display:inline-flex;text-decoration:none">Continue learning →</a></section>';
}

async function load(){
 try{
   const sessionResult=await Promise.race([
     client.auth.getSession(),
     new Promise((_,reject)=>setTimeout(()=>reject(new Error("Session check timed out.")),8000))
   ]);
   if(sessionResult.error||!sessionResult.data?.session?.user){location.href="login.html";return}
   user=sessionResult.data.session.user;

   const saved=localStorage.getItem("Nahtive_current_learner_language");
   const langsResult=await Promise.race([
     client.from("learner_languages").select("id,level,is_current,languages(name,code)").eq("user_id",user.id),
     new Promise((_,reject)=>setTimeout(()=>reject(new Error("Language data timed out.")),8000))
   ]);
   const {data:langs,error}=langsResult;
   if(error)throw error;
   if(!langs?.length){location.href="onboarding.html";return}

   const current=langs.find(x=>x.id===saved)||langs.find(x=>x.is_current)||langs[0];
   localStorage.setItem("Nahtive_current_learner_language",current.id);

   const params=new URLSearchParams(location.search);
   const requested=params.get("id");
   if(requested){
     const r=await client.from("lessons")
       .select("id,title,topic,level,content,learner_language_id,curriculum_node_id,learner_languages(id,user_id,level,languages(name,code)),curriculum_nodes(sequence_number,stage_name,title,situation,focus)")
       .eq("id",requested).maybeSingle();
     if(r.error)throw r.error;
     if(!r.data||r.data.learner_languages?.user_id!==user.id)throw new Error("This lesson is not available.");
     baseLesson=r.data;
   }else{
     const r=await client.from("lessons")
       .select("id,title,topic,level,content,learner_language_id,curriculum_node_id,created_at,learner_languages(id,user_id,level,languages(name,code)),curriculum_nodes(sequence_number,stage_name,title,situation,focus)")
       .eq("learner_language_id",current.id)
       .order("created_at",{ascending:true})
       .limit(120);
     if(r.error)throw r.error;
     const lessons=Array.isArray(r.data)?r.data:[];
     if(!lessons.length)throw new Error("No lessons are available for this language yet.");
     const ids=lessons.map(x=>x.id);
     const attempts=await client.from("lesson_attempts").select("lesson_id").in("lesson_id",ids);
     const completed=new Set((attempts.data||[]).map(x=>x.lesson_id));
     const ordered=lessons.slice().sort((a,b)=>{
       const as=Number(a.curriculum_nodes?.sequence_number||9999),bs=Number(b.curriculum_nodes?.sequence_number||9999);
       return as-bs||new Date(a.created_at)-new Date(b.created_at);
     });
     baseLesson=ordered.find(x=>!completed.has(x.id))||ordered[ordered.length-1];
   }

   const linked=baseLesson.learner_languages;
   profile={
     id:linked.id,
     name:linked.languages?.name||"Language",
     code:linked.languages?.code||"en-US",
     level:String(baseLesson.level||linked.level||"A1")
   };
   lesson=buildLessonFromContent(baseLesson);

   if(!lesson?.cards?.length)throw new Error("This lesson has no usable learning content yet.");

   $("language").textContent=profile.name+" · "+profile.level;
   $("title").textContent=baseLesson.title||lesson.setting||"Lesson";
   $("intro").textContent=baseLesson.curriculum_nodes?.stage_name
     ? baseLesson.curriculum_nodes.stage_name+" · "+(baseLesson.curriculum_nodes.focus||"Real conversation")
     : "Learn it. Use it. Then talk.";
   $("loading").style.display="none";
   $("lesson").style.display="block";
   render();
 }catch(e){
   console.error("Nahtive lesson load failed:",e);
   $("loading").innerHTML='<strong>We couldn’t load this lesson.</strong><br><span class="small">'+esc(e?.message||"Please try again.")+'</span><br><button class="primary" style="margin-top:16px" onclick="location.reload()">Try again</button>';
 }
}
load();
</script>
</body>
</html>
