<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const client=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);let currentLevelForPlacement="A0";
const $=id=>document.getElementById(id);
let user=null,baseLesson=null,profile=null,generated=null,index=0,answers=[],conversation=[],xp=0,voice=null;

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
async function speak(text,lang){
 if(!text)return;
 try{
   const res=await fetch("/api/speak",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:String(text).slice(0,1200),language:lang||profile?.code||"en-US"})});
   if(!res.ok)throw new Error("TTS unavailable");
   const blob=await res.blob();
   const url=URL.createObjectURL(blob);
   const audio=new Audio(url);
   audio.playbackRate=1;
   audio.onended=()=>URL.revokeObjectURL(url);
   await audio.play();
 }catch(e){
   if("speechSynthesis"in window){
     speechSynthesis.cancel();
     const u=new SpeechSynthesisUtterance(text);
     u.lang=lang||profile?.code||"en-US";
     u.rate=.94;
     u.pitch=1;
     const voices=speechSynthesis.getVoices();
     const base=(u.lang||"en-US").split("-")[0].toLowerCase();
     const match=voices.find(v=>v.lang?.toLowerCase().startsWith(base));
     if(match)u.voice=match;
     speechSynthesis.speak(u);
   }
 }
}
function normalize(v){return String(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\p{L}\p{N} ]/gu," ").replace(/\s+/g," ").trim();}
function similarity(a,b){a=normalize(a);b=normalize(b);if(!a||!b)return 0;if(a===b)return 1;const A=[...a],B=[...b],d=Array.from({length:A.length+1},(_,i)=>i);for(let j=1;j<=B.length;j++){let p=d[0];d[0]=j;for(let i=1;i<=A.length;i++){const old=d[i],cost=A[i-1]===B[j-1]?0:1;d[i]=Math.min(d[i]+1,d[i-1]+1,p+cost);p=old}}return Math.max(0,1-d[A.length]/Math.max(A.length,B.length));}
function detected(text){const code=(profile?.code||"").toLowerCase().split("-")[0];const r={ar:/[\u0600-\u06ff]/,pl:/[ąćęłńóśźż]/i,nl:/\b(ik|je|het|een|van|voor|wat|wil|kan|niet|goed|de)\b/i,es:/\b(que|como|quiero|puedo|para|por|una|uno|el|la|me|te|donde|bien)\b/i,en:/\b(i|you|the|a|what|can|get|for|me|is|want)\b/i};return code==="ar"?r.ar.test(text):r[code]?r[code].test(text):true;}
function levelName(){return profile?.level||"A1";}
function stageName(card){return ({teach:"Learn",check:"Check",guided:"Practice",challenge:"Challenge",speak:"Speak",conversation:"Use it"})[card.type]||"Learn";}
function toast(message){const t=$("toast");if(!t)return;t.textContent=message;t.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove("show"),1500);}
function advance(){index++;render();window.scrollTo({top:0,behavior:"smooth"});}
function render(){const cards=generated.cards||[];if(index>=cards.length){finish();return}const card=cards[index];$("stage").textContent=(index+1)+" of "+cards.length+" · "+stageName(card);$("fill").style.width=((index+1)/cards.length*100)+"%";if(card.type==="teach")renderTeach(card);else if(card.type==="check")renderCheck(card);else if(card.type==="guided")renderGuided(card);else if(card.type==="challenge")renderChallenge(card);else if(card.type==="speak")renderSpeak(card);else renderConversation(card);}
function shell(title,sub,body,actions){$("card").innerHTML='<section class="card"><h2>'+esc(title)+'</h2><p class="sub">'+esc(sub||"")+'</p>'+body+actions+'</section>';}
function renderTeach(c){
 const body='<div class="lesson-task-label">Learn the expression</div>'+
   '<div class="phrase">'+esc(c.phrase)+'</div>'+
   '<div class="meaning">'+esc(c.meaning)+'</div>'+
   '<div class="pron"><strong>How it sounds</strong><br>'+esc(c.pronunciation)+(c.ipa?' · '+esc(c.ipa):'')+'</div>'+
   '<div class="usage"><strong>When a native speaker uses it</strong><br>'+esc(c.usage)+'</div>'+
   '<div class="example"><strong>Natural example</strong><br>'+esc(c.example)+(c.exampleMeaning?'<br><span class="example-explanation">'+esc(c.exampleMeaning)+'</span>':'')+'</div>'+
   '<div class="listen-row"><button class="secondary" id="hear">Hear phrase</button><button class="secondary" id="hearExample">Hear example</button></div>';
 shell("Learn this","Do not guess. Read the meaning, hear it, and connect it to the scene.",body,'<div class="actions"><div class="notice">First understand it. Then we will ask you to use it.</div><button class="primary" id="next">I understand →</button></div>');
 $("hear").onclick=()=>speak(c.phrase,profile.code); $("hearExample").onclick=()=>speak(c.example,profile.code);
 $("next").onclick=()=>{xp+=5;toast("Meaning locked in.");advance();};
}
function renderCheck(c){
 let answered=false;
 const phrase=c.phrase||"";
 const body='<div class="lesson-task-label">First, make sure you understand it</div>'+
   (phrase?'<div class="phrase compact">'+esc(phrase)+'</div>':'')+
   '<div class="task-question">'+esc(c.prompt||"What does this expression mean in this situation?")+'</div>'+
   '<div class="options">'+(c.options||[]).map((o,i)=>'<button class="option" data-i="'+i+'">'+esc(o)+'</button>').join("")+'</div>'+
   '<div class="notice feedback" id="feedback">Read the question first. Then choose the meaning that fits the scene.</div>';
 shell("Check your understanding","You just learned this. Now prove the meaning landed before we move on.",body,'<div class="actions"><button class="primary" id="next" disabled>Continue →</button></div>');
 document.querySelectorAll(".option").forEach(b=>b.onclick=()=>{
   if(answered)return; answered=true;
   const choice=c.options[Number(b.dataset.i)];
   const ok=normalize(choice)===normalize(c.answer)||similarity(choice,c.answer)>.86;
   document.querySelectorAll(".option").forEach(x=>x.disabled=true);
   b.classList.add(ok?"correct":"wrong");
   $("feedback").textContent=ok?(c.feedback||"Exactly. You understood what it means."):("Not quite. "+(c.feedback||"The answer is "+c.answer+"."));
   $("next").disabled=false; xp+=ok?8:3;
   answers.push({type:"check",prompt:c.prompt,choice,correct:ok});
 });
 $("next").onclick=()=>{toast("Meaning locked in. Now use it.");advance();};
}
function renderChallenge(c){
 const options=Array.isArray(c.options)&&c.options.length?c.options:[c.expected||c.answer||"Try your own response.","Ask for clarification.","Change the situation."];
 const body='<div class="lesson-task-label">One step harder</div>'+(c.phrase?'<div class="phrase compact">'+esc(c.phrase)+'</div>':'')+'<div class="task-question">'+esc(c.prompt)+'</div><div class="options">'+options.map((o,i)=>'<button class="option" data-i="'+i+'">'+esc(o)+'</button>').join("")+'</div><div class="notice" id="feedback" style="margin-top:14px"></div>';
 shell("Challenge","The support is lighter now. Pick the response that sounds right for the moment.",body,'<div class="actions"><div class="notice">Think about meaning, tone, and what would actually work here.</div><button class="primary" id="next" disabled>Continue →</button></div>');
 let answered=false;
 document.querySelectorAll(".option").forEach(b=>b.onclick=()=>{
   if(answered)return; answered=true;
   const choice=c.options?.[Number(b.dataset.i)]||b.textContent.trim();
   const ok=normalize(choice)===normalize(c.answer)||similarity(choice,c.answer||"")>.86;
   document.querySelectorAll(".option").forEach(x=>x.disabled=true);
   b.classList.add(ok?"correct":"wrong");
   $("feedback").textContent=ok?(c.feedback||"That fits the situation."):(c.feedback||("Not quite. A more natural choice is: "+(c.answer||c.expected||"the first option.")));
   answers.push({type:"challenge",prompt:c.prompt,choice,correct:ok});
   xp+=ok?12:5; $("next").disabled=false;
   toast(ok?"Nice choice.":"Good attempt — notice the difference.");
 });
 $("next").onclick=()=>advance();
}
function renderGuided(c){
 const body='<div class="lesson-task-label">Now use what you learned</div>'+
   (c.phrase?'<div class="phrase compact">'+esc(c.phrase)+'</div>':'')+
   '<div class="task-question">'+esc(c.prompt||"Use the expression in your own response.")+'</div>'+
   (c.context?'<div class="task-context">'+esc(c.context)+'</div>':'')+
   '<textarea class="input" id="input" placeholder="Type your answer in the target language…"></textarea>'+
   '<div class="notice feedback" id="feedback">You can borrow the structure. Your goal is to make the response fit the situation.</div>';
 shell("Practice it","You know what the expression means. Now build a response with it.",body,'<div class="actions"><button class="primary" id="submit">Check →</button></div>');
 $("submit").onclick=()=>{
   const v=$("input").value.trim();
   if(!v){$("feedback").textContent="Write a response first. You can use the phrase above as your starting point.";return}
   const expected=c.expected||c.answer||"";
   const score=expected?similarity(v,expected):.5;
   answers.push({type:"guided",prompt:c.prompt,response:v,expected,score}); xp+=score>.55?10:6;
   $("feedback").textContent=score>.55?(c.feedback||"Good. That response fits the situation."):("Good attempt. A natural model is: "+(expected||"Try the target phrase in your own sentence."));
   toast(score>.55?"That works.":"Good attempt — compare it with the model.");
   $("submit").textContent="Continue →"; $("submit").onclick=()=>advance();
 };
}
function speechButton(target,done){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$("voiceStatus").textContent="Voice input isn't available here. Type instead.";return}const r=new SR();r.lang=profile.code||"en-US";r.interimResults=false;r.maxAlternatives=3;r.continuous=false;r.onstart=()=>{$("voice").disabled=true;$("voiceStatus").textContent="Listening…"};r.onresult=e=>{const heard=e.results[0][0].transcript,ok=detected(heard),score=similarity(heard,target||"");voice={text:heard,confidence:e.results[0][0].confidence||0,detected:ok,score};$("input").value=heard;$("voiceStatus").textContent=ok?"I heard: "+heard:"I couldn't verify the target language yet. You can type your answer instead.";done();};r.onerror=()=>{$("voiceStatus").textContent="I couldn't hear that. Try again or type it.";voice=null};r.onend=()=>{$("voice").disabled=false};try{r.start()}catch(e){$("voiceStatus").textContent="Voice input is busy. Type instead.";}}
function renderSpeak(c){const body='<div class="lesson-task-label">Say it naturally</div><div class="phrase">'+esc(c.phrase||"")+'</div><div class="meaning">'+esc(c.prompt)+'</div><div class="listen-row"><button class="secondary" id="hear">Hear it</button></div><textarea class="input" id="input" placeholder="Type it if you prefer…"></textarea><div class="listen-row"><button class="secondary" id="voice">Speak it</button></div><div class="notice" id="voiceStatus">Speaking is practice, not a gate. You can type and continue.</div>';shell("Now say it","You have already learned the language. Now put it in your mouth.",body,'<div class="actions"><div class="notice">Aim for natural rhythm, not perfection.</div><button class="primary" id="next">Continue →</button></div>');$("hear").onclick=()=>speak(c.phrase,profile.code);$("voice").onclick=()=>speechButton(c.phrase,()=>{});$("next").onclick=()=>{const v=$("input").value.trim()||voice?.text||"";answers.push({type:"speak",response:v,voice});xp+=v?15:5;toast(v?"You used it — nice.":"Keep practicing.");advance();};}
function renderConversation(c){const body='<div class="chat" id="chat"></div><textarea class="input" id="input" placeholder="Respond naturally in the target language…"></textarea><div class="listen-row"><button class="secondary" id="voice">Speak</button></div><div class="notice" id="voiceStatus">This is the first real conversation. You can type or speak.</div>';shell("Use it","The support comes off now. Respond to the situation, then keep going.",body,'<div class="actions"><div class="notice">Stay in the scene.</div><button class="primary" id="send">Send →</button></div>');$("voice").onclick=()=>speechButton("",()=>{});conversation=[];if(c.phrase)conversation.push({role:"assistant",content:c.phrase});drawChat();$("send").onclick=sendConversation;}
function drawChat(){const box=$("chat");if(!box)return;box.innerHTML=conversation.map(m=>'<div class="bubble '+(m.role==="user"?"you":"")+'"><div class="speaker">'+(m.role==="user"?"You":"Native speaker")+'</div>'+esc(m.content)+'</div>').join("");}
async function sendConversation(){const input=$("input").value.trim()||voice?.text||"";if(!input){$("voiceStatus").textContent="Give the other person something to respond to.";return}const c=generated.cards[index],topic=baseLesson?.topic||"Everyday life";conversation.push({role:"user",content:input});$("input").value="";drawChat();$("send").disabled=true;$("voiceStatus").textContent="Thinking…";try{const res=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({language:profile.name,level:levelName(),goal:profile.goal||"Real conversation",topic,messages:conversation})});const data=await res.json();if(!res.ok)throw new Error(data.error||"Conversation failed.");conversation.push({role:"assistant",content:data.text});answers.push({type:"conversation",user:input,assistant:data.text});xp+=20;drawChat();voice=null;if(answers.filter(a=>a.type==="conversation").length>=2){$("send").textContent="Finish lesson";$("send").onclick=finish;toast("You kept the conversation going.");}$("voiceStatus").textContent="Good. Keep the interaction natural."; }catch(e){$("voiceStatus").textContent=e.message||"The conversation couldn't continue. Try again."}finally{$("send").disabled=false;}}
async function finish(){if($("card").dataset.done)return;$("card").dataset.done="1";try{if(user&&baseLesson?.id){await client.from("lesson_attempts").insert({lesson_id:baseLesson.id,score:Math.min(100,xp*2),responses:{generated_lesson:generated,answers}});await client.from("learner_events").insert({user_id:user.id,learner_language_id:profile.id,event_type:"lesson_completed",event_data:{lesson_id:baseLesson.id,xp,level:profile.level}});}}catch(e){console.error("Nahtive completion save failed:",e)}$("card").innerHTML='<section class="card complete"><h2>Lesson complete</h2><p class="sub">You learned first, practiced with support, and then used the language in a real interaction.</p><div class="xp">'+xp+' XP earned</div><div class="actions" style="justify-content:center"><a class="primary" href="dashboard.html" style="text-decoration:none">Continue learning →</a></div></section>';$("card").querySelector(".complete").style.display="block";$("stage").textContent="Complete";$("fill").style.width="100%";}
function generatedLessonMatchesLevel(lesson){const level=profile?.level||"A1";if(!["B1","B2","B2+","C1","C2"].includes(level))return true;const text=JSON.stringify(lesson?.cards||[]).toLowerCase();const basic=/\\b(hello|hi|hola|hey|bonjour|hallo|ciao|oi|good morning|good afternoon|buenos días|buenas)\\b/i;return !basic.test(text)}
function buildFallbackLesson(){
 const seed=baseLesson?.content&&typeof baseLesson.content==="object"?baseLesson.content:{};
 const level=profile?.level||"A1";
 const code=(profile?.code||"").toLowerCase().split("-")[0];
 const topic=String(baseLesson?.topic||seed.topic||"Everyday conversation");
 const scenario=seed.scene&&typeof seed.scene==="object"?seed.scene:{};

 const contextual={
  es:{
   beginner:["Quiero pedirte algo.","¿Me puedes explicar cómo funciona?","Vale, déjame pensarlo."],
   intermediate:["A ver si lo entiendo bien.","No estoy del todo convencido.","¿Qué te parece si lo hacemos de otra manera?"],
   advanced:["No es que esté en desacuerdo, pero creo que estamos pasando por alto algo importante.","Entiendo lo que planteas; lo que me preocupa son las consecuencias a largo plazo.","Si queremos que esto funcione, tendremos que encontrar un punto medio."]
  },
  en:{
   beginner:["I'd like to ask you something.","Could you explain how this works?","Okay, let me think about it."],
   intermediate:["Let me make sure I understand.","I'm not completely convinced.","What if we tried doing it another way?"],
   advanced:["It's not that I disagree, but I think we're overlooking something important.","I see what you're getting at; what concerns me is the long-term impact.","If we want this to work, we're going to have to find some middle ground."]
  },
  fr:{
   beginner:["Je voudrais te demander quelque chose.","Tu peux m'expliquer comment ça marche ?","D'accord, laisse-moi réfléchir."],
   intermediate:["Si je comprends bien...","Je ne suis pas complètement convaincu.","Et si on essayait de faire autrement ?"],
   advanced:["Ce n'est pas que je ne sois pas d'accord, mais je pense qu'on passe à côté de quelque chose d'important.","Je comprends ton point de vue ; ce qui m'inquiète, ce sont les conséquences à long terme.","Si on veut que ça fonctionne, il va falloir trouver un compromis."]
  },
  nl:{
   beginner:["Ik wil je iets vragen.","Kun je uitleggen hoe dit werkt?","Oké, laat me er even over nadenken."],
   intermediate:["Als ik het goed begrijp...","Ik ben nog niet helemaal overtuigd.","Wat als we het op een andere manier proberen?"],
   advanced:["Niet dat ik het oneens ben, maar volgens mij zien we iets belangrijks over het hoofd.","Ik begrijp wat je bedoelt; wat me zorgen baart, zijn de gevolgen op lange termijn.","Als we willen dat dit werkt, zullen we een middenweg moeten vinden."]
  }
 };
 const bank=contextual[code]||contextual.en;
 const tier=["A0","A1","A2"].includes(level)?"beginner":(["B1","B2"].includes(level)?"intermediate":"advanced");
 const seededCards=Array.isArray(seed.cards)?seed.cards.filter(x=>x&&typeof x==="object"):[];
 const seededPhrases=seededCards.map(x=>x.phrase||x.target||x.expression||x.text).filter(x=>typeof x==="string"&&x.trim()).slice(0,3);
 const phrases=seededPhrases.length>=3?seededPhrases:bank[tier];

 const primary=phrases[0],second=phrases[1]||primary,third=phrases[2]||primary;
 const makeTeach=(phrase,n)=>({
   type:"teach",phrase,pronunciation:phrase,ipa:"",
   meaning:n===1?"A natural expression for the situation.":n===2?"A useful alternative when the situation changes.":"A higher-value expression that helps you sound more natural and precise.",
   usage:"Use it when the situation calls for this meaning and tone. Listen for how direct, casual, or careful it sounds.",
   example:phrase,
   exampleMeaning:"This is a natural use of the expression in the scene.",
   prompt:"",options:[],answer:"",feedback:"",instructions:"",expected:"",followUp:""
 });
 const cards=[
  makeTeach(primary,1),
  {type:"check",phrase:primary,prompt:"What is the main meaning of this expression in the situation?",options:["The intended meaning in context","A completely different idea","A grammar rule"],answer:"The intended meaning in context",feedback:"Exactly. You understood the expression."},
  {type:"guided",phrase:primary,prompt:"Use this expression to respond to the situation in your own words.",context:"Keep the same meaning, but make the response fit the scene.",expected:primary,answer:primary,feedback:"Good. You are using the expression rather than just recognizing it."},
  makeTeach(second,2),
  {type:"check",phrase:second,prompt:"Which interpretation best fits the tone of this expression here?",options:["The intended meaning and tone","A completely different situation","A literal word-for-word translation"],answer:"The intended meaning and tone",feedback:"Right. Natural language depends on context and tone."},
  {type:"guided",phrase:second,prompt:"Change one detail in the situation and use this expression in your response.",context:"Keep the idea, but adapt the response to the changed situation.",expected:second,answer:second,feedback:"Nice. You adapted the language to the moment."},
  makeTeach(third,3),
  {type:"check",phrase:third,prompt:"Why would a native speaker choose this expression in this situation?",options:["It fits the intended meaning and tone","It is always the only correct choice","It has no connection to the situation"],answer:"It fits the intended meaning and tone",feedback:"Exactly. The situation determines what sounds natural."},
  {type:"guided",phrase:third,prompt:"Build your own response using this expression. Keep the meaning but make the sentence yours.",context:"Change the details so the response belongs to you.",expected:third,answer:third,feedback:"Good. You are moving from recognition to production."},
  {type:"challenge",phrase:third,prompt:"The situation changes unexpectedly. Which response sounds most natural now?",options:[third,second,primary],answer:third,feedback:"Notice how the best choice depends on what is happening now."},
  {type:"speak",phrase:third,prompt:"Say the expression naturally, then continue the thought if you can.",expected:third,answer:third,feedback:"Good. Now use it without the script."},
  {type:"conversation",phrase:"Now the other person responds and the situation moves forward.",prompt:"Respond naturally in the target language and keep the scene moving.",expected:"",answer:"",feedback:"Keep the interaction going.",instructions:"Respond naturally.",followUp:""}
 ];
 generated={
  title:(["B2+","C1","C2"].includes(level)?level+" · Nuance in real conversation":level+" · "+topic),
  intro:"A level-matched lesson built around a real situation. Learn the language first, then use it with less support.",
  scene:{
   setting:scenario.setting||topic,
   moment:scenario.moment||"The situation changes and you need to respond naturally.",
   learnerRole:scenario.learnerRole||"You are handling the interaction.",
   goal:scenario.goal||"Choose language that fits the meaning, relationship, and tone."
  },
  cards
 };
}

function showError(msg){$("loading").innerHTML="<strong>We couldn’t build this lesson.</strong><br><span class=\"small\">"+esc(msg)+"</span><br><button class=\"primary\" style=\"margin-top:16px\" onclick=\"location.reload()\">Try again</button>";}
