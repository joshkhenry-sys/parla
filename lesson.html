<style>
:root{--bg:#f7f5ef;--surface:#fffdf8;--ink:#46504b;--muted:#747c77;--line:#dddcd3;--accent:#9caf78;--accent-soft:#eef3e7;--blue:#e8f1f2;--warm:#f4e8df;--shadow:0 8px 28px rgba(54,62,58,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}.shell{width:min(1080px,calc(100% - 36px));margin:auto}
nav{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.logo{color:var(--ink);font-size:20px;font-weight:750;letter-spacing:-.6px;text-decoration:none}.logo i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:3px}.exit{font-size:13px;color:var(--muted);text-decoration:none}
.lesson{display:grid;grid-template-columns:250px 1fr;gap:58px;padding:42px 0 80px}.context{padding-top:5px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;font-weight:750;color:var(--muted)}h1{font-size:31px;line-height:1.15;letter-spacing:-1px;margin:12px 0 12px;font-weight:700}.context p{font-size:14px;color:var(--muted);margin:0;line-height:1.65}.scene{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}.scene strong{display:block;color:var(--ink);font-size:13px;margin-bottom:3px}
.main{max-width:690px}.stage{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;font-weight:750;color:#71805c;margin-bottom:9px}.bar{height:6px;background:#e5e3da;border-radius:99px;overflow:hidden;margin-bottom:28px}.fill{height:100%;width:0;background:var(--accent);transition:width .3s ease}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:var(--shadow);transition:transform .2s ease,box-shadow .2s ease}.card h2{font-size:24px;line-height:1.25;letter-spacing:-.4px;margin:0 0 9px}.sub{color:var(--muted);font-size:14px;margin:0 0 20px}.phrase{font-size:27px;line-height:1.3;font-weight:700;letter-spacing:-.5px;margin:8px 0}.meaning{font-size:15px;margin-top:8px}.pron{font-size:13px;color:var(--muted);margin-top:7px}.usage{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:14px}.example{margin-top:15px;padding:14px 15px;background:var(--accent-soft);border-radius:11px;font-size:14px}.actions{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:22px}.primary,.secondary{border:0;border-radius:10px;padding:11px 16px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.primary{background:var(--ink);color:#fff}.secondary{background:var(--blue);color:var(--ink);border:1px solid #d5e2e3}.primary:disabled,.secondary:disabled{opacity:.45;cursor:default}.listen-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.listen-row .secondary{display:inline-flex;align-items:center;gap:7px}.listen-row .secondary::before{content:"▶";font-size:9px}.notice{font-size:13px;color:var(--muted);min-height:20px}.options{display:grid;gap:9px;margin-top:18px}.option{padding:12px 14px;border:1px solid var(--line);background:#fff;border-radius:10px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}.option:hover{border-color:#bcc4b1}.option.correct{border-color:#9caf78;background:var(--accent-soft)}.option.wrong{border-color:#d5b3a3;background:var(--warm)}.input{width:100%;min-height:82px;resize:vertical;border:1px solid var(--line);border-radius:11px;background:#fff;padding:13px 14px;font:inherit;color:var(--ink);outline:none}.input:focus{border-color:#aeb9a0}.chat{display:grid;gap:11px;margin:18px 0}.bubble{max-width:84%;padding:12px 14px;border-radius:14px;background:#f0eee7;border:1px solid var(--line);font-size:14px}.bubble.you{margin-left:auto;background:var(--accent-soft);border-color:#d8e3cc}.speaker{font-size:10px;text-transform:uppercase;letter-spacing:.8px;font-weight:750;color:var(--muted);margin-bottom:3px}.complete{display:none;text-align:center;padding:30px 20px}.complete h2{margin-bottom:8px}.xp{font-size:14px;color:var(--muted)}.loading{text-align:center;padding:55px 20px;color:var(--muted)}.error{padding:25px}.small{font-size:12px;color:var(--muted)}
@media(max-width:760px){.lesson{grid-template-columns:1fr;gap:27px;padding-top:30px}.context{padding-bottom:23px;border-bottom:1px solid var(--line)}h1{font-size:28px}.shell{width:min(calc(100% - 28px),650px)}.card{padding:20px}.phrase{font-size:23px}.bubble{max-width:90%}}
</style>
<style>
.card{animation:cardIn .28s ease both}.fill{transition:width .45s cubic-bezier(.22,.8,.25,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.option{transition:transform .16s ease,border-color .16s ease,background .16s ease}.option:hover{transform:translateY(-1px)}
.option.correct{animation:answerPop .28s ease}.option.wrong{animation:answerShake .28s ease}
@keyframes answerPop{50%{transform:scale(1.015)}}@keyframes answerShake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.lesson-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);opacity:0;background:var(--ink);color:#fff;padding:10px 15px;border-radius:999px;font-size:12px;font-weight:700;pointer-events:none;transition:.25s ease;z-index:10}.lesson-toast.show{opacity:1;transform:translate(-50%,0)}
.complete{animation:cardIn .35s ease}.complete .xp{margin:14px 0 4px;font-weight:700;color:var(--ink)}
</style>
<link rel="stylesheet" href="nahtive.css"></head>
<body>
<div class="shell">
<nav><a class="logo" href="dashboard.html">Nahtive<i></i></a><a class="exit" href="dashboard.html">Exit lesson</a></nav>
<div id="loading" class="loading">Building your lesson…<br><span id="loadingDetail" class="small">Creating the scene and lesson steps.</span></div>
<div id="lesson" class="lesson" style="display:none">
<aside class="context">
<div class="eyebrow" id="language">Language</div>
<h1 id="title">Lesson</h1>
<p id="intro"></p>
<div class="scene"><strong id="setting"></strong><span id="moment"></span><br><span id="role"></span></div>
</aside>
<main class="main">
<div class="stage" id="stage">Getting started</div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="card"></div>
<div class="lesson-toast" id="toast" role="status" aria-live="polite"></div>
</main>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const client=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);let currentLevelForPlacement="A0";
const $=id=>document.getElementById(id);
let user=null,baseLesson=null,profile=null,generated=null,index=0,answers=[],conversation=[],xp=0,voice=null;

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
function speak(text,lang){if(!text||!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang||profile?.code||"en-US";u.rate=.9;speechSynthesis.speak(u);}
function normalize(v){return String(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\p{L}\p{N} ]/gu," ").replace(/\s+/g," ").trim();}
function similarity(a,b){a=normalize(a);b=normalize(b);if(!a||!b)return 0;if(a===b)return 1;const A=[...a],B=[...b],d=Array.from({length:A.length+1},(_,i)=>i);for(let j=1;j<=B.length;j++){let p=d[0];d[0]=j;for(let i=1;i<=A.length;i++){const old=d[i],cost=A[i-1]===B[j-1]?0:1;d[i]=Math.min(d[i]+1,d[i-1]+1,p+cost);p=old}}return Math.max(0,1-d[A.length]/Math.max(A.length,B.length));}
function detected(text){const code=(profile?.code||"").toLowerCase().split("-")[0];const r={ar:/[\u0600-\u06ff]/,pl:/[ąćęłńóśźż]/i,nl:/\b(ik|je|het|een|van|voor|wat|wil|kan|niet|goed|de)\b/i,es:/\b(que|como|quiero|puedo|para|por|una|uno|el|la|me|te|donde|bien)\b/i,en:/\b(i|you|the|a|what|can|get|for|me|is|want)\b/i};return code==="ar"?r.ar.test(text):r[code]?r[code].test(text):true;}
function levelName(){return profile?.level||"A1";}
function stageName(card){return ({teach:"Learn",check:"Check",guided:"Practice",challenge:"Challenge",speak:"Speak",conversation:"Use it"})[card.type]||"Learn";}
function toast(message){const t=$("toast");if(!t)return;t.textContent=message;t.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove("show"),1500);}
function advance(){index++;render();window.scrollTo({top:0,behavior:"smooth"});}
function render(){const cards=generated.cards||[];if(index>=cards.length){finish();return}const card=cards[index];$("stage").textContent=(index+1)+" of "+cards.length+" · "+stageName(card);$("fill").style.width=((index+1)/cards.length*100)+"%";if(card.type==="teach")renderTeach(card);else if(card.type==="check")renderCheck(card);else if(card.type==="guided")renderGuided(card);else if(card.type==="challenge")renderChallenge(card);else if(card.type==="speak")renderSpeak(card);else renderConversation(card);}
function shell(title,sub,body,actions){$("card").innerHTML='<section class="card"><h2>'+esc(title)+'</h2><p class="sub">'+esc(sub||"")+'</p>'+body+actions+'</section>';}
function renderTeach(c){const body='<div class="phrase">'+esc(c.phrase)+'</div><div class="meaning">'+esc(c.meaning)+'</div><div class="pron">Pronunciation: '+esc(c.pronunciation)+' · '+esc(c.ipa)+'</div><div class="usage"><strong>When you use it</strong><br>'+esc(c.usage)+'</div><div class="example"><strong>Natural example</strong><br>'+esc(c.example)+'</div><div class="listen-row"><button class="secondary" id="hear">Hear phrase</button><button class="secondary" id="hearExample">Hear example</button></div>';shell("Learn this","Understand it before you have to produce it.",body,'<div class="actions"><div class="notice">Take a second to connect the meaning to the scene.</div><button class="primary" id="next">Continue →</button></div>');$("hear").onclick=()=>speak(c.phrase,profile.code);$("hearExample").onclick=()=>speak(c.example,profile.code);$("next").onclick=()=>{xp+=5;toast("Nice — keep going.");advance();};}
function renderCheck(c){let answered=false;const body='<div class="meaning">'+esc(c.prompt)+'</div><div class="options">'+(c.options||[]).map((o,i)=>'<button class="option" data-i="'+i+'">'+esc(o)+'</button>').join("")+'</div><div class="notice" id="feedback" style="margin-top:14px"></div>';shell("Quick check","No speaking here. Make sure the meaning landed.",body,'<div class="actions"><div class="notice">Choose the answer that fits the situation.</div><button class="primary" id="next" disabled>Continue →</button></div>');document.querySelectorAll(".option").forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const choice=c.options[Number(b.dataset.i)],ok=normalize(choice)===normalize(c.answer)||similarity(choice,c.answer)>.86;document.querySelectorAll(".option").forEach(x=>x.disabled=true);b.classList.add(ok?"correct":"wrong");$("feedback").textContent=ok?(c.feedback||"That's it."):("Not quite. "+(c.feedback||"The answer is "+c.answer+"."));$("next").disabled=false;xp+=ok?8:3;answers.push({type:"check",prompt:c.prompt,choice,correct:ok});});$("next").onclick=()=>{toast("Got it. Now use it.");advance();};}
function renderChallenge(c){
 const options=Array.isArray(c.options)&&c.options.length?c.options:[c.expected||c.answer||"Try your own response.","Ask for clarification.","Change the situation."];
 const body='<div class="meaning">'+esc(c.prompt)+'</div><div class="options">'+options.map((o,i)=>'<button class="option" data-i="'+i+'">'+esc(o)+'</button>').join("")+'</div><div class="notice" id="feedback" style="margin-top:14px"></div>';
 shell("Challenge","The support is lighter now. Pick the response that sounds right for the moment.",body,'<div class="actions"><div class="notice">Think about meaning, tone, and what would actually work here.</div><button class="primary" id="next" disabled>Continue →</button></div>');
 let answered=false;
 document.querySelectorAll(".option").forEach(b=>b.onclick=()=>{
   if(answered)return; answered=true;
   const choice=c.options?.[Number(b.dataset.i)]||b.textContent.trim();
   const ok=normalize(choice)===normalize(c.answer)||similarity(choice,c.answer||"")>.86;
   document.querySelectorAll(".option").forEach(x=>x.disabled=true);
   b.classList.add(ok?"correct":"wrong");
   $("feedback").textContent=ok?(c.feedback||"That fits the situation."):(c.feedback||("Not quite. A more natural choice is: "+(c.answer||c.expected||"the first option.")));
   answers.push({type:"challenge",prompt:c.prompt,choice,correct:ok});
   xp+=ok?12:5; $("next").disabled=false;
   toast(ok?"Nice choice.":"Good attempt — notice the difference.");
 });
 $("next").onclick=()=>advance();
}
function renderGuided(c){const body='<div class="meaning">'+esc(c.prompt)+'</div><textarea class="input" id="input" placeholder="Type your answer in the target language…"></textarea><div class="notice" id="feedback" style="margin-top:12px"></div>';shell("Practice it","Build your own response before we ask you to speak.",body,'<div class="actions"><div class="notice" id="status">You can use the phrase you just learned.</div><button class="primary" id="submit">Check →</button></div>');$("submit").onclick=()=>{const v=$("input").value.trim();if(!v){$("status").textContent="Write a response first.";return}const expected=c.expected||c.answer||"";const score=expected?similarity(v,expected):.5;answers.push({type:"guided",prompt:c.prompt,response:v,expected,score});xp+=score>.55?10:6;$("feedback").textContent=score>.55?(c.feedback||"Good. That response works."):("Good start. A more natural model is: "+(expected||"Try the target phrase in your own sentence."));toast(score>.55?"That works.":"Good attempt — notice the model.");$("submit").textContent="Continue →";$("submit").onclick=()=>advance();};}
function speechButton(target,done){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$("voiceStatus").textContent="Voice input isn't available here. Type instead.";return}const r=new SR();r.lang=profile.code||"en-US";r.interimResults=false;r.maxAlternatives=3;r.continuous=false;r.onstart=()=>{$("voice").disabled=true;$("voiceStatus").textContent="Listening…"};r.onresult=e=>{const heard=e.results[0][0].transcript,ok=detected(heard),score=similarity(heard,target||"");voice={text:heard,confidence:e.results[0][0].confidence||0,detected:ok,score};$("input").value=heard;$("voiceStatus").textContent=ok?"I heard: "+heard:"I couldn't verify the target language yet. You can type your answer instead.";done();};r.onerror=()=>{$("voiceStatus").textContent="I couldn't hear that. Try again or type it.";voice=null};r.onend=()=>{$("voice").disabled=false};try{r.start()}catch(e){$("voiceStatus").textContent="Voice input is busy. Type instead.";}}
function renderSpeak(c){const body='<div class="phrase">'+esc(c.phrase||"")+'</div><div class="meaning">'+esc(c.prompt)+'</div><div class="listen-row"><button class="secondary" id="hear">Hear it</button></div><textarea class="input" id="input" placeholder="Type it if you prefer…"></textarea><div class="listen-row"><button class="secondary" id="voice">Speak it</button></div><div class="notice" id="voiceStatus">Speaking is practice, not a gate. You can type and continue.</div>';shell("Now say it","You have already learned the language. Now put it in your mouth.",body,'<div class="actions"><div class="notice">Aim for natural rhythm, not perfection.</div><button class="primary" id="next">Continue →</button></div>');$("hear").onclick=()=>speak(c.phrase,profile.code);$("voice").onclick=()=>speechButton(c.phrase,()=>{});$("next").onclick=()=>{const v=$("input").value.trim()||voice?.text||"";answers.push({type:"speak",response:v,voice});xp+=v?15:5;toast(v?"You used it — nice.":"Keep practicing.");advance();};}
function renderConversation(c){const body='<div class="chat" id="chat"></div><textarea class="input" id="input" placeholder="Respond naturally in the target language…"></textarea><div class="listen-row"><button class="secondary" id="voice">Speak</button></div><div class="notice" id="voiceStatus">This is the first real conversation. You can type or speak.</div>';shell("Use it","The support comes off now. Respond to the situation, then keep going.",body,'<div class="actions"><div class="notice">Stay in the scene.</div><button class="primary" id="send">Send →</button></div>');$("voice").onclick=()=>speechButton("",()=>{});conversation=[];if(c.phrase)conversation.push({role:"assistant",content:c.phrase});drawChat();$("send").onclick=sendConversation;}
function drawChat(){const box=$("chat");if(!box)return;box.innerHTML=conversation.map(m=>'<div class="bubble '+(m.role==="user"?"you":"")+'"><div class="speaker">'+(m.role==="user"?"You":"Native speaker")+'</div>'+esc(m.content)+'</div>').join("");}
async function sendConversation(){const input=$("input").value.trim()||voice?.text||"";if(!input){$("voiceStatus").textContent="Give the other person something to respond to.";return}const c=generated.cards[index],topic=baseLesson?.topic||"Everyday life";conversation.push({role:"user",content:input});$("input").value="";drawChat();$("send").disabled=true;$("voiceStatus").textContent="Thinking…";try{const res=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({language:profile.name,level:levelName(),goal:profile.goal||"Real conversation",topic,messages:conversation})});const data=await res.json();if(!res.ok)throw new Error(data.error||"Conversation failed.");conversation.push({role:"assistant",content:data.text});answers.push({type:"conversation",user:input,assistant:data.text});xp+=20;drawChat();voice=null;if(answers.filter(a=>a.type==="conversation").length>=2){$("send").textContent="Finish lesson";$("send").onclick=finish;toast("You kept the conversation going.");}$("voiceStatus").textContent="Good. Keep the interaction natural."; }catch(e){$("voiceStatus").textContent=e.message||"The conversation couldn't continue. Try again."}finally{$("send").disabled=false;}}
async function finish(){if($("card").dataset.done)return;$("card").dataset.done="1";try{if(user&&baseLesson?.id){await client.from("lesson_attempts").insert({lesson_id:baseLesson.id,score:Math.min(100,xp*2),responses:{generated_lesson:generated,answers}});await client.from("learner_events").insert({user_id:user.id,learner_language_id:profile.id,event_type:"lesson_completed",event_data:{lesson_id:baseLesson.id,xp,level:profile.level}});}}catch(e){console.error("Nahtive completion save failed:",e)}$("card").innerHTML='<section class="card complete"><h2>Lesson complete</h2><p class="sub">You learned first, practiced with support, and then used the language in a real interaction.</p><div class="xp">'+xp+' XP earned</div><div class="actions" style="justify-content:center"><a class="primary" href="dashboard.html" style="text-decoration:none">Continue learning →</a></div></section>';$("card").querySelector(".complete").style.display="block";$("stage").textContent="Complete";$("fill").style.width="100%";}
function generatedLessonMatchesLevel(lesson){const level=profile?.level||"A1";if(!["B1","B2","B2+","C1","C2"].includes(level))return true;const text=JSON.stringify(lesson?.cards||[]).toLowerCase();const basic=/\\b(hello|hi|hola|hey|bonjour|hallo|ciao|oi|good morning|good afternoon|buenos días|buenas)\\b/i;return !basic.test(text)}
function buildFallbackLesson(){
 const seed=baseLesson?.content&&typeof baseLesson.content==="object"?baseLesson.content:{};
 const level=profile?.level||"A1";
 const code=(profile?.code||"").toLowerCase().split("-")[0];
 const banks={
  es:{
   A0:["Hola","Quiero agua.","¿Dónde está el baño?"],
   A1:["Quiero pedir esto.","¿Cuánto cuesta?","¿Me puede ayudar?"],
   A2:["¿Me puedes recomendar algo?","Voy a llegar un poco tarde.","¿Qué quieres hacer este fin de semana?"],
   B1:["La verdad es que no me termina de convencer.","Déjame pensarlo un momento.","Al final, quedamos en eso."],
   B2:["No es que me parezca mala idea, pero habría que verlo con calma.","A ver si podemos encontrar un punto medio.","Por lo que entiendo, el problema no es tanto el precio como el tiempo."],
   "B2+":["Si te soy sincero, no acabo de ver por qué tendría sentido hacerlo así.","No quiero darle más vueltas de las necesarias, pero hay algo que no me cuadra.","Entiendo de dónde vienes, aunque creo que estamos enfocando el problema de otra manera."],
   C1:["No es tanto que discrepe contigo, sino que creo que estamos partiendo de supuestos distintos.","Si lo planteamos desde otra perspectiva, quizá haya una solución que nos permita avanzar sin ceder demasiado.","Lo que me llama la atención es que, sobre el papel, ambas opciones parecen razonables, pero en la práctica generan resultados muy distintos."],
   C2:["Por más razonable que suene a primera vista, esa interpretación pasa por alto una distinción bastante importante.","No pretendo llevarte la contraria por principio; simplemente creo que esa conclusión no se sostiene del todo cuando se examinan los matices.","Si queremos ser precisos, el problema no radica en la propuesta en sí, sino en las implicaciones que tendría llevarla a la práctica."]
  },
  en:{
   A0:["Hello","I want water.","Where is the bathroom?"],
   A1:["I'd like to order this.","How much is it?","Can you help me?"],
   A2:["Could you recommend something?","I'm running a little late.","What do you want to do this weekend?"],
   B1:["I'm not really sold on it.","Let me think about it for a second.","In the end, we agreed on that."],
   B2:["It's not that I think it's a bad idea, but we should think it through.","Let's see if we can meet somewhere in the middle.","As far as I can tell, the issue isn't really the price so much as the timing."],
   "B2+":["If I'm being honest, I'm not sure I see why we'd do it that way.","I don't want to overcomplicate things, but something about this doesn't add up.","I see where you're coming from, although I think we're looking at the problem differently."],
   C1:["It's not so much that I disagree with you as that I think we're starting from different assumptions.","If we frame it differently, there may be a way forward without either side giving up too much.","What strikes me is that both options look reasonable on paper, yet they produce very different results in practice."],
   C2:["For all its surface plausibility, that interpretation overlooks a rather important distinction.","I'm not disagreeing for the sake of it; I simply don't think that conclusion holds up once you examine the nuances.","To be precise, the issue isn't the proposal itself so much as the implications of putting it into practice."]
  },
  nl:{
   A0:["Hallo","Ik wil water.","Waar is de badkamer?"],
   A1:["Ik wil dit graag bestellen.","Hoeveel kost het?","Kun je me helpen?"],
   A2:["Kun je iets aanraden?","Ik ben een beetje laat.","Wat wil je dit weekend doen?"],
   B1:["Ik ben er nog niet helemaal van overtuigd.","Laat me er even over nadenken.","Uiteindelijk zijn we het daarover eens geworden."],
   B2:["Niet dat ik het een slecht idee vind, maar we moeten er rustig over nadenken.","Misschien kunnen we ergens in het midden uitkomen.","Voor zover ik het begrijp, gaat het probleem niet zozeer om de prijs als om de timing."],
   C1:["Het is niet zozeer dat ik het met je oneens ben, maar volgens mij gaan we uit van verschillende aannames.","Als we het vanuit een ander perspectief bekijken, is er misschien een oplossing waarbij niemand al te veel hoeft toe te geven.","Wat me opvalt, is dat beide opties op papier redelijk lijken, maar in de praktijk heel anders uitpakken."]
  },
