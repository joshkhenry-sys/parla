<body>
<div class="shell">
<nav><a class="logo" href="dashboard.html">Nahtive<i></i></a><a class="exit" href="dashboard.html">Exit lesson</a></nav>
<div id="loading" class="loading">Building your lesson…<br><span id="loadingDetail" class="small">Creating the scene and lesson steps.</span></div>
<div id="lesson" class="lesson" style="display:none">
<div class="lesson-header">
  <div class="lesson-head-copy">
    <div class="eyebrow"><span id="language">Language</span> · LIVE SCENE</div>
    <div class="lesson-title-row"><h1 id="title">Lesson</h1><span class="level-chip" id="levelChip">A1</span></div>
    <p id="intro"></p>
  </div>
  <div class="lesson-energy">
    <span class="energy-dot"></span><span id="xpMini">0 XP</span>
  </div>
</div>
<div class="lesson-scene">
  <div class="scene-kicker">YOU'RE HERE</div>
  <strong id="setting"></strong>
  <span id="moment"></span>
  <div class="scene-role"><span class="role-pulse"></span><span id="role"></span></div>
</div>
<div class="lesson-progress lesson-progress-clean">
  <div class="progress-top"><span id="stage">Mission</span><strong id="progressCount">1 / 15</strong></div>
  <div class="progress-track"><div class="fill" id="fill"></div></div>
</div>
<main class="main">
  <div id="card"></div>
  <div class="lesson-toast" id="toast" role="status" aria-live="polite"></div>
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const client=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);let currentLevelForPlacement="A0";
const $=id=>document.getElementById(id);
let user=null,baseLesson=null,profile=null,generated=null,index=0,answers=[],conversation=[],xp=0,voice=null;

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
let activeAudio=null;
const speechCache=new Map();

function setAudioButton(button,label,disabled=false){
  if(!button)return;
  button.disabled=disabled;
  button.textContent=label;
}

async function speak(text,lang,button){
  const phrase=String(text||"").trim().slice(0,1200);
  if(!phrase){toast("Nothing to play.");return false;}
  const locale=lang||profile?.code||"en-US";
  const original=button?.dataset.originalLabel||button?.textContent||"Listen";
  if(button)button.dataset.originalLabel=original;

  if(activeAudio){
    try{activeAudio.pause();activeAudio.currentTime=0;}catch(e){}
    activeAudio=null;
  }
  if("speechSynthesis" in window)window.speechSynthesis.cancel();

  setAudioButton(button,"Loading…",true);

  try{
    const key=locale+"|"+phrase;
    let url=speechCache.get(key);
    if(!url){
      const res=await fetch("/api/speak",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({text:phrase,language:locale})
      });
      if(!res.ok){
        const data=await res.json().catch(()=>({}));
        throw new Error(data.error||"Natural voice is unavailable.");
      }
      const blob=await res.blob();
      if(!blob.size)throw new Error("Empty audio response.");
      url=URL.createObjectURL(blob);
      speechCache.set(key,url);
    }
    const audio=new Audio(url);
    audio.preload="auto";
    activeAudio=audio;
    audio.onended=()=>{
      if(button)setAudioButton(button,original,false);
      if(activeAudio===audio)activeAudio=null;
    };
    audio.onerror=()=>{
      if(button)setAudioButton(button,original,false);
      if(activeAudio===audio)activeAudio=null;
    };
    await audio.play();
    return true;
  }catch(error){
    if("speechSynthesis" in window){
      try{
        const u=new SpeechSynthesisUtterance(phrase);
        u.lang=locale;
        u.rate=.96;
        u.pitch=1;
        u.onend=()=>setAudioButton(button,original,false);
        u.onerror=()=>setAudioButton(button,original,false);
        activeAudio=u;
        window.speechSynthesis.speak(u);
        return true;
      }catch(e){}
    }
    setAudioButton(button,original,false);
    toast(error.message||"Audio isn't available right now.");
    return false;
  }
}

function normalize(v){return String(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\p{L}\p{N} ]/gu," ").replace(/\s+/g," ").trim();}
function similarity(a,b){a=normalize(a);b=normalize(b);if(!a||!b)return 0;if(a===b)return 1;const A=[...a],B=[...b],d=Array.from({length:A.length+1},(_,i)=>i);for(let j=1;j<=B.length;j++){let p=d[0];d[0]=j;for(let i=1;i<=A.length;i++){const old=d[i],cost=A[i-1]===B[j-1]?0:1;d[i]=Math.min(d[i]+1,d[i-1]+1,p+cost);p=old}}return Math.max(0,1-d[A.length]/Math.max(A.length,B.length));}
function detected(text){const code=(profile?.code||"").toLowerCase().split("-")[0];const r={ar:/[\u0600-\u06ff]/,pl:/[ąćęłńóśźż]/i,nl:/\b(ik|je|het|een|van|voor|wat|wil|kan|niet|goed|de)\b/i,es:/\b(que|como|quiero|puedo|para|por|una|uno|el|la|me|te|donde|bien)\b/i,en:/\b(i|you|the|a|what|can|get|for|me|is|want)\b/i};return code==="ar"?r.ar.test(text):r[code]?r[code].test(text):true;}
function levelName(){return profile?.level||"A1";}
function stageName(card){return ({scene:"Scene",teach:"Learn",check:"Choose",guided:"Build",listen:"Listen",fill:"Complete",challenge:"Challenge",speak:"Speak",conversation:"Talk"})[card.type]||"Learn";}
function visualForSetting(setting){
 const key=String(setting||"").toLowerCase();
 let icon="◌", label=setting||"Real life";
 if(key.includes("coffee")){icon="☕";label="Coffee shop"}
 else if(key.includes("taco")||key.includes("restaurant")){icon="◒";label=setting}
 else if(key.includes("grocery")){icon="▦";label="Grocery store"}

function lessonSound(kind){
 try{
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C)return;
  const ctx=new C(),now=ctx.currentTime;
  const gain=ctx.createGain();
  gain.gain.setValueAtTime(0.0001,now);
  gain.connect(ctx.destination);
  const notes=kind==="correct"?[880,1174.66]:kind==="wrong"?[220,164.81]:[660];
  notes.forEach((freq,i)=>{
   const osc=ctx.createOscillator();
   osc.type="sine";
   osc.frequency.setValueAtTime(freq,now+i*.075);
   const t=now+i*.075;
   gain.gain.setValueAtTime(0.0001,t);
   gain.gain.exponentialRampToValueAtTime(kind==="wrong"?.05:.11,t+.012);
   gain.gain.exponentialRampToValueAtTime(0.0001,t+(kind==="correct"?.16:.20));
   osc.connect(gain);osc.start(t);osc.stop(t+.18);
  });
  setTimeout(()=>ctx.close().catch(()=>{}),700);
 }catch(e){}
}

async function transcribeRecording(blob,target,done){try{
  $("voiceStatus").textContent="Processing your speech…";
  const reader=new FileReader();
  reader.onloadend=async()=>{
    try{
      const dataUrl=String(reader.result||"");
      const audio=dataUrl.split(",")[1];
      if(!audio)throw new Error("No audio captured.");
      const res=await fetch("/api/transcribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({audio,mimeType:blob.type||"audio/webm",language:profile?.code||"en-US",target:target||""})});
      const data=await res.json();
      if(!res.ok)throw new Error(data.error||"Transcription failed.");
      const heard=String(data.text||"").trim();
      if(!heard)throw new Error("No speech was detected.");
      const score=similarity(heard,target||"");
      voice={text:heard,confidence:1,detected:true,score,language:profile?.code||"en-US"};
      $("input").value=heard;
      $("voiceStatus").textContent=heard?"I heard: "+heard:"No clear speech was detected. Try again.";
      done();
    }catch(e){voice=null;$("voiceStatus").textContent=e.message||"I couldn't process that recording. Try again.";}
  };
  reader.readAsDataURL(blob);
}catch(e){voice=null;$("voiceStatus").textContent="I couldn't process that recording. Try again.";}}

function speechButton(target,done){
  const preferredTypes=["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"];
  const canRecord=window.MediaRecorder&&preferredTypes.some(t=>MediaRecorder.isTypeSupported?.(t));
  if(canRecord&&navigator.mediaDevices?.getUserMedia){
    let recorder=null,chunks=[],stream=null,timer=null;
    const type=preferredTypes.find(t=>MediaRecorder.isTypeSupported?.(t))||"";
    navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}).then(s=>{
      stream=s;recorder=new MediaRecorder(stream,type?{mimeType:type}:undefined);
      $("voice").disabled=true;$("voice").textContent="Stop";$("voiceStatus").textContent="Listening…";
      recorder.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};
      recorder.onerror=()=>{$("voice").disabled=false;$("voice").textContent="Speak it";stream.getTracks().forEach(t=>t.stop());$("voiceStatus").textContent="I couldn't record that. Try again.";};
      recorder.onstop=async()=>{clearTimeout(timer);stream.getTracks().forEach(t=>t.stop());$("voice").textContent="Speak it";const blob=new Blob(chunks,{type:recorder.mimeType||type||"audio/webm"});await transcribeRecording(blob,target,done);$("voice").disabled=false;};
      recorder.start(100);
      timer=setTimeout(()=>{if(recorder?.state==="recording")recorder.stop()},12000);
    }).catch(()=>{
      $("voice").disabled=false;
      const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(SR){legacySpeechRecognition(SR,target,done)}else{$("voiceStatus").textContent="Microphone access isn't available. Check your browser permission and try again.";}
    });
    return;
  }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){legacySpeechRecognition(SR,target,done);return}
  $("voiceStatus").textContent="Microphone recording isn't available here. Check your browser permission and try again.";
}
function legacySpeechRecognition(SR,target,done){
  const r=new SR();r.lang=profile.code||"en-US";r.interimResults=false;r.maxAlternatives=3;r.continuous=false;
  r.onstart=()=>{$("voice").disabled=true;$("voiceStatus").textContent="Listening…"};
  r.onresult=e=>{const heard=e.results[0][0].transcript,ok=detected(heard),score=similarity(heard,target||"");voice={text:heard,confidence:e.results[0][0].confidence||0,detected:ok,score};$("input").value=heard;$("voiceStatus").textContent=ok?"I heard: "+heard:"I heard something, but it doesn't look like the target language yet.";done();};
  r.onerror=e=>{$("voiceStatus").textContent=e.error==="not-allowed"?"Microphone permission was blocked. Allow microphone access and try again.":"I couldn't hear that. Try again.";voice=null};
  r.onend=()=>{$("voice").disabled=false};
  try{r.start()}catch(e){$("voiceStatus").textContent="Voice input is busy. Try again.";}
}

function renderConversation(c){const body='<div class="chat" id="chat"></div><textarea class="input" id="input" placeholder="Respond naturally in the target language…"></textarea><div class="listen-row"><button class="secondary" id="voice">Speak</button></div><div class="notice" id="voiceStatus">This is the first real conversation. You can type or speak.</div>';shell("Use it","The support comes off now. Respond to the situation, then keep going.",body,'<div class="actions"><div class="notice">Stay in the scene.</div><button class="primary" id="send">Send →</button></div>');$("voice").onclick=()=>speechButton("",()=>{if(voice?.text){$("input").value=voice.text;$("voiceStatus").textContent="Heard: "+voice.text;}});conversation=[];if(c.phrase)conversation.push({role:"assistant",content:c.phrase});drawChat();$("send").onclick=sendConversation;}
function drawChat(){const box=$("chat");if(!box)return;box.innerHTML=conversation.map(m=>'<div class="bubble '+(m.role==="user"?"you":"")+'"><div class="speaker">'+(m.role==="user"?"You":"Native speaker")+'</div>'+esc(m.content)+'</div>').join("");}
async function sendConversation(){const input=$("input").value.trim()||voice?.text||"";if(!input){$("voiceStatus").textContent="Give the other person something to respond to.";return}const c=generated.cards[index],topic=baseLesson?.topic||"Everyday life";conversation.push({role:"user",content:input});$("input").value="";drawChat();$("send").disabled=true;$("voiceStatus").textContent="Thinking…";try{const res=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({language:profile.name,level:levelName(),goal:profile.goal||"Real conversation",topic,messages:conversation})});const data=await res.json();if(!res.ok)throw new Error(data.error||"Conversation failed.");conversation.push({role:"assistant",content:data.text});answers.push({type:"conversation",user:input,assistant:data.text});xp+=20;drawChat();voice=null;if(answers.filter(a=>a.type==="conversation").length>=2){$("send").textContent="Finish lesson";$("send").onclick=finish;toast("You kept the conversation going.");}$("voiceStatus").textContent="Good. Keep the interaction natural."; }catch(e){$("voiceStatus").textContent=e.message||"The conversation couldn't continue. Try again."}finally{$("send").disabled=false;}}
async function finish(){if($("card").dataset.done)return;$("card").dataset.done="1";try{if(user&&baseLesson?.id){await client.from("lesson_attempts").insert({lesson_id:baseLesson.id,score:Math.min(100,xp*2),responses:{generated_lesson:generated,answers}});await client.from("learner_events").insert({user_id:user.id,learner_language_id:profile.id,event_type:"lesson_completed",event_data:{lesson_id:baseLesson.id,xp,level:profile.level}});}}catch(e){console.error("Nahtive completion save failed:",e)}$("card").innerHTML='<section class="card complete"><h2>Lesson complete</h2><p class="sub">You learned first, practiced with support, and then used the language in a real interaction.</p><div class="xp">'+xp+' XP earned</div><div class="skill-summary"><div><strong>Situation</strong><span>'+esc(generated?.scene?.setting||"Real life")+'</span></div><div><strong>Speaking</strong><span>Attempt recorded</span></div><div><strong>Next</strong><span>Keep building the skill</span></div></div><div class="actions" style="justify-content:center"><a class="primary" href="dashboard.html" style="text-decoration:none">Continue learning →</a></div></section>';$("card").querySelector(".complete").style.display="block";$("stage").textContent="Complete";$("fill").style.width="100%";}
function generatedLessonMatchesLevel(lesson){const level=profile?.level||"A1";if(!["B1","B2","B2+","C1","C2"].includes(level))return true;const text=JSON.stringify(lesson?.cards||[]).toLowerCase();const basic=/\\b(hello|hi|hola|hey|bonjour|hallo|ciao|oi|good morning|good afternoon|buenos días|buenas)\\b/i;return !basic.test(text)}

        ["¿Cómo funciona esto?","How does this work?","KOH-moh foon-SYOH-nah ES-toh","Ask how a process or thing works."],
        ["Ah, ya entiendo.","Ah, I understand now.","ah yah en-TYEN-doh","Use it when the explanation clicks."]
      ]},

      lines:[["Local","¿Buscas algo?"],["You","Ask for a place and confirm the direction."]],
      p:[
        ["¿Cómo llego al centro?","How do I get downtown?","KOH-moh YEH-goh al SEN-troh","Ask how to get somewhere."],
        ["¿Está lejos?","Is it far?","es-TAH LEH-hos","Check the distance."],

      ]},
    {setting:"Restaurant",moment:"The waiter asks if you're ready, but you need another minute.",role:"You're deciding what to order.",goal:"Buy time, ask a question, and then make your choice.",
      lines:[["Waiter","¿Ya saben qué quieren?"],["You","You need another minute."]],
      p:[
        ["Todavía no.","Not yet.","toh-dah-BEE-ah noh","Say this when you aren't ready."],
        ["¿Qué me recomiendas?","What do you recommend?","keh meh reh-koh-MYEN-dahs","Ask for a recommendation."],
        ["Creo que voy a pedir esto.","I think I'll order this.","KREH-oh keh boy ah peh-DEER ES-toh","Use it when you've made your choice."]

      p:[

        ["¿A qué hora?","What time?","ah keh OH-rah","Ask for the key detail."],
        ["Sí, me parece bien.","Yeah, that works for me.","see meh pah-REH-seh byen","Accept the plan naturally."]
      ]}
  ];

  const generic={
    fr:[["Je voudrais ça.","I'd like this.","zhuh voo-DRAY sah"],["Tu peux m'aider ?","Can you help me?","too puh meh-DAY"],["D'accord.","Okay.","dah-KOR"]],
    nl:[["Ik wil dit.","I want this.","ik vil dit"],["Kun je me helpen?","Can you help me?","kun yuh muh HEL-pen"],["Dat is goed.","That's fine.","dat is khoot"]],

  cards.push({type:"speak",...p3,meaning:p3.meaning,prompt:"Say it yourself. Nahtive checks what it actually hears.",expected:p3.phrase,answer:p3.phrase});

async function load(){try{const {data,error}=await client.auth.getUser();if(error||!data?.user){location.href="login.html";return}user=data.user;const params=new URLSearchParams(location.search),requested=params.get("id"),saved=localStorage.getItem("Nahtive_current_learner_language");let q=client.from("learner_languages").select("id,level,is_current,languages(name,code)").eq("user_id",user.id);const {data:langs,error:langErr}=await q;if(langErr)throw langErr;if(!langs?.length){location.href="onboarding.html";return}const current=langs.find(x=>x.id===saved)||langs.find(x=>x.is_current)||langs[0];const placementResult=await client.from("learner_events").select("event_data").eq("user_id",user.id).eq("learner_language_id",current.id).eq("event_type","placement_completed").order("created_at",{ascending:false}).limit(1).maybeSingle();if(placementResult.error)throw placementResult.error;currentLevelForPlacement=current.level||"A0";if(requested){const r=await client.from("lessons").select("id,title,topic,level,content,learner_language_id,learner_languages(id,user_id,level,languages(name,code))").eq("id",requested).maybeSingle();if(r.error)throw r.error;if(!r.data||r.data.learner_languages?.user_id!==user.id)throw new Error("That lesson isn't part of your learning path.");baseLesson=r.data}else{const r=await client.from("lessons").select("id,title,topic,level,content,learner_language_id,learner_languages(id,user_id,level,languages(name,code))").eq("learner_language_id",current.id).eq("level",current.level).order("created_at",{ascending:true}).limit(50);if(r.error)throw r.error;if(r.data?.length){const a=await client.from("lesson_attempts").select("lesson_id").in("lesson_id",r.data.map(x=>x.id));const done=new Set((a.data||[]).map(x=>x.lesson_id));baseLesson=r.data.find(x=>!done.has(x.id))||r.data[0];}else{baseLesson={id:null,title:"Nahtive scene",topic:"Everyday life",level:current.level,content:{},learner_language_id:current.id,learner_languages:{id:current.id,user_id:user.id,level:current.level,languages:current.languages}};}}const linked=baseLesson.learner_languages;const placementReady=await ensurePlacement(baseLesson.learner_language_id);if(!placementReady)return;const authoritativeLevel=String(current.level||linked.level||baseLesson.level||"A0");profile={id:baseLesson.learner_language_id,name:linked.languages?.name||"Language",code:linked.languages?.code||"en-US",level:authoritativeLevel,goal:"Real conversation"};localStorage.setItem("Nahtive_current_learner_language",profile.id);const payload={...profile,targetLanguage:profile.name,nativeLanguage:"English",lessonContext:{title:baseLesson.title,topic:baseLesson.topic,level:profile.level,scene:baseLesson.content?.scene||null}};/* Render a guaranteed local lesson first. AI enhancement happens after the learner can already start. */
