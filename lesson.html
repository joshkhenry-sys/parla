<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nahtive — Lesson</title>
<style>
:root{--bg:#f7f5ef;--surface:#fffdf8;--ink:#46504b;--muted:#747c77;--line:#dddcd3;--accent:#9caf78;--accent-soft:#eef3e7;--blue:#e8f1f2;--warm:#f4e8df;--shadow:0 8px 28px rgba(54,62,58,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}.shell{width:min(1080px,calc(100% - 36px));margin:auto}
nav{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.logo{color:var(--ink);font-size:20px;font-weight:750;letter-spacing:-.6px;text-decoration:none}.logo i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:3px}.exit{font-size:13px;color:var(--muted);text-decoration:none}
.lesson{display:grid;grid-template-columns:250px 1fr;gap:58px;padding:42px 0 80px}.context{padding-top:5px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;font-weight:750;color:var(--muted)}h1{font-size:31px;line-height:1.15;letter-spacing:-1px;margin:12px 0 12px;font-weight:700}.context p{font-size:14px;color:var(--muted);margin:0;line-height:1.65}.scene{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}.scene strong{display:block;color:var(--ink);font-size:13px;margin-bottom:3px}
.main{max-width:690px}.stage{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;font-weight:750;color:#71805c;margin-bottom:9px}.bar{height:6px;background:#e5e3da;border-radius:99px;overflow:hidden;margin-bottom:28px}.fill{height:100%;width:0;background:var(--accent);transition:width .3s ease}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow)}.card h2{font-size:22px;line-height:1.25;letter-spacing:-.4px;margin:0 0 9px}.sub{color:var(--muted);font-size:14px;margin:0 0 20px}.phrase{font-size:27px;line-height:1.3;font-weight:700;letter-spacing:-.5px;margin:8px 0}.meaning{font-size:15px;margin-top:8px}.pron{font-size:13px;color:var(--muted);margin-top:7px}.usage{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:14px}.example{margin-top:15px;padding:14px 15px;background:var(--accent-soft);border-radius:11px;font-size:14px}.actions{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:22px}.primary,.secondary{border:0;border-radius:10px;padding:11px 16px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.primary{background:var(--ink);color:#fff}.secondary{background:var(--blue);color:var(--ink);border:1px solid #d5e2e3}.primary:disabled,.secondary:disabled{opacity:.45;cursor:default}.listen-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.notice{font-size:13px;color:var(--muted);min-height:20px}.options{display:grid;gap:9px;margin-top:18px}.option{padding:12px 14px;border:1px solid var(--line);background:#fff;border-radius:10px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}.option:hover{border-color:#bcc4b1}.option.correct{border-color:#9caf78;background:var(--accent-soft)}.option.wrong{border-color:#d5b3a3;background:var(--warm)}.input{width:100%;min-height:82px;resize:vertical;border:1px solid var(--line);border-radius:11px;background:#fff;padding:13px 14px;font:inherit;color:var(--ink);outline:none}.input:focus{border-color:#aeb9a0}.chat{display:grid;gap:11px;margin:18px 0}.bubble{max-width:84%;padding:12px 14px;border-radius:14px;background:#f0eee7;border:1px solid var(--line);font-size:14px}.bubble.you{margin-left:auto;background:var(--accent-soft);border-color:#d8e3cc}.speaker{font-size:10px;text-transform:uppercase;letter-spacing:.8px;font-weight:750;color:var(--muted);margin-bottom:3px}.complete{display:none;text-align:center;padding:30px 20px}.complete h2{margin-bottom:8px}.xp{font-size:14px;color:var(--muted)}.loading{text-align:center;padding:55px 20px;color:var(--muted)}.error{padding:25px}.small{font-size:12px;color:var(--muted)}
@media(max-width:760px){.lesson{grid-template-columns:1fr;gap:27px;padding-top:30px}.context{padding-bottom:23px;border-bottom:1px solid var(--line)}h1{font-size:28px}.shell{width:min(calc(100% - 28px),650px)}.card{padding:20px}.phrase{font-size:23px}.bubble{max-width:90%}}
</style>
</head>
<body>
<div class="shell">
<nav><a class="logo" href="dashboard.html">Nahtive<i></i></a><a class="exit" href="dashboard.html">Exit lesson</a></nav>
<div id="loading" class="loading">Building your lesson…<br><span id="loadingDetail" class="small">Creating the scene and lesson steps.</span></div>
<div id="lesson" class="lesson" style="display:none">
<aside class="context">
<div class="eyebrow" id="language">Language</div>
<h1 id="title">Lesson</h1>
<p id="intro"></p>
<div class="scene"><strong id="setting"></strong><span id="moment"></span><br><span id="role"></span></div>
</aside>
<main class="main">
<div class="stage" id="stage">Getting started</div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="card"></div>
</main>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const client=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
let user=null,baseLesson=null,profile=null,generated=null,index=0,answers=[],conversation=[],xp=0,voice=null;

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
function speak(text,lang){if(!text||!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang||profile?.code||"en-US";u.rate=.9;speechSynthesis.speak(u);}
function normalize(v){return String(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\p{L}\p{N} ]/gu," ").replace(/\s+/g," ").trim();}
function similarity(a,b){a=normalize(a);b=normalize(b);if(!a||!b)return 0;if(a===b)return 1;const A=[...a],B=[...b],d=Array.from({length:A.length+1},(_,i)=>i);for(let j=1;j<=B.length;j++){let p=d[0];d[0]=j;for(let i=1;i<=A.length;i++){const old=d[i],cost=A[i-1]===B[j-1]?0:1;d[i]=Math.min(d[i]+1,d[i-1]+1,p+cost);p=old}}return Math.max(0,1-d[A.length]/Math.max(A.length,B.length));}
function detected(text){const code=(profile?.code||"").toLowerCase().split("-")[0];const r={ar:/[\u0600-\u06ff]/,pl:/[ąćęłńóśźż]/i,nl:/\b(ik|je|het|een|van|voor|wat|wil|kan|niet|goed|de)\b/i,es:/\b(que|como|quiero|puedo|para|por|una|uno|el|la|me|te|donde|bien)\b/i,en:/\b(i|you|the|a|what|can|get|for|me|is|want)\b/i};return code==="ar"?r.ar.test(text):r[code]?r[code].test(text):true;}
function levelName(){return profile?.level||"A1";}
function stageName(card){return ({teach:"Learn",check:"Check understanding",guided:"Practice",speak:"Speak",conversation:"Use it"})[card.type]||"Learn";}
function render(){const cards=generated.cards||[];if(index>=cards.length){finish();return}const card=cards[index];$("stage").textContent=(index+1)+" of "+cards.length+" · "+stageName(card);$("fill").style.width=((index+1)/cards.length*100)+"%";if(card.type==="teach")renderTeach(card);else if(card.type==="check")renderCheck(card);else if(card.type==="guided")renderGuided(card);else if(card.type==="speak")renderSpeak(card);else renderConversation(card);}
function shell(title,sub,body,actions){$("card").innerHTML='<section class="card"><h2>'+esc(title)+'</h2><p class="sub">'+esc(sub||"")+'</p>'+body+actions+'</section>';}
function renderTeach(c){const body='<div class="phrase">'+esc(c.phrase)+'</div><div class="meaning">'+esc(c.meaning)+'</div><div class="pron">Pronunciation: '+esc(c.pronunciation)+' · '+esc(c.ipa)+'</div><div class="usage"><strong>When you use it</strong><br>'+esc(c.usage)+'</div><div class="example"><strong>Natural example</strong><br>'+esc(c.example)+'</div><div class="listen-row"><button class="secondary" id="hear">Hear phrase</button><button class="secondary" id="hearExample">Hear example</button></div>';shell("Learn this","Understand it before you have to produce it.",body,'<div class="actions"><div class="notice">Take a second to connect the meaning to the scene.</div><button class="primary" id="next">Continue →</button></div>');$("hear").onclick=()=>speak(c.phrase,profile.code);$("hearExample").onclick=()=>speak(c.example,profile.code);$("next").onclick=()=>{xp+=5;index++;render();};}
function renderCheck(c){let answered=false;const body='<div class="meaning">'+esc(c.prompt)+'</div><div class="options">'+(c.options||[]).map((o,i)=>'<button class="option" data-i="'+i+'">'+esc(o)+'</button>').join("")+'</div><div class="notice" id="feedback" style="margin-top:14px"></div>';shell("Quick check","No speaking here. Make sure the meaning landed.",body,'<div class="actions"><div class="notice">Choose the answer that fits the situation.</div><button class="primary" id="next" disabled>Continue →</button></div>');document.querySelectorAll(".option").forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const choice=c.options[Number(b.dataset.i)],ok=normalize(choice)===normalize(c.answer)||similarity(choice,c.answer)>.86;document.querySelectorAll(".option").forEach(x=>x.disabled=true);b.classList.add(ok?"correct":"wrong");$("feedback").textContent=ok?(c.feedback||"That's it."):("Not quite. "+(c.feedback||"The answer is "+c.answer+"."));$("next").disabled=false;xp+=ok?8:3;answers.push({type:"check",prompt:c.prompt,choice,correct:ok});});$("next").onclick=()=>{index++;render();};}
function renderGuided(c){const body='<div class="meaning">'+esc(c.prompt)+'</div><textarea class="input" id="input" placeholder="Type your answer in the target language…"></textarea><div class="notice" id="feedback" style="margin-top:12px"></div>';shell("Practice it","Build your own response before we ask you to speak.",body,'<div class="actions"><div class="notice" id="status">You can use the phrase you just learned.</div><button class="primary" id="submit">Check →</button></div>');$("submit").onclick=()=>{const v=$("input").value.trim();if(!v){$("status").textContent="Write a response first.";return}const expected=c.expected||c.answer||"";const score=expected?similarity(v,expected):.5;answers.push({type:"guided",prompt:c.prompt,response:v,expected,score});xp+=score>.55?10:6;$("feedback").textContent=score>.55?(c.feedback||"Good. That response works."):("Good start. A more natural model is: "+(expected||"Try the target phrase in your own sentence."));$("submit").textContent="Continue →";$("submit").onclick=()=>{index++;render();};};}
function speechButton(target,done){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$("voiceStatus").textContent="Voice input isn't available here. Type instead.";return}const r=new SR();r.lang=profile.code||"en-US";r.interimResults=false;r.maxAlternatives=3;r.continuous=false;r.onstart=()=>{$("voice").disabled=true;$("voiceStatus").textContent="Listening…"};r.onresult=e=>{const heard=e.results[0][0].transcript,ok=detected(heard),score=similarity(heard,target||"");voice={text:heard,confidence:e.results[0][0].confidence||0,detected:ok,score};$("input").value=heard;$("voiceStatus").textContent=ok?"I heard: "+heard:"I couldn't verify the target language yet. You can type your answer instead.";done();};r.onerror=()=>{$("voiceStatus").textContent="I couldn't hear that. Try again or type it.";voice=null};r.onend=()=>{$("voice").disabled=false};try{r.start()}catch(e){$("voiceStatus").textContent="Voice input is busy. Type instead.";}}
function renderSpeak(c){const body='<div class="phrase">'+esc(c.phrase||"")+'</div><div class="meaning">'+esc(c.prompt)+'</div><div class="listen-row"><button class="secondary" id="hear">Hear it</button></div><textarea class="input" id="input" placeholder="Type it if you prefer…"></textarea><div class="listen-row"><button class="secondary" id="voice">Speak it</button></div><div class="notice" id="voiceStatus">Speaking is practice, not a gate. You can type and continue.</div>';shell("Now say it","You have already learned the language. Now put it in your mouth.",body,'<div class="actions"><div class="notice">Aim for natural rhythm, not perfection.</div><button class="primary" id="next">Continue →</button></div>');$("hear").onclick=()=>speak(c.phrase,profile.code);$("voice").onclick=()=>speechButton(c.phrase,()=>{});$("next").onclick=()=>{const v=$("input").value.trim()||voice?.text||"";answers.push({type:"speak",response:v,voice});xp+=v?15:5;index++;render();};}
function renderConversation(c){const body='<div class="chat" id="chat"></div><textarea class="input" id="input" placeholder="Respond naturally in the target language…"></textarea><div class="listen-row"><button class="secondary" id="voice">Speak</button></div><div class="notice" id="voiceStatus">This is the first real conversation. You can type or speak.</div>';shell("Use it","The support comes off now. Respond to the situation, then keep going.",body,'<div class="actions"><div class="notice">Stay in the scene.</div><button class="primary" id="send">Send →</button></div>');$("voice").onclick=()=>speechButton("",()=>{});conversation=[];if(c.phrase)conversation.push({role:"assistant",content:c.phrase});drawChat();$("send").onclick=sendConversation;}
function drawChat(){const box=$("chat");if(!box)return;box.innerHTML=conversation.map(m=>'<div class="bubble '+(m.role==="user"?"you":"")+'"><div class="speaker">'+(m.role==="user"?"You":"Native speaker")+'</div>'+esc(m.content)+'</div>').join("");}
async function sendConversation(){const input=$("input").value.trim()||voice?.text||"";if(!input){$("voiceStatus").textContent="Give the other person something to respond to.";return}const c=generated.cards[index],topic=baseLesson?.topic||"Everyday life";conversation.push({role:"user",content:input});$("input").value="";drawChat();$("send").disabled=true;$("voiceStatus").textContent="Thinking…";try{const res=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({language:profile.name,level:levelName(),goal:profile.goal||"Real conversation",topic,messages:conversation})});const data=await res.json();if(!res.ok)throw new Error(data.error||"Conversation failed.");conversation.push({role:"assistant",content:data.text});answers.push({type:"conversation",user:input,assistant:data.text});xp+=20;drawChat();voice=null;if(answers.filter(a=>a.type==="conversation").length>=2){$("send").textContent="Finish lesson";$("send").onclick=finish;}$("voiceStatus").textContent="Good. Keep the interaction natural."; }catch(e){$("voiceStatus").textContent=e.message||"The conversation couldn't continue. Try again."}finally{$("send").disabled=false;}}
async function finish(){if($("card").dataset.done)return;$("card").dataset.done="1";try{if(user&&baseLesson?.id){await client.from("lesson_attempts").insert({lesson_id:baseLesson.id,score:Math.min(100,xp*2),responses:{generated_lesson:generated,answers}});await client.from("learner_events").insert({user_id:user.id,learner_language_id:profile.id,event_type:"lesson_completed",event_data:{lesson_id:baseLesson.id,xp,level:profile.level}});}}catch(e){console.error("Nahtive completion save failed:",e)}$("card").innerHTML='<section class="card complete"><h2>Lesson complete</h2><p class="sub">You learned first, practiced with support, and then used the language in a real interaction.</p><div class="xp">'+xp+' XP earned</div><div class="actions" style="justify-content:center"><a class="primary" href="dashboard.html" style="text-decoration:none">Continue learning →</a></div></section>';$("card").querySelector(".complete").style.display="block";$("stage").textContent="Complete";$("fill").style.width="100%";}
function showError(msg){$("loading").innerHTML="<strong>We couldn’t build this lesson.</strong><br><span class=\"small\">"+esc(msg)+"</span><br><button class=\"primary\" style=\"margin-top:16px\" onclick=\"location.reload()\">Try again</button>";}
async function load(){try{const {data,error}=await client.auth.getUser();if(error||!data?.user){location.href="login.html";return}user=data.user;const params=new URLSearchParams(location.search),requested=params.get("id"),saved=localStorage.getItem("Nahtive_current_learner_language");let q=client.from("learner_languages").select("id,level,is_current,languages(name,code)").eq("user_id",user.id);const {data:langs,error:langErr}=await q;if(langErr)throw langErr;if(!langs?.length){location.href="onboarding.html";return}const current=langs.find(x=>x.id===saved)||langs.find(x=>x.is_current)||langs[0];if(requested){const r=await client.from("lessons").select("id,title,topic,level,content,learner_language_id,learner_languages(id,user_id,level,languages(name,code))").eq("id",requested).maybeSingle();if(r.error)throw r.error;if(!r.data||r.data.learner_languages?.user_id!==user.id)throw new Error("That lesson isn't part of your learning path.");baseLesson=r.data}else{const r=await client.from("lessons").select("id,title,topic,level,content,learner_language_id,learner_languages(id,user_id,level,languages(name,code))").eq("learner_language_id",current.id).eq("level",current.level).order("created_at",{ascending:true}).limit(50);if(r.error)throw r.error;if(!r.data?.length)throw new Error("There are no lessons at this level yet.");const a=await client.from("lesson_attempts").select("lesson_id").in("lesson_id",r.data.map(x=>x.id));const done=new Set((a.data||[]).map(x=>x.lesson_id));baseLesson=r.data.find(x=>!done.has(x.id))||r.data[0];}const linked=baseLesson.learner_languages;profile={id:baseLesson.learner_language_id,name:linked.languages?.name||"Language",code:linked.languages?.code||"en-US",level:linked.level||baseLesson.level||current.level,goal:"Real conversation"};localStorage.setItem("Nahtive_current_learner_language",profile.id);const payload={...profile,targetLanguage:profile.name,nativeLanguage:"English",lessonContext:{title:baseLesson.title,topic:baseLesson.topic,level:baseLesson.level,content:baseLesson.content}};const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),60000);let api;try{api=await fetch("/api/learn",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({profile:payload}),signal:controller.signal});}catch(e){if(e.name==="AbortError")throw new Error("Lesson generation took too long. Please try again.");throw e}finally{clearTimeout(timer)}const data=await api.json().catch(()=>({}));if(!api.ok)throw new Error(data.error||"The lesson could not be built.");generated=data.lesson;$("language").textContent=profile.name+" · "+profile.level;$("title").textContent=generated.title;$("intro").textContent=generated.intro;$("setting").textContent=generated.scene.setting;$("moment").textContent=generated.scene.moment;$("role").textContent=generated.scene.learnerRole+" · Goal: "+generated.scene.goal;$("loading").style.display="none";$("lesson").style.display="grid";render();}catch(e){console.error(e);showError(e.message||"The lesson could not load.");}}
load();
</script>
</body>
</html>
