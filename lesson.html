<script>
const client=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);let currentLevelForPlacement="A0";
const $=id=>document.getElementById(id);
let user=null,baseLesson=null,profile=null,generated=null,index=0,answers=[],conversation=[],xp=0,voice=null;

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
let activeAudio=null;

function speak(text,lang,button){
  if(!text||!("speechSynthesis" in window)){toast("Audio isn't available in this browser.");return false}

  const synth=window.speechSynthesis;
  synth.cancel();

  const original=button?.textContent;
  if(button){button.disabled=true;button.textContent="Playing…";}

  const u=new SpeechSynthesisUtterance(String(text).slice(0,700));
  u.lang=lang||profile?.code||"en-US";
  u.rate=.98;
  u.pitch=1;

  // Do not wait for voices to load or search the voice list.
  // Waiting for voices is what made short examples feel slow.
  u.onend=()=>{
    if(button){button.disabled=false;button.textContent=original||"Listen";}
    if(activeAudio===u)activeAudio=null;
  };
  u.onerror=()=>{
    if(button){button.disabled=false;button.textContent=original||"Listen";}
    if(activeAudio===u)activeAudio=null;
  };

  activeAudio=u;
  synth.speak(u);
  return true;
}

function normalize(v){return String(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\p{L}\p{N} ]/gu," ").replace(/\s+/g," ").trim();}
function similarity(a,b){a=normalize(a);b=normalize(b);if(!a||!b)return 0;if(a===b)return 1;const A=[...a],B=[...b],d=Array.from({length:A.length+1},(_,i)=>i);for(let j=1;j<=B.length;j++){let p=d[0];d[0]=j;for(let i=1;i<=A.length;i++){const old=d[i],cost=A[i-1]===B[j-1]?0:1;d[i]=Math.min(d[i]+1,d[i-1]+1,p+cost);p=old}}return Math.max(0,1-d[A.length]/Math.max(A.length,B.length));}
function detected(text){const code=(profile?.code||"").toLowerCase().split("-")[0];const r={ar:/[\u0600-\u06ff]/,pl:/[ąćęłńóśźż]/i,nl:/\b(ik|je|het|een|van|voor|wat|wil|kan|niet|goed|de)\b/i,es:/\b(que|como|quiero|puedo|para|por|una|uno|el|la|me|te|donde|bien)\b/i,en:/\b(i|you|the|a|what|can|get|for|me|is|want)\b/i};return code==="ar"?r.ar.test(text):r[code]?r[code].test(text):true;}
function levelName(){return profile?.level||"A1";}
function stageName(card){return ({scene:"Scene",teach:"Learn",check:"Choose",guided:"Try it",challenge:"Twist",speak:"Say it",conversation:"Talk"})[card.type]||"Learn";}
function toast(message){const t=$("toast");if(!t)return;t.textContent=message;t.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove("show"),1500);}
function advance(){index++;render();window.scrollTo({top:0,behavior:"smooth"});}
function render(){const cards=generated.cards||[];if(index>=cards.length){finish();return}const card=cards[index];$("stage").textContent=stageName(card);$("progressCount").textContent=(index+1)+" / "+cards.length;$("fill").style.width=((index+1)/cards.length*100)+"%";$("xpMini").textContent=xp+" XP";if(card.type==="scene")renderScene(card);else if(card.type==="teach")renderTeach(card);else if(card.type==="check")renderCheck(card);else if(card.type==="guided")renderGuided(card);else if(card.type==="challenge")renderChallenge(card);else if(card.type==="speak")renderSpeak(card);else renderConversation(card);}
function shell(title,sub,body,actions){$("card").innerHTML='<section class="card lesson-card-live"><div class="lesson-card-top"><span class="lesson-live-dot"></span><span>IN THE MOMENT</span></div><div class="lesson-card-heading"><h2>'+esc(title)+'</h2><span class="lesson-step-arrow">↗</span></div><p class="sub">'+esc(sub||"")+'</p>'+body+actions+'</section>';requestAnimationFrame(()=>$("card").querySelector(".lesson-card-live")?.classList.add("entered"));}
function renderScene(c){
  const dialogue=Array.isArray(c.dialogue)?c.dialogue:[];
  const body='<div class="lesson-task-label">THE MOMENT</div>'+
    (c.context?'<div class="task-context">'+esc(c.context)+'</div>':'')+
    '<div class="mini-dialogue">'+dialogue.map(d=>'<div class="dialogue-line"><strong>'+esc(d.speaker||"")+'</strong><span>'+esc(d.text||"")+'</span></div>').join("")+'</div>'+
    '<div class="scene-goal"><strong>Your goal</strong><br>'+esc(c.goal||generated?.scene?.goal||"Handle the situation naturally.")+'</div>'+
    '<div class="listen-row"><button class="secondary" id="hearScene">Listen to the scene</button></div>';
  shell("You're in it","Don't study the language yet. First understand what is happening and what you need to accomplish.",body,'<div class="actions"><button class="primary" id="next">Start →</button></div>');
  $("hearScene").onclick=()=>speak(dialogue.map(d=>d.text||"").join(" "),profile.code,$("hearScene"));
  $("next").onclick=()=>{xp+=3;advance();};
}
function renderTeach(c){
 const body='<div class="lesson-task-label">ONE USEFUL THING</div>'+
   '<div class="phrase">'+esc(c.phrase)+'</div>'+
   '<div class="meaning">'+esc(c.meaning)+'</div>'+
   '<div class="usage"><strong>Use it when</strong><br>'+esc(c.usage)+'</div>'+
   '<div class="example"><strong>In this scene</strong><br>'+esc(c.example)+(c.exampleMeaning?'<br><span class="example-explanation">'+esc(c.exampleMeaning)+'</span>':'')+'</div>'+
   '<div class="listen-row"><button class="secondary" id="hear">Listen</button></div>';
 shell("Learn this","One expression. One job. Then you use it immediately.",body,'<div class="actions"><button class="primary" id="next">Got it →</button></div>');
 $("hear").onclick=()=>speak(c.example||c.phrase,profile.code,$("hear"));
 $("next").onclick=()=>{xp+=5;advance();};
}

function lessonSound(kind){
 try{
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C)return;
  const ctx=new C(),now=ctx.currentTime;
  const gain=ctx.createGain();
  gain.gain.setValueAtTime(0.0001,now);
  gain.connect(ctx.destination);
  const notes=kind==="correct"?[392,523.25,659.25]:kind==="wrong"?[174.61,146.83]:[329.63];
  notes.forEach((freq,i)=>{
   const osc=ctx.createOscillator();
   osc.type=kind==="wrong"?"sine":"sine";
   osc.frequency.setValueAtTime(freq,now+i*.075);
   const t=now+i*.075;
   gain.gain.setValueAtTime(0.0001,t);
   gain.gain.exponentialRampToValueAtTime(kind==="wrong"?.065:.085,t+.014);
   gain.gain.exponentialRampToValueAtTime(0.0001,t+.24);
   osc.connect(gain);osc.start(t);osc.stop(t+.18);
  });
  setTimeout(()=>ctx.close().catch(()=>{}),700);
 }catch(e){}
}
function renderCheck(c){
 let answered=false; const phrase=c.phrase||"";
 const body='<div class="lesson-task-label">SEE IT · HEAR IT · USE IT</div>'+
   '<div class="phrase">'+esc(phrase)+'</div>'+
   '<div class="pron"><strong>How to say it</strong><br>'+esc(c.pronunciation||phrase)+(c.ipa?' · '+esc(c.ipa):'')+'</div>'+
   '<div class="listen-row"><button class="secondary" id="hear">Listen</button></div>'+
   (c.example?'<div class="example"><strong>In a real conversation</strong><br>'+esc(c.example)+'</div>':'')+
   '<div class="task-question">'+esc(c.prompt||"Which line would you actually say here?")+'</div>'+
   '<div class="options">'+(c.options||[]).map((o,i)=>'<button class="option" data-i="'+i+'">'+esc(o)+'</button>').join("")+'</div>'+
   '<div class="notice feedback" id="feedback">Listen to the expression. Then choose the line you would actually say.</div>';
 shell("Use it","See the language, hear the pronunciation, and choose the response that works in the scene.",body,'<div class="actions"><button class="primary" id="next" disabled>Continue →</button></div>');
 $("hear").onclick=()=>speak(c.example||phrase,profile.code,$("hear"));
 document.querySelectorAll(".option").forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const choice=c.options[Number(b.dataset.i)]||"";const ok=normalize(choice)===normalize(c.answer)||similarity(choice,c.answer||"")>.86;document.querySelectorAll(".option").forEach(x=>x.disabled=true);b.classList.add(ok?"correct":"wrong");lessonSound(ok?"correct":"wrong");$("feedback").textContent=ok?(c.feedback||"Good. That is the natural choice for this situation."):(c.feedback||"Not quite. Listen again and notice which response fits the scene.");$("next").disabled=false;xp+=ok?8:3;answers.push({type:"check",prompt:c.prompt,choice,correct:ok});});
 $("next").onclick=()=>{lessonSound("click");toast("Good. Now use it.");advance();};
}
function renderChallenge(c){
 const options=Array.isArray(c.options)&&c.options.length?c.options:[c.expected||c.answer||"Try your own response.","Ask for clarification.","Change the situation."];
 const body='<div class="lesson-task-label">One step harder</div>'+(c.phrase?'<div class="phrase compact">'+esc(c.phrase)+'</div>':'')+'<div class="task-question">'+esc(c.prompt)+'</div><div class="options">'+options.map((o,i)=>'<button class="option" data-i="'+i+'">'+esc(o)+'</button>').join("")+'</div><div class="notice" id="feedback" style="margin-top:14px"></div>';
 shell("Challenge","The support is lighter now. Pick the response that sounds right for the moment.",body,'<div class="actions"><div class="notice">Think about meaning, tone, and what would actually work here.</div><button class="primary" id="next" disabled>Continue →</button></div>');
 let answered=false;
 document.querySelectorAll(".option").forEach(b=>b.onclick=()=>{
   if(answered)return; answered=true;
   const choice=c.options?.[Number(b.dataset.i)]||b.textContent.trim();
   const ok=normalize(choice)===normalize(c.answer)||similarity(choice,c.answer||"")>.86;
   document.querySelectorAll(".option").forEach(x=>x.disabled=true);
   b.classList.add(ok?"correct":"wrong");
   $("feedback").textContent=ok?(c.feedback||"That fits the situation."):(c.feedback||("Not quite. A more natural choice is: "+(c.answer||c.expected||"the first option.")));
   answers.push({type:"challenge",prompt:c.prompt,choice,correct:ok});
   xp+=ok?12:5; $("next").disabled=false; lessonSound(ok?"correct":"wrong");
   toast(ok?"Nice choice.":"Good attempt — notice the difference.");
 });
 $("next").onclick=()=>advance();
}
function renderGuided(c){
 const phrase=c.phrase||"";
 const target=c.expected||c.answer||phrase;
 const words=target.trim().split(/\\s+/).filter(Boolean);
 const shuffled=[...words].sort(()=>Math.random()-.5);
 let built=[];
 const renderTiles=()=>{
   const picked=$("built"),bank=$("tileBank"),submit=$("submit");
   if(!picked||!bank)return;
   picked.innerHTML=built.length?built.map((x,i)=>'<button type="button" class="word-tile picked" data-built="'+i+'">'+esc(x.w)+'</button>').join(""):'<span class="tile-placeholder">Tap the words to build your response.</span>';
   bank.innerHTML=shuffled.map((w,i)=>{const used=built.some(x=>x.i===i);return '<button type="button" class="word-tile" data-word="'+i+'" '+(used?'disabled':'')+'>'+esc(w)+'</button>';}).join("");
   if(submit)submit.disabled=built.length!==words.length;
 };
 const body='<div class="lesson-task-label">BUILD IT · YOUR TURN</div>'+
   '<div class="phrase compact">'+esc(phrase)+'</div>'+
   '<div class="pron"><strong>Say this idea</strong><br>'+esc(c.meaning||c.prompt||"Use the expression naturally.")+'</div>'+
   '<div class="listen-row"><button class="secondary" id="hear">Listen</button></div>'+
   '<div class="task-question">'+esc(c.prompt||"Build the response you would actually say.")+'</div>'+
   (c.context?'<div class="task-context">'+esc(c.context)+'</div>':'')+
   '<div class="build-zone" id="built"><span class="tile-placeholder">Tap the words to build the response.</span></div>'+
   '<div class="tile-bank" id="tileBank"></div>'+
   '<textarea class="input compact-input" id="input" placeholder="Or type your own response…"></textarea>'+
   '<div class="listen-row"><button class="secondary" id="voice">Speak your answer</button></div>'+
   '<div class="notice" id="voiceStatus">Build the response first. Then try saying it yourself.</div>'+
   '<div class="notice feedback" id="feedback"></div>';
 shell("Build it","Put the words together. You can then type or say your own version.",body,'<div class="actions"><button class="primary" id="submit" disabled>Check response →</button></div>');
 renderTiles();
 $("tileBank").onclick=e=>{
   const b=e.target.closest(".word-tile");
   if(!b||b.disabled)return;
   const i=Number(b.dataset.word);
   if(!Number.isInteger(i)||built.some(x=>x.i===i))return;
   built.push({i,w:shuffled[i]});
   renderTiles();
 };
 $("built").onclick=e=>{
   const b=e.target.closest(".word-tile");
   if(!b)return;
   const i=Number(b.dataset.built);
   if(!Number.isInteger(i)||!built[i])return;
   built.splice(i,1);
   renderTiles();
 };
 $("hear").onclick=()=>speak(c.example||phrase,profile.code,$("hear"));
 $("voice").onclick=()=>speechButton(target,()=>{});
 $("submit").onclick=()=>{
   const typed=$("input").value.trim();
   const builtText=built.map(x=>x.w).join(" ");
   const v=typed||builtText||voice?.text||"";
   if(!v){$("feedback").textContent="Build, type, or say your response first.";return}
   const score=similarity(v,target);
   const ok=score>.72;
   answers.push({type:"guided",prompt:c.prompt,response:v,expected:target,score,voice});
   $("feedback").textContent=ok?(c.feedback||"That works in the scene."):"Close. Try the order again, then say it yourself.";
   lessonSound(ok?"correct":"wrong");
   xp+=ok?15:6;
   $("submit").textContent="Continue →";
   $("submit").onclick=()=>advance();
   toast(ok?"Nice. Now make it yours.":"Good attempt.");
 };
}function speechButton(target,done){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$("voiceStatus").textContent="Voice input isn't available here. Type instead.";return}const r=new SR();r.lang=profile.code||"en-US";r.interimResults=false;r.maxAlternatives=3;r.continuous=false;r.onstart=()=>{$("voice").disabled=true;$("voiceStatus").textContent="Listening…"};r.onresult=e=>{const heard=e.results[0][0].transcript,ok=detected(heard),score=similarity(heard,target||"");voice={text:heard,confidence:e.results[0][0].confidence||0,detected:ok,score};$("input").value=heard;$("voiceStatus").textContent=ok?"I heard: "+heard:"I couldn't verify the target language yet. You can type your answer instead.";done();};r.onerror=()=>{$("voiceStatus").textContent="I couldn't hear that. Try again or type it.";voice=null};r.onend=()=>{$("voice").disabled=false};try{r.start()}catch(e){$("voiceStatus").textContent="Voice input is busy. Type instead.";}}
function renderSpeak(c){
 const target=String(c.phrase||c.expected||"").trim();
 const body='<div class="lesson-task-label">SPEAKING CHECK</div>'+
   '<div class="phrase">'+esc(target)+'</div>'+
   '<div class="meaning">'+esc(c.meaning||c.prompt||"Say the expression naturally in the situation.")+'</div>'+
   '<div class="listen-row"><button class="secondary" id="hear">Listen once</button></div>'+
   '<textarea class="input" id="input" placeholder="Type only if you cannot use your microphone…"></textarea>'+
   '<div class="listen-row"><button class="secondary" id="voice">Speak it</button></div>'+
   '<div class="notice" id="voiceStatus">Your first attempt is practice. Parla will check what it heard before giving credit.</div>'+
   '<div class="notice feedback" id="feedback"></div>';
 shell("Say it for real","You learned the expression. Now produce it without copying the answer from the screen.",body,'<div class="actions"><div class="notice">You need a real speaking attempt before continuing.</div><button class="primary" id="next" disabled>Continue →</button></div>');
 $("hear").onclick=()=>speak(target,profile.code,$("hear"));
 $("voice").onclick=()=>{
   speechButton(target,()=>{
     const heard=voice?.text||"";
     const score=voice?.score||similarity(heard,target);
     const languageOk=voice?.detected!==false;
     const good=languageOk && score>=.72;
     $("feedback").textContent=good
       ? "Good. Parla heard the target expression clearly."
       : languageOk
         ? "Not quite yet. Try once more and focus on the words you just learned."
         : "Parla could not verify the target language. Try again.";
     $("voiceStatus").textContent=heard?"Heard: "+heard:"Try again.";
     if(good){
       xp+=15;
       answers.push({type:"speak",response:heard,expected:target,score,voice,passed:true});
       $("next").disabled=false;
       $("next").textContent="Continue →";
       toast("Speaking check passed.");
     } else {
       answers.push({type:"speak",response:heard,expected:target,score,voice,passed:false});
       voice=null;
       $("next").disabled=true;
       toast("Try it again.");
     }
   });
 };
 $("next").onclick=()=>advance();
}
function renderConversation(c){const body='<div class="chat" id="chat"></div><textarea class="input" id="input" placeholder="Respond naturally in the target language…"></textarea><div class="listen-row"><button class="secondary" id="voice">Speak</button></div><div class="notice" id="voiceStatus">This is the first real conversation. You can type or speak.</div>';shell("Use it","The support comes off now. Respond to the situation, then keep going.",body,'<div class="actions"><div class="notice">Stay in the scene.</div><button class="primary" id="send">Send →</button></div>');$("voice").onclick=()=>speechButton("",()=>{});conversation=[];if(c.phrase)conversation.push({role:"assistant",content:c.phrase});drawChat();$("send").onclick=sendConversation;}
function drawChat(){const box=$("chat");if(!box)return;box.innerHTML=conversation.map(m=>'<div class="bubble '+(m.role==="user"?"you":"")+'"><div class="speaker">'+(m.role==="user"?"You":"Native speaker")+'</div>'+esc(m.content)+'</div>').join("");}
async function sendConversation(){const input=$("input").value.trim()||voice?.text||"";if(!input){$("voiceStatus").textContent="Give the other person something to respond to.";return}const c=generated.cards[index],topic=baseLesson?.topic||"Everyday life";conversation.push({role:"user",content:input});$("input").value="";drawChat();$("send").disabled=true;$("voiceStatus").textContent="Thinking…";try{const res=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({language:profile.name,level:levelName(),goal:profile.goal||"Real conversation",topic,messages:conversation})});const data=await res.json();if(!res.ok)throw new Error(data.error||"Conversation failed.");conversation.push({role:"assistant",content:data.text});answers.push({type:"conversation",user:input,assistant:data.text});xp+=20;drawChat();voice=null;if(answers.filter(a=>a.type==="conversation").length>=2){$("send").textContent="Finish lesson";$("send").onclick=finish;toast("You kept the conversation going.");}$("voiceStatus").textContent="Good. Keep the interaction natural."; }catch(e){$("voiceStatus").textContent=e.message||"The conversation couldn't continue. Try again."}finally{$("send").disabled=false;}}
async function finish(){if($("card").dataset.done)return;$("card").dataset.done="1";try{if(user&&baseLesson?.id){await client.from("lesson_attempts").insert({lesson_id:baseLesson.id,score:Math.min(100,xp*2),responses:{generated_lesson:generated,answers}});await client.from("learner_events").insert({user_id:user.id,learner_language_id:profile.id,event_type:"lesson_completed",event_data:{lesson_id:baseLesson.id,xp,level:profile.level}});}}catch(e){console.error("Nahtive completion save failed:",e)}$("card").innerHTML='<section class="card complete"><h2>Lesson complete</h2><p class="sub">You learned first, practiced with support, and then used the language in a real interaction.</p><div class="xp">'+xp+' XP earned</div><div class="actions" style="justify-content:center"><a class="primary" href="dashboard.html" style="text-decoration:none">Continue learning →</a></div></section>';$("card").querySelector(".complete").style.display="block";$("stage").textContent="Complete";$("fill").style.width="100%";}
function generatedLessonMatchesLevel(lesson){const level=profile?.level||"A1";if(!["B1","B2","B2+","C1","C2"].includes(level))return true;const text=JSON.stringify(lesson?.cards||[]).toLowerCase();const basic=/\\b(hello|hi|hola|hey|bonjour|hallo|ciao|oi|good morning|good afternoon|buenos días|buenas)\\b/i;return !basic.test(text)}
function buildFallbackLesson(){
  const level=profile?.level||"A1";
  const code=(profile?.code||"").toLowerCase().split("-")[0];
  const topic=String(baseLesson?.topic||"Everyday life");

  const spanishMissions=[
    {setting:"Coffee shop",moment:"You're late for work. The barista is waiting for your order.",role:"You're ordering quickly.",goal:"Order a drink, customize it, and react when something is unavailable.",
      lines:[["Barista","¿Qué te preparo?"],["You","You need to order and make one small change."]],
      p:[
        ["Quiero un café con leche.","I want a coffee with milk.","KYEH-roh oon kah-FEH kon LEH-cheh","Use it to place a simple order."],
