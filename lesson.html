<!doctype html>
<html lang="en">
<head>
  <script src="site-config.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nahtive — Lesson</title>
  <link rel="stylesheet" href="nahtive.css">
  <style>
    *{font-family:var(--font),Arial,sans-serif!important}
    body:has(.lesson){background:#f6f3eb!important;color:#26312d!important}
    .lesson{max-width:980px;margin:0 auto}
    .lesson-header{padding:28px 0 18px}
    .lesson-header h1{font-size:clamp(30px,4.5vw,44px);line-height:1.08;margin:8px 0;letter-spacing:-.035em}
    .lesson-header p{font-size:16px;color:#5d6863;margin:0;line-height:1.5}
    .lesson-progress{margin:4px 0 26px}
    .progress-top{display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px;color:#5d6863}
    .progress-track{height:5px;border-radius:99px;background:#dfdfd7;overflow:hidden}
    .progress-track .fill{height:100%;background:#879b68;border-radius:99px;transition:width .3s ease}
    .lesson-card{max-width:820px;margin:auto;padding:38px;border:1px solid #d8d8cf;border-radius:24px;background:#fffefa;box-shadow:0 14px 34px rgba(38,49,45,.07)}
    .kicker{font-size:11px;font-weight:800;letter-spacing:.12em;color:#667b4f;text-transform:uppercase;margin-bottom:18px}
    .context{font-size:18px;line-height:1.6;color:#26312d;margin:0}
    .context-muted{font-size:15px;line-height:1.6;color:#5d6863;margin:8px 0 0}
    .phrase{font-size:clamp(34px,5.5vw,52px);font-weight:700;line-height:1.08;letter-spacing:-.04em;margin:0 0 12px;color:#26312d}
    .meaning{font-size:20px;line-height:1.5;color:#5d6863;margin:0 0 18px}
    .detail{padding:15px 16px;border:1px solid #d8d8cf;border-radius:15px;background:#f0eee6;margin-top:10px}
    .detail-label{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#667b4f;margin-bottom:6px}
    .detail p{margin:0;color:#39443f;line-height:1.55;font-size:15px}
    .example-target{font-size:17px;color:#26312d;line-height:1.55}
    .example-meaning{font-size:14px;color:#5d6863;line-height:1.5;margin-top:4px}
    .listen-row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
    .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:26px;padding-top:20px;border-top:1px solid #d8d8cf}
    .primary,.secondary{min-height:50px;padding:12px 20px}
    .primary{background:#26312d!important;color:#fffefa!important;box-shadow:none!important}
    .secondary{background:#fffefa!important;color:#26312d!important;border:1px solid #cfd1c9!important}
    .primary:disabled{opacity:.45;cursor:not-allowed}
    .question{font-size:24px;line-height:1.4;font-weight:650;margin:0 0 20px;color:#26312d}
    .options{display:grid;gap:10px}
    .option{width:100%;min-height:60px;text-align:left;padding:14px 16px;border:1px solid #cfd1c9;border-radius:15px;background:#fffefa;color:#26312d;font-size:16px;display:flex;align-items:center;gap:12px;cursor:pointer}
    .option:hover{background:#eef2e7!important;border-color:#879b68}
    .option.correct{background:#e7eddc!important;border-color:#879b68}
    .option.wrong{background:#f5dfd7!important;border-color:#d9957f}
    .letter{width:29px;height:29px;display:grid;place-items:center;border-radius:9px;background:#edf0e9;color:#39443f;font-size:12px;font-weight:800;flex:none}
    .feedback{margin-top:14px;color:#5d6863;font-size:14px;line-height:1.5;min-height:22px}
    .speak-box{text-align:center;padding:26px;border:1px solid #d8d8cf;border-radius:18px;background:#f0eee6}
    .speak-target{font-size:30px;font-weight:700;line-height:1.2;margin:8px 0;color:#26312d}
    .speak-meaning{color:#5d6863;font-size:16px;line-height:1.5}
    .speak-button{margin-top:20px;min-width:150px;min-height:56px}
    .status{min-height:24px;margin-top:14px;color:#5d6863;font-size:14px}
    .chat{display:grid;gap:10px;margin:0 0 16px;max-height:390px;overflow:auto}
    .bubble{padding:13px 15px;border-radius:15px;background:#f0eee6;color:#26312d;line-height:1.55;border:1px solid #d8d8cf}
    .bubble.you{background:#e7eddc;border-color:#c8d5b5}
    .bubble-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#667b4f;margin-bottom:4px;font-weight:800}
    .input{width:100%;min-height:54px;resize:vertical;background:#fffefa!important;color:#26312d!important;border:1px solid #cfd1c9!important}
    .input::placeholder{color:#7a827e!important}
    .live-goal{font-size:17px;line-height:1.55;margin:0 0 18px;color:#39443f}
    .live-hint{font-size:13px;color:#5d6863;margin:0 0 16px}
    .complete{text-align:center;background:#e7eddc}
    .complete h2{font-size:34px;margin:0 0 10px;color:#26312d}
    .complete p{color:#5d6863;line-height:1.6}
    .learned-list{display:grid;gap:8px;text-align:left;margin:22px 0}
    .learned-item{padding:12px 14px;background:#fffefa;border:1px solid #d8d8cf;border-radius:12px}
    .learned-item strong{display:block;color:#26312d}
    .learned-item span{display:block;color:#5d6863;font-size:13px;margin-top:3px}
    .small{font-size:13px;color:#5d6863}
    @media(max-width:600px){
      .lesson-card{padding:26px 20px;border-radius:20px}
      .phrase{font-size:40px}
      .meaning{font-size:18px}
      .question{font-size:22px}
      .speak-target{font-size:25px}
    }
  </style>
</head>
<body>
<div class="shell">
  <nav><a class="logo" href="dashboard.html">Nahtive<i></i></a><a class="exit" href="dashboard.html">Exit lesson</a></nav>
  <div id="loading" class="loading">Loading lesson…</div>
  <div id="lesson" class="lesson" style="display:none">
    <header class="lesson-header">
      <div class="eyebrow"><span id="language">Language</span> · LESSON</div>
      <h1 id="title">Lesson</h1>
      <p id="intro">Understand it. Use it. Then talk.</p>
    </header>
    <div class="lesson-progress">
      <div class="progress-top"><span id="stage">Situation</span><strong id="count"></strong></div>
      <div class="progress-track"><div class="fill" id="fill"></div></div>
    </div>
    <main id="card"></main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
"use strict";

const client=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
let user=null,profile=null,baseLesson=null,lesson=null,index=0,answers=[],conversation=[],recorder=null,recordingChunks=[],finished=false;

function normalizePhrase(raw){
  if(Array.isArray(raw)){
    return {
      target:String(raw[0]??"").trim(),
      meaning:String(raw[1]??"").trim(),
      usage:String(raw[2]??"").trim(),
      breakdown:[],
      example:String(raw[3]??"").trim(),
      example_meaning:"",
      pronunciation:""
    };
  }
  if(raw&&typeof raw==="object"){
    return {
      target:String(raw.target??raw.phrase??"").trim(),
      meaning:String(raw.meaning??"").trim(),
      usage:String(raw.usage??"").trim(),
      breakdown:Array.isArray(raw.breakdown)?raw.breakdown:[],
      example:String(raw.example??"").trim(),
      example_meaning:String(raw.example_meaning??"").trim(),
      pronunciation:String(raw.pronunciation??"").trim()
    };
  }
  return {target:String(raw??"").trim(),meaning:"",usage:"",breakdown:[],example:"",example_meaning:"",pronunciation:""};
}

function normalizeDialogue(raw){
  if(!Array.isArray(raw))return [];
  return raw.map((line,i)=>{
    if(typeof line==="string")return {speaker:i%2===0?"native":"learner",text:line.trim()};
    return {
      speaker:String(line?.speaker||"").toLowerCase(),
      text:String(line?.text||"").trim()
    };
  }).filter(x=>x.text);
}

/*
  One content contract for every lesson version.
  Old lessons used [target, meaning].
  New lessons use {target, meaning, usage, example}.
  The UI never needs to know which version it received.
*/
function normalizeLesson(row){
  const data=row?.content&&typeof row.content==="object"?row.content:{};
  const rawPhrases=Array.isArray(data.phrases)?data.phrases:[];
  const phrases=rawPhrases.map(normalizePhrase).filter(x=>x.target);
  const dialogue=normalizeDialogue(data.dialogue);
  const scene=data.scene&&typeof data.scene==="object"?data.scene:{};
  const language=data.language&&typeof data.language==="object"?data.language:{};

  if(!phrases.length&&language.phrase){
    phrases.push({
      target:String(language.phrase),
      meaning:String(language.meaning||""),
      usage:String(language.usage||""),
      example:""
    });
  }

  const native=dialogue.filter(x=>x.speaker==="native");
  const learners=dialogue.filter(x=>x.speaker==="learner");

  const setting=String(scene.place||row.topic||"Everyday situation").trim();
  const situation=String(scene.situation||scene.time||"A real-world interaction.").trim();
  const mission=String(scene.mission||"Handle the situation naturally.").trim();

  return {
    title:String(row.title||setting||"Lesson"),
    topic:String(row.topic||setting),
    setting,situation,mission,
    phrases:phrases.slice(0,6),
    dialogue,
    native,
    learners,
    opening:native[0]?.text||"",
    language
  };
}

function choosePhrases(content){
  const list=content.phrases.slice(0,3);
  if(list.length)return list;

  const fromDialogue=content.dialogue
    .map(x=>x.text)
    .filter(Boolean)
    .slice(0,3)
    .map(x=>({target:x,meaning:"A useful expression from this situation.",usage:"Use it when the situation calls for it.",example:""}));

  return fromDialogue;
}

function makeChoices(correct,alternatives){
  const unique=[correct,...alternatives].filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i);
  const fillers=[
    "Maybe another time.",
    "I'm just looking around.",
    "That sounds good.",
    "I'm not sure yet."
  ];
  for(const f of fillers)if(unique.length<4&&!unique.includes(f))unique.push(f);
  return unique.slice(0,4).sort(()=>Math.random()-.5);
}

function buildLesson(row){
  const c=normalizeLesson(row);
  const p=choosePhrases(c);
  if(!p.length)throw new Error("This lesson does not contain usable phrases yet.");

  const cards=[{type:"scene",stage:"Situation",setting:c.setting,situation:c.situation,mission:c.mission}];

  p.forEach((phrase,i)=>{
    cards.push({type:"phrase",stage:i===0?"Learn":"Build",phrase});
    cards.push({
      type:"recall",
      stage:"Recall",
      phrase,
      question:"Which phrase means “"+phrase.meaning+"”?",
      choices:makeChoices(phrase.target,p.filter(x=>x!==phrase).map(x=>x.target))
    });
  });

  cards.push({type:"speak",stage:"Say it",phrase:p[p.length-1]});
  cards.push({type:"live",stage:"Live it",setting:c.setting,mission:c.mission,opening:c.opening});

  return {...c,phrases:p,cards};
}

function browserSpeak(text){
  const value=String(text||"").trim();
  if(!value||!("speechSynthesis" in window))return;
  try{
    speechSynthesis.cancel();
    const utterance=new SpeechSynthesisUtterance(value);
    const map={es:"es-MX",fr:"fr-FR",nl:"nl-NL",de:"de-DE",pt:"pt-BR",pl:"pl-PL",it:"it-IT",ar:"ar-SA",ja:"ja-JP",ko:"ko-KR",zh:"zh-CN",en:"en-US",sv:"sv-SE",el:"el-GR",tr:"tr-TR",hi:"hi-IN"};
    utterance.lang=map[profile?.code]||profile?.code||"en-US";
    utterance.rate=.96;
    speechSynthesis.speak(utterance);
  }catch(e){console.warn("Speech unavailable",e)}
}

function stopRecognition(){
  if(recorder){
    try{if(recorder.state!=="inactive")recorder.stop()}catch(e){}
  }
  recorder=null;
  recordingChunks=[];
}

function blobToBase64(blob){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onloadend=()=>resolve(String(reader.result||"").split(",")[1]||"");
    reader.onerror=reject;
    reader.readAsDataURL(blob);
  });
}

async function transcribeBlob(blob,target=""){
  const audio=await blobToBase64(blob);
  if(!audio)throw new Error("No recording captured.");
  const res=await fetch("/api/transcribe",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      audio,
      mimeType:blob.type||"audio/webm",
      language:profile?.code||"en-US",
      target
    })
  });
  const data=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(data.error||"Speech transcription failed.");
  return String(data.text||"").trim();
}

async function startRecognition(done,target=""){
  stopRecognition();
  if(!navigator.mediaDevices?.getUserMedia||!("MediaRecorder" in window)){
    done("",new Error("Microphone recording is not supported in this browser."));
    return;
  }

  let stream;
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const preferred=[
      "audio/webm;codecs=opus",
      "audio/webm",
      "audio/mp4"
    ].find(type=>MediaRecorder.isTypeSupported(type));
    recorder=new MediaRecorder(stream,preferred?{mimeType:preferred}:undefined);
    recordingChunks=[];
    recorder.ondataavailable=e=>{if(e.data?.size)recordingChunks.push(e.data)};
    recorder.onerror=()=>done("",new Error("Recording failed."));
    recorder.onstop=async()=>{
      const activeRecorder=recorder;
      recorder=null;
      stream.getTracks().forEach(track=>track.stop());
      try{
        const blob=new Blob(recordingChunks,{type:activeRecorder?.mimeType||"audio/webm"});
        recordingChunks=[];
        const text=await transcribeBlob(blob,target);
        done(text);
      }catch(error){
        recordingChunks=[];
        done("",error);
      }
    };
    recorder.start();
  }catch(error){
    if(stream)stream.getTracks().forEach(track=>track.stop());
    recorder=null;
    done("",error);
  }
}

function normalizeForSpeech(value){
  return String(value||"").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9\u0600-\u06ff ]/g," ")
    .replace(/\s+/g," ").trim();
}

function similarity(a,b){
  const A=normalizeForSpeech(a).split(" ").filter(Boolean);
  const B=normalizeForSpeech(b).split(" ").filter(Boolean);
  if(!A.length||!B.length)return 0;
  const counts={};
  B.forEach(x=>counts[x]=(counts[x]||0)+1);
  let hits=0;
  A.forEach(x=>{if(counts[x]>0){hits++;counts[x]--}});
  return hits/Math.max(A.length,B.length);
}

function frame(body,action){
  $("card").innerHTML='<section class="lesson-card">'+body+(action?'<div class="actions">'+action+"</div>":"")+"</section>";
}

function updateProgress(){
  const total=lesson.cards.length;
  $("stage").textContent=lesson.cards[index]?.stage||"Complete";
  $("count").textContent=index<total?(index+1)+" / "+total:"";
  $("fill").style.width=Math.min(100,(index/total)*100)+"%";
}

function next(){
  index++;
  updateProgress();
  render();
}

function render(){
  if(finished)return;
  if(index>=lesson.cards.length){finish();return}
  updateProgress();
  const c=lesson.cards[index];
  if(c.type==="scene")renderScene(c);
  else if(c.type==="phrase")renderPhrase(c);
  else if(c.type==="recall")renderRecall(c);
  else if(c.type==="speak")renderSpeak(c);
  else renderLive(c);
}

function renderScene(c){
  frame(
    '<div class="kicker">Before you start</div>'+
    '<p class="context"><strong>'+esc(c.setting)+'</strong></p>'+
    '<p class="context-muted">'+esc(c.situation)+'</p>'+
    '<div class="detail"><div class="detail-label">Your goal</div><p>'+esc(c.mission)+'</p></div>',
    '<button class="primary" id="next">Start lesson →</button>'
  );
  $("next").onclick=next;
}

function renderPhrase(c){
  const p=c.phrase;
  const usage=p.usage||"Use this when the situation calls for it.";
  const example=p.example||"";
  const breakdown=Array.isArray(p.breakdown)?p.breakdown.filter(x=>x&&x.target):[];
  frame(
    '<div class="kicker">'+esc(c.stage)+'</div>'+
    '<p class="phrase">'+esc(p.target)+'</p>'+
    '<p class="meaning">'+esc(p.meaning||"A useful expression for this situation.")+'</p>'+
    '<div class="detail"><div class="detail-label">What you are saying</div><p>'+esc(p.meaning||"")+'</p></div>'+
    '<div class="detail"><div class="detail-label">When you use it</div><p>'+esc(usage)+'</p></div>'+
    (breakdown.length?'<div class="detail"><div class="detail-label">Break it down</div>'+breakdown.map(x=>'<p style="margin:6px 0"><strong>'+esc(x.target)+'</strong> — '+esc(x.meaning)+'</p>').join("")+'</div>':"")+
    (p.pronunciation?'<div class="detail"><div class="detail-label">Pronunciation</div><p>'+esc(p.pronunciation)+'</p></div>':"")+
    (example?'<div class="detail"><div class="detail-label">Natural example</div><p class="example-target">'+esc(example)+'</p>'+(p.example_meaning?'<p class="example-meaning">'+esc(p.example_meaning)+'</p>':"")+'</div>':"")+
    '<div class="listen-row"><button class="secondary" id="listen">Listen</button></div>',
    '<button class="primary" id="next">I understand →</button>'
  );
  $("listen").onclick=()=>browserSpeak(p.target);
  $("next").onclick=next;
  browserSpeak(p.target);
}

function renderRecall(c){
  const choices=c.choices;
  frame(
    '<div class="kicker">Recall</div>'+
    '<p class="question">'+esc(c.question)+'</p>'+
    '<div class="options">'+choices.map((o,i)=>
      '<button class="option" data-value="'+esc(o)+'"><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+esc(o)+'</span></button>'
    ).join("")+'</div>'+
    '<div class="feedback" id="feedback"></div>',
    '<button class="primary" id="next" disabled>Continue →</button>'
  );

  let answered=false;
  document.querySelectorAll(".option").forEach(btn=>btn.onclick=()=>{
    if(answered)return;
    answered=true;
    const ok=btn.dataset.value===c.phrase.target;
    btn.classList.add(ok?"correct":"wrong");
    document.querySelectorAll(".option").forEach(x=>x.disabled=true);
    $("feedback").textContent=ok
      ?"That’s the expression that fits."
      :"The phrase you want here is: "+c.phrase.target;
    $("next").disabled=false;
    answers.push({type:"recall",target:c.phrase.target,choice:btn.dataset.value,correct:ok});
  });
  $("next").onclick=next;
}

function renderSpeak(c){
  const p=c.phrase;
  frame(
    '<div class="kicker">Say it</div>'+
    '<div class="speak-box">'+
      '<div class="speak-target">'+esc(p.target)+'</div>'+
      '<div class="speak-meaning">'+esc(p.meaning||"Say it naturally, without translating first.")+'</div>'+
      '<button class="primary speak-button" id="speak">Speak</button>'+
      '<div class="status" id="status">Say the phrase naturally.</div>'+
    '</div>',
    '<button class="primary" id="next" disabled>Continue →</button>'
  );

  $("speak").onclick=async()=>{
    $("speak").disabled=true;
    $("status").textContent="Recording…";
    await startRecognition((text,error)=>{
      if(!text){
        $("status").textContent=error?.message||"I didn’t catch that. Try again.";
        $("speak").disabled=false;
        return;
      }
      const score=similarity(text,p.target);
      answers.push({type:"speak",target:p.target,heard:text,score});
      $("status").textContent="Heard: "+text;
      if(score>=.7){
        $("next").disabled=false;
      }else{
        $("status").textContent="Heard: "+text+" — try it once more.";
        $("speak").disabled=false;
      }
    },p.target);
  };
  $("next").onclick=next;
}

function drawChat(){
  $("chat").innerHTML=conversation.map(m=>
    '<div class="bubble '+(m.role==="user"?"you":"")+'">'+
      '<div class="bubble-label">'+(m.role==="user"?"You":"Native speaker")+'</div>'+
      esc(m.content)+
    "</div>"
  ).join("");
  $("chat").scrollTop=$("chat").scrollHeight;
}

function localReply(c,turn){
  const native=c.native||[];
  if(native.length)return native[Math.min(turn-1,native.length-1)].text;
  return turn===1
    ?"Great. Go ahead — what would you say?"
    :"Keep going. Respond naturally to the situation.";
}

async function sendLive(){
  const input=$("input").value.trim();
  if(!input)return;
  const turn=conversation.filter(x=>x.role==="user").length+1;
  const c=lesson.cards[index];
  conversation.push({role:"user",content:input});
  $("input").value="";
  drawChat();
  $("send").disabled=true;
  $("status").textContent="Thinking…";

  let reply="";
  try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),7000);
    const res=await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        language:profile.name,
        level:profile.level,
        goal:c.mission,
        topic:c.setting,
        context:{setting:c.setting,goal:c.mission,openingLine:c.opening},
        messages:conversation
      }),
      signal:controller.signal
    });
    clearTimeout(timer);
    const data=await res.json().catch(()=>({}));
    if(!res.ok||!data.text)throw new Error("chat failed");
    reply=String(data.text);
  }catch(e){
    reply=localReply(normalizeLesson(baseLesson),turn);
  }

  conversation.push({role:"assistant",content:reply});
  drawChat();
  browserSpeak(reply);

  if(turn>=3){
    $("send").textContent="Finish lesson";
    $("send").disabled=false;
    $("send").onclick=finish;
    $("status").textContent="Good. You handled the situation.";
  }else{
    $("send").disabled=false;
    $("status").textContent="Keep the conversation moving.";
  }
}

function renderLive(c){
  conversation=[];
  const opening=c.opening||"Go ahead. What would you say?";
  if(opening)conversation.push({role:"assistant",content:opening});

  frame(
    '<div class="kicker">Live conversation</div>'+
    '<p class="live-goal"><strong>'+esc(c.setting)+'</strong><br>'+esc(c.mission)+'</p>'+
    '<p class="live-hint">Say or type what you would actually say. Don’t worry about being perfect.</p>'+
    '<div class="chat" id="chat"></div>'+
    '<textarea class="input" id="input" placeholder="What would you say?"></textarea>'+
    '<div class="actions"><button class="secondary" id="voice">Speak</button><button class="primary" id="send">Respond →</button></div>'+
    '<div class="feedback" id="status">The other person is waiting.</div>'
  );

  drawChat();
  if(opening)browserSpeak(opening);

  $("voice").onclick=async()=>{
    $("voice").disabled=true;
    $("status").textContent="Recording…";
    await startRecognition((text,error)=>{
      $("voice").disabled=false;
      if(text){
        $("input").value=text;
        $("status").textContent="Heard: "+text;
      }else{
        $("status").textContent=error?.message||"I didn’t catch that. Try again.";
      }
    });
  };
  $("send").onclick=sendLive;
  $("input").addEventListener("keydown",e=>{
    if((e.metaKey||e.ctrlKey)&&e.key==="Enter")sendLive();
  });
}

async function saveLearning(){
  if(!user||!baseLesson?.id)return;
  const c=normalizeLesson(baseLesson);
  const rows=c.phrases.slice(0,3);
  for(const p of rows){
    if(!p.target)continue;
    try{
      const existing=await client.from("review_items")
        .select("id,mastery")
        .eq("learner_language_id",profile.id)
        .eq("target_text",p.target)
        .eq("item_type","expression")
        .limit(1)
        .maybeSingle();

      if(existing.data?.id){
        await client.from("review_items")
          .update({
            source_text:p.meaning||p.target,
            explanation:p.usage||p.meaning||null,
            mastery:Math.min(100,Number(existing.data.mastery||0)+12),
            updated_at:new Date().toISOString()
          })
          .eq("id",existing.data.id);
      }else{
        await client.from("review_items").insert({
          learner_language_id:profile.id,
          item_type:"expression",
          source_text:p.meaning||p.target,
          target_text:p.target,
          explanation:p.usage||p.meaning||null,
          mastery:12,
          next_review_at:new Date(Date.now()+86400000).toISOString()
        });
      }
    }catch(e){console.warn("phrase memory save failed",e)}
  }
}

async function finish(){
  if(finished)return;
  finished=true;
  stopRecognition();

  try{
    await saveLearning();
    if(user&&baseLesson?.id){
      const recall=answers.filter(x=>x.type==="recall");
      const speech=answers.filter(x=>x.type==="speak");
      const score=Math.round(
        (recall.length?recall.filter(x=>x.correct).length/recall.length:1)*50+
        (speech.length?Math.min(1,Math.max(...speech.map(x=>x.score||0))):0)*50
      );
      await client.from("lesson_attempts").insert({
        lesson_id:baseLesson.id,
        score,
        responses:{answers,score}
      });
    }
  }catch(e){console.warn("lesson completion save failed",e)}

  $("stage").textContent="Complete";
  $("count").textContent="";
  $("fill").style.width="100%";

  const phrases=normalizeLesson(baseLesson).phrases.slice(0,3);
  $("card").innerHTML=
    '<section class="lesson-card complete">'+
      '<div class="kicker">Finished</div>'+
      '<h2>That’s the lesson.</h2>'+
      '<p>You learned useful language, recalled it, said it, and used it in context.</p>'+
      '<div class="learned-list">'+phrases.map(p=>
        '<div class="learned-item"><strong>'+esc(p.target)+'</strong><span>'+esc(p.meaning)+'</span></div>'
      ).join("")+'</div>'+
      '<a class="primary" href="dashboard.html" style="display:inline-flex;text-decoration:none">Continue learning →</a>'+
    '</section>';
}

async function load(){
  try{
    const sessionResult=await Promise.race([
      client.auth.getSession(),
      new Promise((_,reject)=>setTimeout(()=>reject(new Error("Session check timed out.")),6000))
    ]);
    if(sessionResult.error||!sessionResult.data?.session?.user){
      location.href="login.html";
      return;
    }
    user=sessionResult.data.session.user;

    const saved=localStorage.getItem("Nahtive_current_learner_language");
    const langResult=await Promise.race([
      client.from("learner_languages").select("id,level,is_current,languages(name,code)").eq("user_id",user.id),
      new Promise((_,reject)=>setTimeout(()=>reject(new Error("Language data timed out.")),6000))
    ]);
    if(langResult.error)throw langResult.error;
    const langs=langResult.data||[];
    if(!langs.length){location.href="onboarding.html";return}

    const current=langs.find(x=>x.id===saved)||langs.find(x=>x.is_current)||langs[0];
    localStorage.setItem("Nahtive_current_learner_language",current.id);

    const requested=new URLSearchParams(location.search).get("id");
    if(requested){
      const r=await client.from("lessons")
        .select("id,title,topic,level,content,learner_language_id,curriculum_node_id,created_at,learner_languages(id,user_id,level,languages(name,code)),curriculum_nodes(sequence_number,stage_name,title,situation,focus)")
        .eq("id",requested)
        .maybeSingle();
      if(r.error)throw r.error;
      if(!r.data||r.data.learner_languages?.user_id!==user.id)throw new Error("This lesson is not available.");
      baseLesson=r.data;
    }else{
      const r=await client.from("lessons")
        .select("id,title,topic,level,content,learner_language_id,curriculum_node_id,created_at,learner_languages(id,user_id,level,languages(name,code)),curriculum_nodes(sequence_number,stage_name,title,situation,focus)")
        .eq("learner_language_id",current.id)
        .order("created_at",{ascending:true})
        .limit(120);
      if(r.error)throw r.error;
      const lessons=(r.data||[]).filter(x=>{
        const phrases=Array.isArray(x?.content?.phrases)?x.content.phrases:[];
        const dialogue=Array.isArray(x?.content?.dialogue)?x.content.dialogue:[];
        return phrases.length>=2 &&
          phrases.slice(0,2).every(p=>p && typeof p==="object" && p.target && p.meaning && p.usage && p.example && Array.isArray(p.breakdown) && p.breakdown.length) &&
          dialogue.length>=4;
      });
      if(!lessons.length) {
        window.location.href="dashboard.html";
        return;
      }

      const ids=lessons.map(x=>x.id);
      const attempts=await client.from("lesson_attempts").select("lesson_id").in("lesson_id",ids);
      const completed=new Set((attempts.data||[]).map(x=>x.lesson_id));

      lessons.sort((a,b)=>{
        const as=Number(a.curriculum_nodes?.sequence_number||9999);
        const bs=Number(b.curriculum_nodes?.sequence_number||9999);
        return as-bs||new Date(a.created_at)-new Date(b.created_at);
      });

      baseLesson=lessons.find(x=>!completed.has(x.id))||lessons[lessons.length-1];
    }

    const linked=baseLesson.learner_languages;
    profile={
      id:linked.id,
      name:linked.languages?.name||"Language",
      code:linked.languages?.code||"en-US",
      level:String(baseLesson.level||linked.level||"A1")
    };

    lesson=buildLesson(baseLesson);
    if(!lesson.cards.length)throw new Error("This lesson has no usable learning content yet.");

    $("language").textContent=profile.name+" · "+profile.level;
    $("title").textContent=lesson.title;
    $("intro").textContent=baseLesson.curriculum_nodes?.stage_name
      ?baseLesson.curriculum_nodes.stage_name+" · "+(baseLesson.curriculum_nodes.focus||"Real conversation")
      :"Understand it. Use it. Then talk.";

    $("loading").style.display="none";
    $("lesson").style.display="block";
    render();
  }catch(e){
    console.error("Nahtive lesson load failed:",e);
    $("loading").innerHTML=
      '<strong>We couldn’t load this lesson.</strong><br>'+
      '<span class="small">'+esc(e?.message||"Please try again.")+'</span><br>'+
      '<button class="primary" style="margin-top:16px" onclick="location.reload()">Try again</button>';
  }
}

load();
</script>
</body>
</html>
