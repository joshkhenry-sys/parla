<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=20261023bb">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signing you in | Nahtive</title>
  <script src="site-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f5ef;color:#171717;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{text-align:center;padding:32px}
    .mark{font-size:28px;font-weight:800;letter-spacing:-.04em}
    .mark span{font-size:14px}
    p{color:#666;margin-top:12px}
    #error{display:none;max-width:520px;line-height:1.5}
    a{color:inherit}
  </style>
<style id="nahtive-brand-style">.nahtive-logo{display:block;width:clamp(132px,16vw,174px);height:auto;max-width:100%}a.logo:has(>.nahtive-logo),a.brand:has(>.nahtive-logo),.nahtive-brand{display:inline-flex;align-items:center;flex:none;line-height:0;text-decoration:none}.nahtive-brand{position:fixed;top:22px;left:24px;z-index:10}@media(max-width:520px){.nahtive-logo{width:132px}.nahtive-brand{top:16px;left:16px}}</style>
  <link rel="stylesheet" href="nahtive-brand.css?v=20261023">
</head>
<body><a href="index.html" class="nahtive-brand" aria-label="Nahtive home"><img src="Gradient%20Ribbon%20N%20Logo.jpg" alt="Nahtive" class="nahtive-logo"></a>
  <main>
    <div class="mark">nahtive<span>•</span></div>
    <p id="status">Finishing your sign in…</p>
    <p id="error"></p>
  </main>
  <script>
    const client = window.supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_ANON_KEY
    );

    const status = document.getElementById("status");
    const errorEl = document.getElementById("error");

    function showError(message) {
      status.textContent = "We couldn't finish signing you in.";
      errorEl.textContent = message || "Please return to Nahtive and try again.";
      errorEl.style.display = "block";
    }

    function getDestination() {
      const saved = localStorage.getItem("nahtive_auth_next");
      localStorage.removeItem("nahtive_auth_next");
      return saved || "dashboard.html";
    }

    function go(session) {
      if (!session) return;
      const pending = session.user?.user_metadata?.nahtive_onboarding_pending;
      const destination = getDestination();
      window.location.replace(
        pending && !destination.startsWith("onboarding.html")
          ? "onboarding.html?resume=1"
          : destination
      );
    }

    client.auth.onAuthStateChange((event, session) => {
      if (event === "SIGNED_IN" || event === "INITIAL_SESSION") {
        if (session) go(session);
      }
    });

    (async () => {
      const hash = new URLSearchParams(window.location.hash.slice(1));
      const query = new URLSearchParams(window.location.search);
      const authError = hash.get("error_description") || query.get("error_description");
      if (authError) {
        showError(authError.replace(/\+/g, " "));
        return;
      }

      const { data, error } = await client.auth.getSession();
      if (error) {
        showError(error.message);
        return;
      }
      if (data.session) {
        go(data.session);
        return;
      }

      setTimeout(async () => {
        const retry = await client.auth.getSession();
        if (retry.data?.session) {
          go(retry.data.session);
        } else {
          showError("No active session was returned by Supabase. Please try signing in again.");
        }
      }, 1200);
    })();
  </script>
</body>
</html>
